name: Validate structural quality cleanup
on:
  push:
    branches: [feat/web-card-game-quality-foundation]
    paths: [.github/workflows/apply-hemsfell-brand.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Wrap single-statement control bodies
        run: |
          node --input-type=module <<'NODE'
          import ts from 'typescript'; import {readFile,writeFile,readdir} from 'node:fs/promises'; import path from 'node:path';
          const roots=['app','worker','db','scripts'], exts=new Set(['.ts','.tsx','.js','.mjs','.cjs']), files=[];
          async function walk(d){for(const e of await readdir(d,{withFileTypes:true})){const f=path.join(d,e.name);if(e.isDirectory())await walk(f);else if(exts.has(path.extname(f)))files.push(f)}} for(const r of roots)await walk(r);
          let total=0,changed=0;
          for(const file of files){const text=await readFile(file,'utf8'),sf=ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true,file.endsWith('.tsx')?ts.ScriptKind.TSX:file.endsWith('.ts')?ts.ScriptKind.TS:ts.ScriptKind.JS),edits=new Map();
            const add=(p,s)=>edits.set(p,(edits.get(p)||'')+s),wrap=s=>{if(!s||ts.isBlock(s)||ts.isEmptyStatement(s))return;add(s.getStart(sf),'{');add(s.end,'}');total++};
            const visit=n=>{if(ts.isIfStatement(n)){wrap(n.thenStatement);if(n.elseStatement&&!ts.isIfStatement(n.elseStatement))wrap(n.elseStatement)}else if(ts.isForStatement(n)||ts.isForInStatement(n)||ts.isForOfStatement(n)||ts.isWhileStatement(n)||ts.isDoStatement(n))wrap(n.statement);ts.forEachChild(n,visit)};visit(sf);
            if(!edits.size)continue;let out=text;for(const [p,s] of [...edits].sort((a,b)=>b[0]-a[0]))out=out.slice(0,p)+s+out.slice(p);if(out!==text){await writeFile(file,out);changed++}}
          console.log(`wrapped=${total} files=${changed}`);
          NODE
      - name: Rename false-positive hook helpers
        run: |
          sed -i 's/useDevelopmentStore/shouldUseDevelopmentStore/g' app/api/rooms/store-runtime.ts
          sed -i 's/useMemoryStore/shouldUseMemoryStore/g' app/api/rooms/store.ts
      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-hemsfell-brand.yml
      - run: git diff --check
      - name: Rules suite
        run: npm run test:rules
      - name: AI benchmark
        run: npm run ai:calibrate:benchmark
      - name: Production build
        run: npm run vercel-build
      - name: Show diff stats
        run: git diff --stat -- app worker db scripts
