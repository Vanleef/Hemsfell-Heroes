name: Evaluate safe SonarJS autofixes

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - .github/workflows/apply-hemsfell-brand.yml

permissions:
  contents: read

jobs:
  sonar-autofix-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install diagnostic analyzers without changing lockfile
        run: npm install --no-save --package-lock=false eslint-plugin-sonarjs@3.0.5 jscpd@4.0.5

      - name: Build full SonarJS audit configuration
        run: |
          cat > eslint.sonar-audit.config.mjs <<'EOF'
          import base from "./eslint.config.mjs";
          import sonarjs from "eslint-plugin-sonarjs";

          export default [
            ...base,
            {
              files: [
                "app/**/*.{js,mjs,cjs,ts,tsx}",
                "worker/**/*.{js,mjs,cjs,ts,tsx}",
                "db/**/*.{js,mjs,cjs,ts,tsx}",
                "scripts/**/*.{js,mjs,cjs,ts,tsx}",
              ],
              plugins: { sonarjs },
              rules: {
                ...sonarjs.configs.recommended.rules,
                "sonarjs/cognitive-complexity": ["warn", 15],
              },
            },
          ];
          EOF

      - name: Capture baseline
        shell: bash
        run: |
          mkdir -p quality-report
          set +e
          npx eslint app worker db scripts --config eslint.sonar-audit.config.mjs --format json --no-error-on-unmatched-pattern > quality-report/before.json
          echo $? > quality-report/before-exit-code.txt
          set -e

      - name: Apply analyzer autofixes in runner only
        shell: bash
        run: |
          set +e
          npx eslint app worker db scripts --config eslint.sonar-audit.config.mjs --fix --no-error-on-unmatched-pattern > quality-report/autofix-console.txt 2>&1
          echo $? > quality-report/autofix-exit-code.txt
          set -e
          git diff -- app worker db scripts > quality-report/autofix.patch
          git diff --stat -- app worker db scripts > quality-report/autofix-stat.txt
          git diff --numstat -- app worker db scripts > quality-report/autofix-numstat.txt
          cat quality-report/autofix-stat.txt

      - name: Capture remaining findings
        shell: bash
        run: |
          set +e
          npx eslint app worker db scripts --config eslint.sonar-audit.config.mjs --format json --no-error-on-unmatched-pattern > quality-report/after.json
          echo $? > quality-report/after-exit-code.txt
          set -e

      - name: Run complete rules suite on autofixed checkout
        shell: bash
        run: |
          set +e
          npm run test:rules > quality-report/test-rules.txt 2>&1
          echo $? > quality-report/test-rules-exit-code.txt
          set -e

      - name: Run AI benchmark on autofixed checkout
        shell: bash
        run: |
          set +e
          npm run ai:calibrate:benchmark > quality-report/ai-benchmark.txt 2>&1
          echo $? > quality-report/ai-benchmark-exit-code.txt
          set -e

      - name: Run production build on autofixed checkout
        shell: bash
        run: |
          set +e
          npm run vercel-build > quality-report/vercel-build.txt 2>&1
          echo $? > quality-report/vercel-build-exit-code.txt
          set -e

      - name: Summarize autofix impact
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const parse = async (file) => JSON.parse(await readFile(file, 'utf8'));
          const flatten = (results) => results.flatMap((file) => (file.messages ?? []).map((message) => ({
            file: file.filePath.replace(process.cwd() + '/', ''),
            rule: message.ruleId ?? 'unknown',
            severity: message.severity === 2 ? 'error' : 'warning',
          })));
          const before = flatten(await parse('quality-report/before.json'));
          const after = flatten(await parse('quality-report/after.json'));
          const sonarBefore = before.filter((item) => item.rule.startsWith('sonarjs/'));
          const sonarAfter = after.filter((item) => item.rule.startsWith('sonarjs/'));
          const readExit = async (file) => (await readFile(file, 'utf8')).trim();
          const countRules = (items) => Object.entries(items.reduce((acc, item) => {
            acc[item.rule] = (acc[item.rule] ?? 0) + 1;
            return acc;
          }, {})).sort((a, b) => b[1] - a[1]);
          const stat = await readFile('quality-report/autofix-stat.txt', 'utf8');
          const summary = [
            'HEMSFELL — ANALYZER AUTOFIX SAFETY REPORT',
            `Before: ${before.length} total / ${sonarBefore.length} SonarJS`,
            `After:  ${after.length} total / ${sonarAfter.length} SonarJS`,
            `Removed: ${before.length - after.length} total / ${sonarBefore.length - sonarAfter.length} SonarJS`,
            '',
            'Changed source:',
            stat.trim() || '(no source files changed)',
            '',
            `test:rules exit=${await readExit('quality-report/test-rules-exit-code.txt')}`,
            `AI benchmark exit=${await readExit('quality-report/ai-benchmark-exit-code.txt')}`,
            `vercel-build exit=${await readExit('quality-report/vercel-build-exit-code.txt')}`,
            '',
            'Top remaining SonarJS rules:',
            ...countRules(sonarAfter).slice(0,25).map(([rule, count]) => `  ${String(count).padStart(4)}  ${rule}`),
          ].join('\n');
          await writeFile('quality-report/summary.txt', summary + '\n');
          console.log(summary);
          NODE

      - name: Upload autofix safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hemsfell-sonar-autofix-safety
          path: quality-report/
          retention-days: 7

      - name: Confirm diagnostic did not commit product changes
        if: always()
        run: git status --short
