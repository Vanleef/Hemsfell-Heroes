name: Sonar-style quality baseline

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - .github/workflows/apply-hemsfell-brand.yml

permissions:
  contents: read

jobs:
  quality-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install temporary quality analyzers
        run: npm install --no-save --no-package-lock sharp@0.34.3 eslint-plugin-sonarjs@3.0.5 jscpd@4.0.5

      - name: Simulate approved high-resolution branding
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir } from 'node:fs/promises';
          await mkdir('public/brand', { recursive: true });
          await sharp('public/brand/hemsfell-heroes-logo.png')
            .ensureAlpha()
            .resize({ width: 1100, fit: 'inside', withoutEnlargement: false, kernel: sharp.kernel.lanczos3 })
            .png({ compressionLevel: 9, palette: false })
            .toFile('public/brand/hemsfell-heroes-logo-hq.png');
          await sharp('public/icon.png')
            .ensureAlpha()
            .resize({ width: 512, height: 512, fit: 'contain', background: { r: 0, g: 0, b: 0, alpha: 0 }, kernel: sharp.kernel.lanczos3 })
            .png({ compressionLevel: 9, palette: false })
            .toFile('public/brand/hemsfell-heroes-mark-hq.png');
          for (const file of ['public/brand/hemsfell-heroes-logo-hq.png','public/brand/hemsfell-heroes-mark-hq.png']) {
            const meta = await sharp(file).metadata();
            if (!meta.hasAlpha || !meta.width || !meta.height || meta.width < 500) throw new Error(`Invalid transparent HQ logo: ${file}`);
            console.log(`${file}: ${meta.width}x${meta.height}, alpha=${meta.hasAlpha}`);
          }
          NODE

          python - <<'PY'
          from pathlib import Path
          page_path = Path('app/page.tsx')
          page = page_path.read_text()
          old_nav = '<nav className="shell-nav"><div className="hh-logo"><img src="/brand/hemsfell-heroes-logo.png" alt="Hemsfell Heroes"/></div><button onClick={()=>setScreen("decks")}>'
          new_nav = '<nav className="shell-nav"><button className="hh-logo hh-home-logo" type="button" onClick={()=>setScreen("menu")} aria-label="Voltar ao menu principal" title="Voltar ao menu"><img src="/brand/hemsfell-heroes-mark-hq.png" alt="" aria-hidden="true"/></button><button onClick={()=>setScreen("decks")}>'
          if old_nav not in page:
              raise SystemExit('topbar markup changed; refusing unsafe replacement')
          page = page.replace(old_nav, new_nav, 1)
          old_copy = '<div className="landing-copy"><p>AS CRÔNICAS DE HEMSFELL</p><h1>Heróis são escolhidos.<br/><em>Lendas são forjadas.</em></h1><span>Entidades cósmicas convocam campeões, criaturas e magias de um mundo de fantasia em guerra. Construa seu exército, domine o campo e reduza a vida do herói rival a zero.</span><div className="landing-actions">'
          new_copy = '<div className="landing-copy"><img className="landing-brand-logo" src="/brand/hemsfell-heroes-logo-hq.png" alt="Hemsfell Heroes"/><div className="landing-actions">'
          if old_copy not in page:
              raise SystemExit('landing copy changed; refusing unsafe replacement')
          page = page.replace(old_copy, new_copy, 1)
          page_path.write_text(page)
          PY

          cat > app/brand.css <<'EOF'
          .shell-nav .hh-home-logo {
            width: clamp(3.15rem, 4.6vw, 4rem) !important;
            height: clamp(3.15rem, 4.6vw, 4rem) !important;
            display: grid !important;
            place-items: center !important;
            flex: 0 0 auto !important;
            padding: 0 !important;
            margin: 0 !important;
            border: 0 !important;
            border-radius: .55rem !important;
            background: transparent !important;
            box-shadow: none !important;
            overflow: visible !important;
            cursor: pointer !important;
            transition: transform .16s ease, filter .16s ease !important;
          }
          .shell-nav .hh-home-logo:hover,
          .shell-nav .hh-home-logo:focus-visible {
            transform: translateY(-1px) scale(1.045) !important;
            filter: drop-shadow(0 0 .7rem rgb(27 217 224 / .24)) !important;
          }
          .shell-nav .hh-home-logo:focus-visible {
            outline: 2px solid #eab84d !important;
            outline-offset: 3px !important;
          }
          .shell-nav .hh-home-logo > img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            object-position: center !important;
            user-select: none !important;
            -webkit-user-drag: none !important;
          }
          .screen-menu .landing-copy {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            min-width: 0;
          }
          .screen-menu .landing-brand-logo {
            display: block;
            width: min(100%, clamp(25rem, 43vw, 39rem));
            height: auto;
            max-height: min(61dvh, 37rem);
            object-fit: contain;
            object-position: left center;
            filter: drop-shadow(0 1.2rem 2.2rem rgb(0 0 0 / .38));
            user-select: none;
            -webkit-user-drag: none;
          }
          .screen-menu .landing-copy > .landing-actions {
            width: min(100%, 39rem);
            flex-wrap: wrap;
          }
          @media (max-width: 56rem) {
            .screen-menu .landing-copy { align-items: center; text-align: center; }
            .screen-menu .landing-brand-logo { width: min(88vw, 34rem); max-height: 46dvh; object-position: center; }
            .screen-menu .landing-copy > .landing-actions { justify-content: center; }
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          path = Path('app/layout.tsx')
          text = path.read_text()
          text = text.replace('import "./globals.css";\n', 'import "./globals.css";\nimport "./brand.css";\n', 1)
          text = text.replace('icon: "/icon.png",\n    shortcut: "/icon.png",', 'icon: "/brand/hemsfell-heroes-mark-hq.png",\n    shortcut: "/brand/hemsfell-heroes-mark-hq.png",')
          path.write_text(text)
          PY

      - name: TypeScript authoritative checks
        run: |
          npm run typecheck:ai
          npm run typecheck:online

      - name: ESLint baseline
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee /tmp/eslint.txt

      - name: SonarJS baseline
        id: sonarjs
        continue-on-error: true
        run: |
          cat > /tmp/eslint.sonar.config.mjs <<'EOF'
          import base from "${{ github.workspace }}/eslint.config.mjs";
          import sonarjs from "eslint-plugin-sonarjs";
          export default [
            ...base,
            {
              files: ["app/**/*.{js,mjs,ts,tsx}", "worker/**/*.{js,mjs,ts,tsx}", "db/**/*.{js,mjs,ts,tsx}", "scripts/**/*.{js,mjs,ts,tsx}"],
              plugins: { sonarjs },
              rules: {
                ...sonarjs.configs.recommended.rules,
                "sonarjs/cognitive-complexity": ["warn", 25],
                "sonarjs/no-duplicate-string": ["warn", { threshold: 5 }]
              }
            }
          ];
          EOF
          npx eslint app worker db scripts --config /tmp/eslint.sonar.config.mjs --format stylish 2>&1 | tee /tmp/sonarjs.txt

      - name: Duplication baseline
        id: duplication
        continue-on-error: true
        run: |
          npx jscpd app worker db scripts tests --min-lines 10 --min-tokens 75 --reporters console,json --output /tmp/jscpd 2>&1 | tee /tmp/jscpd.txt

      - name: Risk-pattern baseline
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import path from 'node:path';
          const roots=['app','worker','db','scripts'];
          const exts=new Set(['.ts','.tsx','.js','.mjs','.cjs']);
          const files=[];
          async function walk(dir){for(const ent of await readdir(dir,{withFileTypes:true})){const p=path.join(dir,ent.name);if(ent.isDirectory())await walk(p);else if(exts.has(path.extname(ent.name)))files.push(p)}}
          for(const root of roots) await walk(root);
          const patterns=[
            ['eval',/\beval\s*\(/g],
            ['new Function',/\bnew\s+Function\b/g],
            ['innerHTML',/\b(?:innerHTML|dangerouslySetInnerHTML)\b/g],
            ['non-null assertion',/\w!\.(?:\w+)/g],
            ['explicit any',/\bany\b/g],
            ['console.log',/\bconsole\.log\s*\(/g],
            ['ts-ignore',/@ts-ignore/g],
            ['eslint-disable',/eslint-disable/g],
          ];
          const totals=Object.fromEntries(patterns.map(([name])=>[name,0]));
          for(const file of files){const text=await readFile(file,'utf8');for(const [name,re] of patterns){totals[name]+=(text.match(re)||[]).length}}
          console.log('RISK_PATTERN_TOTALS '+JSON.stringify(totals));
          NODE

      - name: Canonical rules suite
        run: npm run test:rules

      - name: AI strategic benchmark
        run: npm run ai:calibrate:benchmark

      - name: Production build
        run: npm run vercel-build

      - name: Baseline summary
        if: always()
        run: |
          echo "ESLint outcome: ${{ steps.lint.outcome }}"
          echo "SonarJS outcome: ${{ steps.sonarjs.outcome }}"
          echo "Duplication outcome: ${{ steps.duplication.outcome }}"
          echo "--- ESLint tail ---"
          tail -n 80 /tmp/eslint.txt 2>/dev/null || true
          echo "--- SonarJS tail ---"
          tail -n 120 /tmp/sonarjs.txt 2>/dev/null || true
          echo "--- jscpd tail ---"
          tail -n 80 /tmp/jscpd.txt 2>/dev/null || true
