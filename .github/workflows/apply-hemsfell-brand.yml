name: Full SonarJS diagnostic audit

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - .github/workflows/apply-hemsfell-brand.yml

permissions:
  contents: read

jobs:
  sonar-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install diagnostic analyzers without changing lockfile
        run: npm install --no-save --package-lock=false eslint-plugin-sonarjs@3.0.5 jscpd@4.0.5

      - name: Build full SonarJS audit configuration
        run: |
          cat > eslint.sonar-audit.config.mjs <<'EOF'
          import base from "./eslint.config.mjs";
          import sonarjs from "eslint-plugin-sonarjs";

          export default [
            ...base,
            {
              files: [
                "app/**/*.{js,mjs,cjs,ts,tsx}",
                "worker/**/*.{js,mjs,cjs,ts,tsx}",
                "db/**/*.{js,mjs,cjs,ts,tsx}",
                "scripts/**/*.{js,mjs,cjs,ts,tsx}",
              ],
              plugins: { sonarjs },
              rules: {
                ...sonarjs.configs.recommended.rules,
                "sonarjs/cognitive-complexity": ["warn", 15],
              },
            },
          ];
          EOF

      - name: Run ESLint + SonarJS over product source
        shell: bash
        run: |
          mkdir -p quality-report
          set +e
          npx eslint app worker db scripts \
            --config eslint.sonar-audit.config.mjs \
            --format json \
            --no-error-on-unmatched-pattern \
            > quality-report/eslint-sonar.json
          echo $? > quality-report/eslint-exit-code.txt
          set -e

      - name: Run duplication analysis
        shell: bash
        run: |
          mkdir -p quality-report/jscpd
          set +e
          npx jscpd app worker db scripts \
            --min-lines 5 \
            --min-tokens 35 \
            --reporters json \
            --output quality-report/jscpd \
            --ignore "**/cards.generated.json,**/*.generated.*,**/.next/**,**/dist/**" \
            > quality-report/jscpd-console.txt 2>&1
          echo $? > quality-report/jscpd-exit-code.txt
          set -e

      - name: Run TypeScript authority checks
        shell: bash
        run: |
          set +e
          npm run typecheck:ai > quality-report/typecheck-ai.txt 2>&1
          echo $? > quality-report/typecheck-ai-exit-code.txt
          npm run typecheck:online > quality-report/typecheck-online.txt 2>&1
          echo $? > quality-report/typecheck-online-exit-code.txt
          set -e

      - name: Summarize findings
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const results = JSON.parse(await readFile('quality-report/eslint-sonar.json','utf8'));
          const findings = [];
          for (const file of results) {
            for (const msg of file.messages ?? []) {
              findings.push({
                file: file.filePath.replace(process.cwd() + '/', ''),
                line: msg.line ?? 0,
                column: msg.column ?? 0,
                severity: msg.severity === 2 ? 'error' : 'warning',
                rule: msg.ruleId ?? 'unknown',
                message: msg.message,
              });
            }
          }
          const sonar = findings.filter((f) => f.rule.startsWith('sonarjs/'));
          const countBy = (items, key) => Object.entries(items.reduce((acc,item)=>{const k=item[key];acc[k]=(acc[k]??0)+1;return acc;},{})).sort((a,b)=>b[1]-a[1]);
          const byRule = countBy(findings,'rule');
          const sonarByRule = countBy(sonar,'rule');
          const byFile = countBy(findings,'file');
          const sonarByFile = countBy(sonar,'file');
          let duplicateSummary = 'jscpd JSON report not found';
          for (const candidate of ['quality-report/jscpd/jscpd-report.json','quality-report/jscpd/report.json']) {
            try {
              const report=JSON.parse(await readFile(candidate,'utf8'));
              const total=report.statistics?.total ?? {};
              duplicateSummary=`duplicatedLines=${total.duplicatedLines ?? 'n/a'}, percentage=${total.percentage ?? 'n/a'}%, clones=${report.duplicates?.length ?? 'n/a'}`;
              break;
            } catch {}
          }
          const summary = [
            'HEMSFELL HEROES — FULL STATIC QUALITY DIAGNOSTIC',
            `Total ESLint/SonarJS findings: ${findings.length}`,
            `  errors: ${findings.filter(f=>f.severity==='error').length}`,
            `  warnings: ${findings.filter(f=>f.severity==='warning').length}`,
            `SonarJS findings: ${sonar.length}`,
            `Duplication: ${duplicateSummary}`,
            '',
            'Top SonarJS rules:',
            ...sonarByRule.slice(0,30).map(([rule,count])=>`  ${count.toString().padStart(4)}  ${rule}`),
            '',
            'Top files by SonarJS findings:',
            ...sonarByFile.slice(0,30).map(([file,count])=>`  ${count.toString().padStart(4)}  ${file}`),
            '',
            'Top rules overall:',
            ...byRule.slice(0,30).map(([rule,count])=>`  ${count.toString().padStart(4)}  ${rule}`),
            '',
            'Top files overall:',
            ...byFile.slice(0,30).map(([file,count])=>`  ${count.toString().padStart(4)}  ${file}`),
            '',
            'First 120 SonarJS findings:',
            ...sonar.slice(0,120).map(f=>`  ${f.file}:${f.line}:${f.column} [${f.rule}] ${f.message}`),
          ].join('\n');
          await writeFile('quality-report/summary.txt',summary+'\n');
          await writeFile('quality-report/sonar-findings.json',JSON.stringify(sonar,null,2));
          console.log(summary);
          NODE

      - name: Upload complete diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: hemsfell-full-sonar-diagnostic
          path: quality-report/
          retention-days: 7

      - name: Keep audit diagnostic-only
        run: |
          git status --short
          test ! -f package-lock.json.tmp
