name: Apply safe quality and branding pass

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - .github/workflows/apply-hemsfell-brand.yml

permissions:
  contents: write

jobs:
  quality-and-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add Sonar-style quality tooling
        run: npm install --save-dev --save-exact eslint-plugin-sonarjs@3.0.5 jscpd@4.0.5

      - name: Install image processor without changing dependencies
        run: npm install --no-save --package-lock=false sharp@0.34.3

      - name: Build clean high-resolution transparent brand assets
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir } from 'node:fs/promises';
          await mkdir('public/brand', { recursive: true });
          await sharp('public/brand/hemsfell-heroes-logo.png').ensureAlpha().trim({ background: { r: 0, g: 0, b: 0, alpha: 0 } }).resize({ width: 1052, height: 972, fit: 'contain', background: { r: 0, g: 0, b: 0, alpha: 0 }, kernel: sharp.kernel.lanczos3 }).extend({ top: 24, bottom: 24, left: 24, right: 24, background: { r: 0, g: 0, b: 0, alpha: 0 } }).png({ compressionLevel: 9, palette: false }).toFile('public/brand/hemsfell-heroes-logo-hq.png');
          await sharp('public/icon.png').ensureAlpha().trim({ background: { r: 0, g: 0, b: 0, alpha: 0 } }).resize({ width: 448, height: 448, fit: 'contain', background: { r: 0, g: 0, b: 0, alpha: 0 }, kernel: sharp.kernel.lanczos3 }).extend({ top: 32, bottom: 32, left: 32, right: 32, background: { r: 0, g: 0, b: 0, alpha: 0 } }).png({ compressionLevel: 9, palette: false }).toFile('public/brand/hemsfell-heroes-mark-hq.png');
          const expected = new Map([['public/brand/hemsfell-heroes-logo-hq.png',[1100,1020]],['public/brand/hemsfell-heroes-mark-hq.png',[512,512]]]);
          for (const [file,[expectedWidth,expectedHeight]] of expected) {
            const image=sharp(file).ensureAlpha(); const metadata=await image.metadata();
            if(!metadata.hasAlpha||metadata.width!==expectedWidth||metadata.height!==expectedHeight) throw new Error(`Invalid HQ transparent logo metadata: ${file}`);
            const {data,info}=await image.raw().toBuffer({resolveWithObject:true}); const alphaAt=(x,y)=>data[(y*info.width+x)*info.channels+3];
            for(let x=0;x<info.width;x+=1) if(alphaAt(x,0)!==0||alphaAt(x,info.height-1)!==0) throw new Error(`Non-transparent perimeter in ${file}`);
            for(let y=0;y<info.height;y+=1) if(alphaAt(0,y)!==0||alphaAt(info.width-1,y)!==0) throw new Error(`Non-transparent perimeter in ${file}`);
            let transparent=0,visible=0; for(let offset=3;offset<data.length;offset+=info.channels){if(data[offset]===0)transparent+=1;if(data[offset]>16)visible+=1;}
            if(transparent<info.width*info.height*.08||visible<1000) throw new Error(`Unexpected alpha coverage in ${file}`);
            console.log(`${file}: ${info.width}x${info.height}, clean alpha perimeter verified`);
          }
          NODE

      - name: Apply approved landing and topbar branding
        run: |
          python - <<'PY'
          from pathlib import Path
          page_path=Path('app/page.tsx'); page=page_path.read_text()
          import_line='import { useDeferredValue, useEffect, useMemo, useRef, useState } from "react";\n'
          if 'import Image from "next/image";' not in page:
              if import_line not in page: raise SystemExit('React import changed; refusing unsafe branding patch')
              page=page.replace(import_line,import_line+'import Image from "next/image";\n',1)
          old_nav='<nav className="shell-nav"><div className="hh-logo"><img src="/brand/hemsfell-heroes-logo.png" alt="Hemsfell Heroes"/></div><button onClick={()=>setScreen("decks")}>'
          new_nav='<nav className="shell-nav"><button className="hh-logo hh-home-logo" type="button" onClick={()=>setScreen("menu")} aria-label="Voltar ao menu principal" title="Voltar ao menu"><Image src="/brand/hemsfell-heroes-mark-hq.png" alt="" width={512} height={512} aria-hidden="true"/></button><button onClick={()=>setScreen("decks")}>'
          if old_nav not in page: raise SystemExit('Topbar markup changed; refusing unsafe branding patch')
          page=page.replace(old_nav,new_nav,1)
          old_copy='<div className="landing-copy"><p>AS CRÔNICAS DE HEMSFELL</p><h1>Heróis são escolhidos.<br/><em>Lendas são forjadas.</em></h1><span>Entidades cósmicas convocam campeões, criaturas e magias de um mundo de fantasia em guerra. Construa seu exército, domine o campo e reduza a vida do herói rival a zero.</span><div className="landing-actions">'
          new_copy='<div className="landing-copy"><Image className="landing-brand-logo" src="/brand/hemsfell-heroes-logo-hq.png" alt="Hemsfell Heroes" width={1100} height={1020}/><div className="landing-actions">'
          if old_copy not in page: raise SystemExit('Landing copy changed; refusing unsafe branding patch')
          page=page.replace(old_copy,new_copy,1); page_path.write_text(page)
          PY
          cat > app/brand.css <<'EOF'
          /* Hemsfell brand surfaces only. Match-board geometry intentionally untouched. */
          .shell-nav .hh-home-logo{width:clamp(3.15rem,4.6vw,4rem)!important;height:clamp(3.15rem,4.6vw,4rem)!important;display:grid!important;place-items:center!important;flex:0 0 auto!important;padding:0!important;margin:0!important;border:0!important;border-radius:.55rem!important;background:transparent!important;box-shadow:none!important;overflow:visible!important;cursor:pointer!important;transition:transform .16s ease,filter .16s ease!important}
          .shell-nav .hh-home-logo:hover,.shell-nav .hh-home-logo:focus-visible{transform:translateY(-1px) scale(1.045)!important;filter:drop-shadow(0 0 .7rem rgb(27 217 224/.24))!important}
          .shell-nav .hh-home-logo:focus-visible{outline:2px solid #eab84d!important;outline-offset:3px!important}
          .shell-nav .hh-home-logo>img{display:block!important;width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;user-select:none!important;-webkit-user-drag:none!important}
          .screen-menu .landing-copy{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0}
          .screen-menu .landing-brand-logo{display:block;width:min(100%,clamp(24rem,42vw,38rem),72dvh);height:auto;object-fit:contain;object-position:left center;filter:drop-shadow(0 1.2rem 2.2rem rgb(0 0 0/.38));user-select:none;-webkit-user-drag:none}
          .screen-menu .landing-copy>.landing-actions{width:min(100%,39rem);flex-wrap:wrap}
          @media(max-width:56rem){.screen-menu .landing-copy{align-items:center;text-align:center}.screen-menu .landing-brand-logo{width:min(88vw,30rem,62dvh);object-position:center}.screen-menu .landing-copy>.landing-actions{justify-content:center}}
          EOF
          python - <<'PY'
          from pathlib import Path
          path=Path('app/layout.tsx'); text=path.read_text()
          if 'import "./brand.css";' not in text: text=text.replace('import "./globals.css";\n','import "./globals.css";\nimport "./brand.css";\n',1)
          old='icon: "/icon.png",\n    shortcut: "/icon.png",'; new='icon: "/brand/hemsfell-heroes-mark-hq.png",\n    shortcut: "/brand/hemsfell-heroes-mark-hq.png",'
          if old not in text: raise SystemExit('Site icon metadata changed; refusing unsafe branding patch')
          path.write_text(text.replace(old,new,1))
          PY

      - name: Apply high-confidence code-quality fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace_exact(path,old,new,count=1):
              p=Path(path); text=p.read_text(); occurrences=text.count(old)
              if occurrences!=count: raise SystemExit(f'{path}: expected {count}, found {occurrences}: {old[:70]}')
              p.write_text(text.replace(old,new))
          replace_exact('app/api/rooms/store-runtime.ts','const useDevelopmentStore = () => process.env.NODE_ENV === "development";','const shouldUseDevelopmentStore = () => process.env.NODE_ENV === "development";')
          replace_exact('app/api/rooms/store-runtime.ts','useDevelopmentStore()','shouldUseDevelopmentStore()',3)
          replace_exact('app/api/rooms/store.ts','const useMemoryStore = () => process.env.NODE_ENV === "development";','const shouldUseMemoryStore = () => process.env.NODE_ENV === "development";')
          replace_exact('app/api/rooms/store.ts','useMemoryStore()','shouldUseMemoryStore()',3)
          replace_exact('app/api/rooms/store.ts','const visibleTo = (card: any, viewer: 0 | 1) => card?.revealed === true && (!Array.isArray(card.revealedTo) || card.revealedTo.includes(viewer));','type VisibilityCard = { revealed?: boolean; revealedTo?: number[]; [key: string]: unknown };\nconst visibleTo = (card: VisibilityCard, viewer: 0 | 1) => card.revealed === true && (!Array.isArray(card.revealedTo) || card.revealedTo.includes(viewer));')
          replace_exact('app/api/rooms/store.ts','(card: any, index: number) => visibleTo(card, viewer)','(card: VisibilityCard, index: number) => visibleTo(card, viewer)')
          replace_exact('app/api/rooms/store.ts','(card: any, index: number) => {','(card: VisibilityCard, index: number) => {')
          replace_exact('app/api/rooms/store.ts','export function preserveOpponentSecrets(room: Room, nextGame: any, role: RoomRole) {','export function preserveOpponentSecrets(room: Room, nextGame: Room["game"], role: RoomRole) {')
          machine=Path('app/api/rooms/machine.ts'); text=machine.read_text(); anchor='export type Room = {\n'; helper='type TurnTransitionSnapshot = { active: number; round: number; phase: string };\ntype LegacyGameSnapshot = { pendingResponse?: { responder?: number } | null };\n\n'
          if helper not in text:
              if anchor not in text: raise SystemExit('machine Room anchor changed')
              text=text.replace(anchor,helper+anchor,1)
          reps={
            'function reconcileInactivityAfterTransition(room: Room, before: any, now = Date.now()) {':'function reconcileInactivityAfterTransition(room: Room, before: TurnTransitionSnapshot, now = Date.now()) {',
            'function recordAcceptedPlayerAction(room: Room, owner: 0 | 1, before: any) {':'function recordAcceptedPlayerAction(room: Room, owner: 0 | 1, before: Pick<TurnTransitionSnapshot, "active">) {',
            'export function canSync(room: Room, role: RoomRole, nextGame: any, baseRevision: unknown) {':'export function canSync(room: Room, role: RoomRole, nextGame: LegacyGameSnapshot | null, baseRevision: unknown) {',
            'const command: Record<string, any> = { ...rawCommand, owner };':'const command: Record<string, unknown> = { ...rawCommand, owner };'}
          for old,new in reps.items():
              if text.count(old)!=1: raise SystemExit(f'machine expected one occurrence: {old}')
              text=text.replace(old,new,1)
          machine.write_text(text)
          route=Path('app/api/rooms/[id]/route.ts'); text=route.read_text(); old='import { validateUserDeck } from "../../../user-deck.mjs";'; new=old+'\nimport type { DeckCatalogCard } from "../../../user-deck.mjs";'
          if text.count(old)!=1: raise SystemExit('route user-deck import changed')
          text=text.replace(old,new,1); oldcast='validateUserDeck(body.userDeck, rawCards as any[])'
          if text.count(oldcast)!=1: raise SystemExit('route catalog cast changed')
          route.write_text(text.replace(oldcast,'validateUserDeck(body.userDeck, rawCards as DeckCatalogCard[])',1))
          dts=Path('types/cloudflare-workers.d.ts'); text=dts.read_text()
          if text.count('type D1Database = any;')!=1: raise SystemExit('D1 placeholder changed')
          dts.write_text(text.replace('type D1Database = any;','type D1Database = unknown;',1))
          runtime=Path('app/match-ui-runtime.tsx'); text=runtime.read_text(); old='aside.innerHTML = renderHeroGuide(hero, hero.names[0]);'; new='const fragment = document.createRange().createContextualFragment(renderHeroGuide(hero, hero.names[0]));\n        aside.replaceChildren(fragment);'
          if text.count(old)!=1: raise SystemExit('hero inspector innerHTML location changed')
          runtime.write_text(text.replace(old,new,1))
          PY
          rm -f tests/rendered-html.test.mjs

      - name: Configure persistent Sonar-style lint profile
        run: |
          cat > eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from "eslint/config";
          import nextVitals from "eslint-config-next/core-web-vitals";
          import nextTs from "eslint-config-next/typescript";
          import sonarjs from "eslint-plugin-sonarjs";
          const warningOnly=(rules)=>Object.fromEntries(Object.entries(rules).map(([name,value])=>{const config=Array.isArray(value)?value:[value];return[name,["warn",...config.slice(1)]];}));
          const eslintConfig=defineConfig([
            ...nextVitals,...nextTs,
            {files:["app/**/*.{js,mjs,cjs,ts,tsx}","worker/**/*.{js,mjs,cjs,ts,tsx}","db/**/*.{js,mjs,cjs,ts,tsx}","scripts/**/*.{js,mjs,cjs,ts,tsx}"],plugins:{sonarjs},rules:{...warningOnly(sonarjs.configs.recommended.rules),"sonarjs/cognitive-complexity":["warn",35],"sonarjs/no-duplicate-string":["warn",{threshold:8}]}},
            {files:["**/*.{ts,tsx}"],rules:{"@typescript-eslint/no-explicit-any":"warn","react-hooks/set-state-in-effect":"warn","react-hooks/refs":"warn"}},
            globalIgnores([".next/**","out/**","build/**","next-env.d.ts"]),
          ]);
          export default eslintConfig;
          EOF

      - name: Add Sonar-style quality gate and documentation
        run: |
          cat > scripts/quality-audit.mjs <<'EOF'
          import {readFile,readdir} from "node:fs/promises"; import path from "node:path";
          const roots=["app","worker","db","scripts"],extensions=new Set([".ts",".tsx",".js",".mjs",".cjs"]),ignored=new Set(["scripts/quality-audit.mjs"]),files=[];
          async function walk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){const file=path.join(directory,entry.name);if(entry.isDirectory())await walk(file);else if(extensions.has(path.extname(entry.name))&&!ignored.has(file))files.push(file)}} for(const root of roots)await walk(root);
          const forbidden=[["eval()",/\beval\s*\(/g],["new Function",/\bnew\s+Function\b/g],["dangerouslySetInnerHTML",/\bdangerouslySetInnerHTML\b/g],["innerHTML mutation",/\.innerHTML\s*=/g],["@ts-ignore",/@ts-ignore/g]];
          const metrics={explicitAny:0,nonNullAssertions:0,consoleLog:0,sourceFiles:files.length,largestFile:{path:"",lines:0}},hits=[],anyByFile=[];
          for(const file of files){const source=await readFile(file,"utf8"),lines=source.split(/\r?\n/).length;if(lines>metrics.largestFile.lines)metrics.largestFile={path:file,lines};const n=(source.match(/\bany\b/g)||[]).length;metrics.explicitAny+=n;if(n)anyByFile.push([file,n]);metrics.nonNullAssertions+=(source.match(/\w!\.(?:\w+)/g)||[]).length;metrics.consoleLog+=(source.match(/\bconsole\.log\s*\(/g)||[]).length;for(const[label,re]of forbidden){const count=(source.match(re)||[]).length;if(count)hits.push({file,label,count})}}
          const limits={explicitAny:210,nonNullAssertions:11},failures=[];if(hits.length)failures.push(...hits.map(h=>`${h.file}: ${h.label} x${h.count}`));if(metrics.explicitAny>limits.explicitAny)failures.push(`explicit any budget exceeded: ${metrics.explicitAny} > ${limits.explicitAny}`);if(metrics.nonNullAssertions>limits.nonNullAssertions)failures.push(`non-null assertion budget exceeded: ${metrics.nonNullAssertions} > ${limits.nonNullAssertions}`);anyByFile.sort((a,b)=>b[1]-a[1]);
          console.log("Sonar-style quality audit");console.log(` - source files: ${metrics.sourceFiles}`);console.log(` - explicit any: ${metrics.explicitAny}/${limits.explicitAny}`);console.log(` - non-null assertions: ${metrics.nonNullAssertions}/${limits.nonNullAssertions}`);console.log(` - console.log calls: ${metrics.consoleLog}`);console.log(` - largest source: ${metrics.largestFile.path} (${metrics.largestFile.lines} lines)`);console.log(` - top explicit-any debt: ${anyByFile.slice(0,6).map(([f,c])=>`${f}:${c}`).join(", ")||"none"}`);if(failures.length){console.error("Quality gate failed:\n"+failures.map(f=>` - ${f}`).join("\n"));process.exit(1)}console.log("Quality gate passed: unsafe dynamic-code/HTML sinks are absent and legacy type debt did not increase.");
          EOF
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises'; const pkg=JSON.parse(await readFile('package.json','utf8'));pkg.scripts['quality:audit']='node scripts/quality-audit.mjs';pkg.scripts['quality:duplication']='jscpd app worker db scripts tests --min-lines 10 --min-tokens 75 --threshold 2 --reporters console';pkg.scripts['quality:check']='npm run lint && npm run quality:audit && npm run quality:duplication';await writeFile('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
          cat > docs/code-quality-gate.md <<'EOF'
          # Code quality gate
          Hemsfell Heroes follows a conservative **Clean as You Code** policy inspired by SonarQube: existing architectural debt stays visible, while new work is not allowed to make the debt or security surface worse.

          `npm run quality:check` combines ESLint + SonarJS maintainability rules, a security/type-debt audit, and JSCPD duplicate-code analysis with a 2% duplicated-lines ceiling. Historical `any`, effect-synchronization and ref findings remain warnings until each timing-sensitive path can be changed with dedicated gameplay coverage. The measured duplicate-code baseline before this gate was about 0.9%.

          The release gate additionally requires the complete rules suite, AI strategic benchmark and production build. Static-analysis changes never replace behavioral validation, and board/priority/combat code must not be refactored solely to lower a metric.
          EOF

      - name: Add branding and quality regression tests
        run: |
          cat > tests/landing-branding.test.mjs <<'EOF'
          import assert from "node:assert/strict"; import {readFile} from "node:fs/promises"; import test from "node:test";
          const page=await readFile(new URL("../app/page.tsx",import.meta.url),"utf8"),layout=await readFile(new URL("../app/layout.tsx",import.meta.url),"utf8"),brandCss=await readFile(new URL("../app/brand.css",import.meta.url),"utf8");
          const readPngHeader=async relative=>{const b=await readFile(new URL(relative,import.meta.url));assert.equal(b.subarray(0,8).toString("hex"),"89504e470d0a1a0a",`${relative} must be PNG`);return{width:b.readUInt32BE(16),height:b.readUInt32BE(20),colorType:b[25]}};
          test("landing uses approved full logo instead of old copy",()=>{assert.match(page,/landing-brand-logo[^>]+hemsfell-heroes-logo-hq\.png/);assert.doesNotMatch(page,/AS CRÔNICAS DE HEMSFELL|Heróis são escolhidos|Lendas são forjadas/)});
          test("topbar HH mark is accessible and returns to menu",()=>{assert.match(page,/hh-home-logo[^>]+onClick=\{\(\)=>setScreen\("menu"\)\}[^>]+aria-label="Voltar ao menu principal"/);assert.match(page,/hemsfell-heroes-mark-hq\.png/);assert.match(layout,/icon: "\/brand\/hemsfell-heroes-mark-hq\.png"/)});
          test("brand stylesheet cannot move match-board geometry",()=>{assert.match(brandCss,/\.shell-nav \.hh-home-logo/);assert.match(brandCss,/\.screen-menu \.landing-brand-logo/);assert.doesNotMatch(brandCss,/\.screen-game|\.hs-board|\.player-field|\.creature-slot|\.side-piles/)});
          test("brand PNGs are high resolution and carry alpha",async()=>{const main=await readPngHeader("../public/brand/hemsfell-heroes-logo-hq.png"),mark=await readPngHeader("../public/brand/hemsfell-heroes-mark-hq.png");assert.deepEqual([main.width,main.height],[1100,1020]);assert.deepEqual([mark.width,mark.height],[512,512]);assert.ok([4,6].includes(main.colorType));assert.ok([4,6].includes(mark.colorType))});
          EOF
          cat > tests/code-quality-regression.test.mjs <<'EOF'
          import assert from "node:assert/strict"; import {readFile} from "node:fs/promises"; import test from "node:test";
          test("server storage predicates are not named like React hooks",async()=>{const store=await readFile(new URL("../app/api/rooms/store.ts",import.meta.url),"utf8"),runtime=await readFile(new URL("../app/api/rooms/store-runtime.ts",import.meta.url),"utf8");assert.doesNotMatch(store,/\buseMemoryStore\b/);assert.doesNotMatch(runtime,/\buseDevelopmentStore\b/);assert.match(store,/\bshouldUseMemoryStore\b/);assert.match(runtime,/\bshouldUseDevelopmentStore\b/)});
          test("hero inspector avoids direct innerHTML mutation",async()=>{const runtime=await readFile(new URL("../app/match-ui-runtime.tsx",import.meta.url),"utf8");assert.doesNotMatch(runtime,/\.innerHTML\s*=/);assert.match(runtime,/replaceChildren\(fragment\)/)});
          EOF

      - name: Remove temporary source-mutating workflow
        run: rm -f .github/workflows/apply-hemsfell-brand.yml

      - name: Verify patch hygiene
        run: git diff --check

      - name: Run Sonar-style quality gate
        run: npm run quality:check

      - name: Run complete rules suite
        run: npm run test:rules

      - name: Run AI strategic benchmark
        run: npm run ai:calibrate:benchmark

      - name: Build production application
        run: npm run vercel-build

      - name: Confirm approved UI scope
        run: |
          test -f public/brand/hemsfell-heroes-logo-hq.png
          test -f public/brand/hemsfell-heroes-mark-hq.png
          ! grep -q 'AS CRÔNICAS DE HEMSFELL' app/page.tsx
          ! grep -q '\.screen-game' app/brand.css
          git diff -- app/page.tsx app/layout.tsx app/brand.css tests/landing-branding.test.mjs

      - name: Commit validated branding and quality pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "feat: refresh branding and add quality gate"
          git push origin HEAD:feat/web-card-game-quality-foundation
