name: One-shot hero priority response fix

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/hotfix-hero-priority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/hotfix-hero-priority.py
      - name: Publish fix
        run: |
          rm .github/workflows/hotfix-hero-priority.yml
          rm .github/scripts/hotfix-hero-priority.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rules-engine/priority.mjs app/rules-engine/engine.mjs app/rules-engine/engine-base.mjs app/page.tsx tests/hero-priority-response.test.mjs .github/workflows/hotfix-hero-priority.yml .github/scripts/hotfix-hero-priority.py
          git commit -m "fix: support hero abilities in priority windows"
          git push origin HEAD:fix/cards_mechanics
