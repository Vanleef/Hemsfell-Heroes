name: One-shot hero priority response fix

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/hotfix-hero-priority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0

      - name: Patch hero priority support
        shell: python
        run: |
          from pathlib import Path

          priority_path = Path('app/rules-engine/priority.mjs')
          priority = priority_path.read_text(encoding='utf-8')
          priority = priority.replace('import { canExecuteCard, validateCosts } from "./engine.mjs";\n', 'import { canExecuteCard, validateCosts } from "./engine.mjs";\nimport { abilitiesForLevel, getExplicitCardRule } from "./card-rules.mjs";\n')
          priority = priority.replace('const permanents = (player) => [...(player.board || []), ...(player.support || []), ...(player.terrain ? [player.terrain] : [])];\n', '''const permanents = (player) => [...(player.board || []), ...(player.support || []), ...(player.terrain ? [player.terrain] : [])];
const HERO_RULE_PAGE = Object.freeze({ saymon: 129, ngoro: 255, natureza: 291 });
const heroSource = (entry, owner) => ({ uid: `${entry.heroId}-hero-${owner}`, id: `${entry.heroId}-hero-${owner}`, name: entry.heroId, slot: -1 });
const stackHas = (state, predicate) => (state.priorityStack || []).some((frame) => frame?.kind === "command" && predicate(frame.command || {}));
const heroUsageKey = (state, source, ability) => `${source.uid || source.id}:${ability.id}${ability?.condition?.firstEachTurn ? `:round-${state.round}` : ""}`;
''')
          old = '''  const cards = player.hand.flatMap((card, handIndex) => isAccelerated(card) && canExecuteCard(card) && responseEnergy >= spellCost(state, owner, card)
    ? [{ type: "playCard", owner, cardId: card.id, handIndex, hasPriority: true, label: card.name || card.id }]
    : []);
  // Response windows are intentionally limited to Accelerated cards.
  // Activated permanent abilities are main-phase actions and must never keep
  // an AI priority window alive.
  return cards;'''
          new = '''  const cards = player.hand.flatMap((card, handIndex) => isAccelerated(card) && canExecuteCard(card) && responseEnergy >= spellCost(state, owner, card) && !stackHas(state, command => command.type === "playCard" && command.owner === owner && command.cardId === card.id)
    ? [{ type: "playCard", owner, cardId: card.id, handIndex, hasPriority: true, label: card.name || card.id }]
    : []);
  const page = HERO_RULE_PAGE[player.heroId];
  const rule = page ? getExplicitCardRule(`p${page}`) : null;
  const source = heroSource(player, owner);
  const heroAbilities = abilitiesForLevel(rule, player.level || 1).flatMap((ability) => {
    if (ability.trigger !== "activated" || ability.responseAllowed === false || !ability.id) return [];
    if (player.abilityUses?.[heroUsageKey(state, source, ability)]) return [];
    if (stackHas(state, command => command.type === "activateHero" && command.owner === owner && command.abilityId === ability.id)) return [];
    try { validateCosts(state, ability, { owner, sourceId: source.uid }); }
    catch { return []; }
    return [{ type: "activateHero", owner, abilityId: ability.id, hasPriority: true, label: `${player.heroId}: ${ability.id}` }];
  });
  return [...cards, ...heroAbilities];'''
          if old not in priority:
              raise SystemExit('priority response block not found')
          priority = priority.replace(old, new, 1)
          priority_path.write_text(priority, encoding='utf-8')

          engine_path = Path('app/rules-engine/engine.mjs')
          engine = engine_path.read_text(encoding='utf-8')
          anchor = '''  if (priorityEnabled && command.type === "passPriority" && (inputState.priorityStack?.length || 0) > 1) {'''
          hero_block = '''  if (priorityEnabled && command.type === "activateHero" && command.hasPriority && !command.skipPriority && inputState.pendingResponse) {
    if (inputState.pendingResponse.responder !== command.owner) throw new RulesViolation("not-your-priority");
    const existingStack = inputState.priorityStack || [];
    if (existingStack.some((frame) => frame.kind === "command" && frame.command?.type === "activateHero" && frame.command?.owner === command.owner && frame.command?.abilityId === command.abilityId)) throw new RulesViolation("hero-response-already-on-stack");
    const root = existingStack.length ? null : rootPriorityFrame(inputState);
    if (!existingStack.length && !root) throw new RulesViolation("nothing-to-respond-to");
    const state = clone(inputState);
    state.priorityStack = existingStack.length ? clone(existingStack) : [root];
    state.priorityStack.push(commandFrame(inputState, command));
    state.pendingResponse = { responder: 1 - command.owner, actor: command.owner, action: command.abilityId || "habilidade de herói", passes: 0 };
    return stackResult(state, ["priority:push-hero-ability"], 0);
  }

'''
          if hero_block not in engine:
              if anchor not in engine:
                  raise SystemExit('engine pass priority anchor not found')
              engine = engine.replace(anchor, hero_block + anchor, 1)
          engine_path.write_text(engine, encoding='utf-8')

          base_path = Path('app/rules-engine/engine-base.mjs')
          base = base_path.read_text(encoding='utf-8')
          old_guard = '''        if (state.active !== item.command.owner || state.phase !== "principal") throw new RulesViolation("not-your-turn");'''
          new_guard = '''        const priorityHeroActivation = !!item.command.hasPriority;
        if (!priorityHeroActivation && (state.active !== item.command.owner || state.phase !== "principal")) throw new RulesViolation("not-your-turn");'''
          if old_guard not in base:
              raise SystemExit('activateHero turn guard not found')
          base = base.replace(old_guard, new_guard, 1)
          base_path.write_text(base, encoding='utf-8')

          page_path = Path('app/page.tsx')
          page = page_path.read_text(encoding='utf-8')
          old_ai = '''if(command.type==="passPriority"){void fallback();return}const card=current.players[1].hand.find(c=>c.id===command.cardId),completed=card?completeAIPlayCommand(current,1,card,difficulty,{hasPriority:true}):null;if(!completed){void fallback();return}void runRulesCommand(completed,1).then(accepted=>{if(!accepted)void fallback()})'''
          new_ai = '''if(command.type==="passPriority"){void fallback();return}if(command.type==="activateHero"){void runRulesCommand(command,1).then(accepted=>{if(!accepted)void fallback()});return}const card=current.players[1].hand.find(c=>c.id===command.cardId),completed=card?completeAIPlayCommand(current,1,card,difficulty,{hasPriority:true}):null;if(!completed){void fallback();return}void runRulesCommand(completed,1).then(accepted=>{if(!accepted)void fallback()})'''
          if old_ai not in page:
              raise SystemExit('AI priority command branch not found')
          page = page.replace(old_ai, new_ai, 1)
          page_path.write_text(page, encoding='utf-8')

          test_path = Path('tests/hero-priority-response.test.mjs')
          test_path.write_text(r'''import assert from "node:assert/strict";
import test from "node:test";
import { legalPriorityResponses, chooseAIResponse } from "../app/rules-engine/priority.mjs";
import { executeCommand } from "../app/rules-engine/engine.mjs";

const player=(heroId, level, extra={})=>({heroId,level,life:20,energy:3,reserve:3,hand:[],board:[],support:[],terrain:null,abilityUses:{},markers:{clue:10},heroXP:10,...extra});
const baseState=()=>({active:0,phase:"combate",round:4,pendingAction:{type:"attack",owner:0},pendingResponse:{responder:1,actor:0,action:"ataque",passes:0},players:[player("saymon",3),player("saymon",3)]});

test("activated hero abilities are legal priority responses even off turn",()=>{
  const state=baseState();
  const legal=legalPriorityResponses(state,1);
  assert.ok(legal.some(command=>command.type==="activateHero"&&command.abilityId==="saymon-level-1"));
  assert.equal(chooseAIResponse(state,1,()=>0).type,"activateHero");
});

test("hero priority response is stacked and cannot be offered twice before resolution",()=>{
  const state=baseState();
  const command=legalPriorityResponses(state,1).find(item=>item.type==="activateHero"&&item.abilityId==="saymon-level-1");
  const stacked=executeCommand(state,command,{priority:true}).state;
  assert.equal(stacked.priorityStack.at(-1).command.type,"activateHero");
  assert.equal(stacked.pendingResponse.responder,0);
  assert.ok(!legalPriorityResponses({...stacked,pendingResponse:{...stacked.pendingResponse,responder:1}},1).some(item=>item.type==="activateHero"&&item.abilityId==="saymon-level-1"));
});

test("two passes resolve a hero response without leaving priority stuck",()=>{
  let state=baseState();
  const command=legalPriorityResponses(state,1).find(item=>item.type==="activateHero"&&item.abilityId==="saymon-level-1");
  state=executeCommand(state,command,{priority:true}).state;
  state=executeCommand(state,{type:"passPriority",owner:0},{priority:true}).state;
  assert.equal(state.pendingResponse.responder,1);
  state=executeCommand(state,{type:"passPriority",owner:1},{priority:true}).state;
  assert.ok(state.pendingDecision || state.pendingResponse || !state.priorityStack?.length);
  assert.notEqual(state.pendingResponse?.responder,1 || undefined);
});
''', encoding='utf-8')

      - name: Remove one-shot workflow and publish fix
        run: |
          rm .github/workflows/hotfix-hero-priority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rules-engine/priority.mjs app/rules-engine/engine.mjs app/rules-engine/engine-base.mjs app/page.tsx tests/hero-priority-response.test.mjs .github/workflows/hotfix-hero-priority.yml
          git commit -m "fix: support hero abilities in priority windows"
          git push origin HEAD:fix/cards_mechanics
