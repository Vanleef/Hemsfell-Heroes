name: Apply opponent reveal and presentation UI fixes

on:
  push:
    branches:
      - feat/presentation-system-pr1

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1) Command bar: runtime inline !important values must match the CSS caps.
          runtime_ui_path = Path('app/match-ui-runtime.tsx')
          runtime_ui = runtime_ui_path.read_text()
          replacements = {
              'const COMMAND_TITLE_SIZE = "clamp(.62rem,min(.72vw,1.28dvh),.78rem)";': 'const COMMAND_TITLE_SIZE = "clamp(.62rem,min(.72vw,1.28dvh),.74rem)";',
              'const COMMAND_COPY_SIZE = "clamp(.74rem,min(.88vw,1.56dvh),1rem)";': 'const COMMAND_COPY_SIZE = "clamp(.74rem,min(.88vw,1.56dvh),.92rem)";',
              'const COMMAND_COMPACT_COPY_SIZE = "clamp(.7rem,min(.8vw,1.42dvh),.92rem)";': 'const COMMAND_COMPACT_COPY_SIZE = "clamp(.7rem,min(.8vw,1.42dvh),.86rem)";',
              'const COMMAND_DENSE_COPY_SIZE = "clamp(.66rem,min(.74vw,1.32dvh),.86rem)";': 'const COMMAND_DENSE_COPY_SIZE = "clamp(.66rem,min(.74vw,1.32dvh),.8rem)";',
          }
          for old, new in replacements.items():
              assert old in runtime_ui, old
              runtime_ui = runtime_ui.replace(old, new, 1)
          runtime_ui_path.write_text(runtime_ui)

          # 2) Hero damage: legacy CSS animation was still scaling the real portrait and
          # overriding the authoritative presentation runtime shake. Disable that transform
          # animation; keep the red flash. The runtime now owns the tiny translateX shake.
          ui_path = Path('app/ui-overrides.css')
          ui = ui_path.read_text()
          old_hero = '.screen-game .player-hero.hero-hurt>.hero-power-trigger{animation:heroDamagePulse .62s cubic-bezier(.2,.8,.25,1) both}'
          new_hero = '.screen-game .player-hero.hero-hurt>.hero-power-trigger{animation:none!important}'
          assert old_hero in ui
          ui = ui.replace(old_hero, new_hero, 1)
          old_keyframes = '@keyframes heroDamagePulse{0%{transform:translateX(0) scale(1)}18%{transform:translateX(-2.5%) scale(1.035)}36%{transform:translateX(2.2%) scale(1.025)}54%{transform:translateX(-1.2%) scale(1.015)}100%{transform:translateX(0) scale(1)}}'
          new_keyframes = '@keyframes heroDamagePulse{0%,100%{transform:translateX(0)}20%{transform:translateX(-2.5px)}40%{transform:translateX(2.5px)}62%{transform:translateX(-1.25px)}82%{transform:translateX(1.25px)}}'
          assert old_keyframes in ui
          ui = ui.replace(old_keyframes, new_keyframes, 1)
          ui_path.write_text(ui)

          # 3) Board status: while a turned card is actively presenting an effect/impact,
          # do not cover the animation with the VIRADA plate. Other negative statuses remain.
          page_path = Path('app/page.tsx')
          page = page_path.read_text()
          old_status = '{(unit.exhausted||unit.frozen||unit.stunned||unit.suffocated||unit.immobilized)&&<i className="status">{unit.suffocated?"SUFOCADA":unit.stunned?"ATORDOADA":unit.frozen?"CONGELADA":unit.immobilized?"IMOBILIZADA":"VIRADA"}</i>}'
          new_status = '{(((unit.exhausted&&!activeEffect&&!unit.impacting)||unit.frozen||unit.stunned||unit.suffocated||unit.immobilized))&&<i className="status">{unit.suffocated?"SUFOCADA":unit.stunned?"ATORDOADA":unit.frozen?"CONGELADA":unit.immobilized?"IMOBILIZADA":"VIRADA"}</i>}'
          assert old_status in page
          page = page.replace(old_status, new_status, 1)
          page_path.write_text(page)

          # 4) Expose a cached PDF-page renderer so presentation can reveal an opponent's
          # played spell immediately, even though their hand itself remains face-down.
          art_path = Path('app/remote-card-art.tsx')
          art = art_path.read_text()
          art_anchor = 'type RemoteCardArtProps = {'
          helper = '''export async function renderRemoteCardArtToCanvas(canvas: HTMLCanvasElement, page: number, cssWidth = 120) {
            const pdfPage = await loadCatalogPage(page);
            const baseViewport = pdfPage.getViewport({ scale: 1 });
            const width = Math.max(cssWidth, canvas.clientWidth, 120);
            const pixelRatio = Math.min(globalThis.devicePixelRatio || 1, 1.5);
            const viewport = pdfPage.getViewport({ scale: (width / baseViewport.width) * pixelRatio });
            canvas.width = Math.ceil(viewport.width);
            canvas.height = Math.ceil(viewport.height);
            canvas.style.aspectRatio = `${baseViewport.width} / ${baseViewport.height}`;
            const context = canvas.getContext("2d", { alpha: false });
            if (!context) throw new Error("Canvas indisponível");
            const renderTask = pdfPage.render({ canvas, canvasContext: context, viewport });
            await renderTask.promise;
            canvas.dataset.loaded = "true";
          }

          '''
          assert art_anchor in art
          if 'export async function renderRemoteCardArtToCanvas' not in art:
              art = art.replace(art_anchor, helper + art_anchor, 1)
          art_path.write_text(art)

          # 5) Presentation runtime: remove the VIRADA plate from presentation clones and
          # replace the opponent's hidden hand back with the actual played card face at the
          # start of the flight. Field plays clone the post-command face; spells render the
          # known catalogue page before the cast animation starts.
          gp_path = Path('app/game-presentation-runtime.tsx')
          gp = gp_path.read_text()
          old_import = 'import { animateActionCue, captureActionCue, type ActionCue } from "./presentation-action-cues";'
          new_import = old_import + '\nimport { renderRemoteCardArtToCanvas } from "./remote-card-art";'
          assert old_import in gp
          if 'renderRemoteCardArtToCanvas' not in gp.split('\n', 8)[0:8]:
              gp = gp.replace(old_import, new_import, 1)

          clone_anchor = '  clone.querySelectorAll<HTMLElement>("[id]").forEach((node) => node.removeAttribute("id"));'
          clone_extra = '''  clone.querySelectorAll<HTMLElement>(".status").forEach((node) => {
            if (node.textContent?.trim().toUpperCase() === "VIRADA") node.remove();
          });
          '''
          assert clone_anchor in gp
          if 'toUpperCase() === "VIRADA"' not in gp:
              gp = gp.replace(clone_anchor, clone_extra + clone_anchor, 1)

          played_anchor = '''function playedCardForDetail(detail: PresentationDetail) {
            const owner: Owner = Number(detail.command?.owner || 0) === 1 ? 1 : 0;
            const id = String(detail.command?.cardId || "");
            return (detail.before?.players?.[owner]?.hand || []).find((card: any) => String(card?.id || card?.uid || "") === id);
          }
          '''
          reveal_helpers = played_anchor + '''
          async function createRevealedOpponentCardFace(card: any, width: number) {
            const face = document.createElement("button");
            face.type = "button";
            face.tabIndex = -1;
            face.className = "original-card hh-opponent-play-reveal";
            face.setAttribute("aria-label", String(card?.name || "Carta jogada pelo oponente"));
            face.dataset.cardPage = String(Number(card?.page || 0));
            face.dataset.cardName = String(card?.name || "Carta jogada pelo oponente");
            const canvas = document.createElement("canvas");
            canvas.className = "remote-card-art";
            canvas.setAttribute("role", "img");
            canvas.setAttribute("aria-label", String(card?.name || "Carta jogada pelo oponente"));
            canvas.dataset.page = String(Number(card?.page || 0));
            face.append(canvas);
            try {
              await renderRemoteCardArtToCanvas(canvas, Number(card?.page || 0), Math.max(120, width));
            } catch {
              face.classList.add("hh-opponent-play-reveal-failed");
            }
            return face;
          }

          async function revealOpponentPlayedCard(detail: PresentationDetail, flights: Flight[]) {
            const owner: Owner = Number(detail.command?.owner || 0) === 1 ? 1 : 0;
            if (detail.command?.type !== "playCard" || owner !== 1) return;
            const card = playedCardForDetail(detail);
            if (!card) return;
            const sourceFlights = flights.filter((flight) => flight.sourcePlay);
            for (const flight of sourceFlights) {
              flight.face = flight.destination
                ? cloneRendered(flight.destination)
                : await createRevealedOpponentCardFace(card, flight.from.width);
            }
          }
          '''
          assert played_anchor in gp
          if 'async function revealOpponentPlayedCard' not in gp:
              gp = gp.replace(played_anchor, reveal_helpers, 1)

          old_cast = 'if (grave) flights.unshift({ kind: "cast", from: playedSource.rect, to: grave.rect, face: playedSource.clone, targets });'
          new_cast = 'if (grave) flights.unshift({ kind: "cast", from: playedSource.rect, to: grave.rect, face: playedSource.clone, targets, sourcePlay: true });'
          assert old_cast in gp
          gp = gp.replace(old_cast, new_cast, 1)

          old_present = '    const flights = buildFlights(detail, beforeDom, afterDom);\n    const spellFlight = flights.find((flight) => flight.kind === "cast") || null;'
          new_present = '    const flights = buildFlights(detail, beforeDom, afterDom);\n    await revealOpponentPlayedCard(detail, flights);\n    const spellFlight = flights.find((flight) => flight.kind === "cast") || null;'
          assert old_present in gp
          gp = gp.replace(old_present, new_present, 1)
          gp_path.write_text(gp)

          # 6) Presentation CSS for the standalone revealed spell face.
          css_path = Path('app/game-presentation.css')
          css = css_path.read_text()
          css_anchor = '.hh-flight-card.is-cast {'
          css_rule = '''.hh-opponent-play-reveal {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            min-width: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            background: transparent !important;
            overflow: hidden !important;
            pointer-events: none !important;
          }
          .hh-opponent-play-reveal > .remote-card-art {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
          }

          '''
          assert css_anchor in css
          if '.hh-opponent-play-reveal {' not in css:
              css = css.replace(css_anchor, css_rule + css_anchor, 1)
          css_path.write_text(css)

          # 7) Online opponent: infer a remote playCard from authoritative hand/field/grave
          # deltas so non-host and host clients both know which hidden card was just played.
          bridge_path = Path('app/presentation-event-bridge.tsx')
          bridge = bridge_path.read_text()
          bridge_anchor = '''const attackFromCombat = (combat: any) => combat?.attackerUid ? {
            type: "attack",
            owner: Number(combat.attackerOwner) === 1 ? 1 : 0,
            attackerId: combat.attackerUid,
            ...(combat.targetHero || !combat.defenderUid ? { targetHero: true } : { defenderId: combat.defenderUid }),
          } : null;
          '''
          infer_helper = bridge_anchor + '''
          const stateFieldCards = (player: any) => [
            ...(player?.board || []),
            ...(player?.support || []),
            ...(player?.terrain ? [player.terrain] : []),
          ];
          const identityCounts = (cards: any[] = []) => {
            const counts = new Map<string, number>();
            cards.forEach((card) => counts.set(cardIdentity(card), (counts.get(cardIdentity(card)) || 0) + 1));
            return counts;
          };
          const inferOpponentPlayCommand = (before: any, after: any) => {
            const beforePlayer = before?.players?.[1], afterPlayer = after?.players?.[1];
            if (!beforePlayer || !afterPlayer) return null;
            const afterHand = identityCounts(afterPlayer.hand || []);
            const removed = (beforePlayer.hand || []).find((card: any) => {
              const id = cardIdentity(card);
              const beforeCount = identityCounts(beforePlayer.hand || []).get(id) || 0;
              return (afterHand.get(id) || 0) < beforeCount;
            });
            if (!removed) return null;
            const id = cardIdentity(removed);
            const beforeFields = identityCounts(stateFieldCards(beforePlayer));
            const afterFields = identityCounts(stateFieldCards(afterPlayer));
            const beforeGrave = identityCounts(beforePlayer.grave || []);
            const afterGrave = identityCounts(afterPlayer.grave || []);
            const becameVisible = (afterFields.get(id) || 0) > (beforeFields.get(id) || 0)
              || (afterGrave.get(id) || 0) > (beforeGrave.get(id) || 0);
            return becameVisible ? { type: "playCard", owner: 1, cardId: id } : null;
          };
          '''
          assert bridge_anchor in bridge
          if 'const inferOpponentPlayCommand' not in bridge:
              bridge = bridge.replace(bridge_anchor, infer_helper, 1)

          old_snapshot = '''      const combatCommand = hasPresentableDelta(previous.game, after) ? attackFromCombat(previous.game?.combatAction) : null;
              emit({
                before: clone(previous.game),
                after: clone(after),
                command: combatCommand || { type: "onlineSnapshot", owner: 1 },'''
          new_snapshot = '''      const combatCommand = hasPresentableDelta(previous.game, after) ? attackFromCombat(previous.game?.combatAction) : null;
              const opponentPlayCommand = hasPresentableDelta(previous.game, after) ? inferOpponentPlayCommand(previous.game, after) : null;
              emit({
                before: clone(previous.game),
                after: clone(after),
                command: combatCommand || opponentPlayCommand || { type: "onlineSnapshot", owner: 1 },'''
          assert old_snapshot in bridge
          bridge = bridge.replace(old_snapshot, new_snapshot, 1)
          bridge_path.write_text(bridge)

          # 8) Regression coverage.
          test_path = Path('tests/combat-animation-flow.test.mjs')
          test = test_path.read_text()
          additions = '''

          test("legacy hero-hurt CSS cannot override the authoritative tiny hero shake", () => {
            const css = read("app/ui-overrides.css");
            assert.match(css, /player-hero\\.hero-hurt>\\.hero-power-trigger\\{animation:none!important\\}/);
            const pulse = css.slice(css.indexOf("@keyframes heroDamagePulse"), css.indexOf("@keyframes heroDamageFlash"));
            assert.doesNotMatch(pulse, /scale\\(/);
          });

          test("command bar runtime uses the same compact caps as the stylesheet", () => {
            const runtime = read("app/match-ui-runtime.tsx");
            assert.match(runtime, /COMMAND_TITLE_SIZE = \"clamp\\(\\.62rem,min\\(\\.72vw,1\\.28dvh\\),\\.74rem\\)\"/);
            assert.match(runtime, /COMMAND_COPY_SIZE = \"clamp\\(\\.74rem,min\\(\\.88vw,1\\.56dvh\\),\\.92rem\\)\"/);
            assert.match(runtime, /COMMAND_COMPACT_COPY_SIZE = \"clamp\\(\\.7rem,min\\(\\.8vw,1\\.42dvh\\),\\.86rem\\)\"/);
            assert.match(runtime, /COMMAND_DENSE_COPY_SIZE = \"clamp\\(\\.66rem,min\\(\\.74vw,1\\.32dvh\\),\\.8rem\\)\"/);
          });

          test("turned cards hide only the VIRADA plate during active presentation", () => {
            const page = read("app/page.tsx");
            const runtime = read("app/game-presentation-runtime.tsx");
            assert.match(page, /unit\\.exhausted&&!activeEffect&&!unit\\.impacting/);
            assert.match(runtime, /textContent\\?\\.trim\\(\\)\\.toUpperCase\\(\\) === \"VIRADA\"/);
          });

          test("opponent plays reveal the actual card face from the start of the flight", () => {
            const runtime = read("app/game-presentation-runtime.tsx");
            const art = read("app/remote-card-art.tsx");
            const bridge = read("app/presentation-event-bridge.tsx");
            assert.match(art, /export async function renderRemoteCardArtToCanvas/);
            assert.match(runtime, /async function revealOpponentPlayedCard/);
            assert.match(runtime, /owner !== 1/);
            assert.match(runtime, /flight\\.destination\\s*\\? cloneRendered\\(flight\\.destination\\)/);
            assert.match(runtime, /await createRevealedOpponentCardFace/);
            assert.match(runtime, /sourcePlay: true/);
            const present = runtime.indexOf("await revealOpponentPlayedCard(detail, flights)");
            const spell = runtime.indexOf("const spellFlight = flights.find", present);
            assert.ok(present >= 0 && present < spell);
            assert.match(bridge, /const inferOpponentPlayCommand/);
            assert.match(bridge, /combatCommand \\|\\| opponentPlayCommand \\|\\|/);
          });
          '''
          if 'legacy hero-hurt CSS cannot override' not in test:
              test += additions
          test_path.write_text(test)
          PY

      - name: Remove temporary workflow before validation
        run: rm .github/workflows/apply-opponent-reveal-ui-fixes.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical project state
        run: npm run prepare:project

      - name: Focused presentation tests
        run: node --test tests/combat-animation-flow.test.mjs tests/presentation-dedupe-regression.test.mjs

      - name: Full rules suite
        run: npm run test:rules

      - name: Production build
        run: npm run vercel-build

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/match-ui-runtime.tsx app/ui-overrides.css app/page.tsx app/remote-card-art.tsx app/game-presentation-runtime.tsx app/game-presentation.css app/presentation-event-bridge.tsx tests/combat-animation-flow.test.mjs .github/workflows/apply-opponent-reveal-ui-fixes.yml
          git commit -m "fix: reveal opponent plays and apply presentation UI guards"
          git push origin HEAD:feat/presentation-system-pr1
