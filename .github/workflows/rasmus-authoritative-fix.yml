name: Apply Rasmus authoritative fixes

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/rasmus-authoritative-fix.yml
      - .github/rasmus_patch.py
      - .github/rasmus_patch_followup.py
      - .github/rasmus_patch_counts.py

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Patch canonical Rasmus rules
        run: |
          python3 .github/rasmus_patch.py
          python3 .github/rasmus_patch_followup.py
          python3 .github/rasmus_patch_counts.py
      - name: Install dependencies
        run: npm ci
      - name: Validate project
        run: npm run prepare:project
      - name: Run Rasmus tests
        run: node --test tests/rasmus-authoritative.test.mjs tests/remaining-decks-authoritative.test.mjs
      - name: Run full rules suite
        run: npm run test:rules
      - name: Build Vercel target
        run: npm run vercel-build
      - name: Refresh implementation audit
        run: npm run audit:cards:full
      - name: Commit authoritative fixes and remove temporary helpers
        run: |
          rm .github/workflows/rasmus-authoritative-fix.yml .github/rasmus_patch.py .github/rasmus_patch_followup.py .github/rasmus_patch_counts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make Rasmus deck mechanics authoritative"
          git push origin HEAD:fix/cards_mechanics
