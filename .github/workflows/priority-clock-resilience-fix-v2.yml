name: Priority clock resilience fix v2

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.title == '[bot] priority clock resilience v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply hardening patch
        run: python scripts/apply-priority-clock-hardening.py
      - name: Focused priority regressions
        run: node --test tests/priority-clock-resilience.test.mjs tests/online-clock.test.mjs tests/online-clock-authority.test.mjs tests/online-priority-flow.test.mjs tests/online-priority-decision-suspension.test.mjs tests/online-two-perspective-flow.test.mjs tests/online-authoritative-audit.test.mjs tests/online-priority-ui-static.test.mjs
      - name: Online typecheck
        run: npm run typecheck:online
      - name: Rules suite
        run: npm run test:rules
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/rooms/machine.ts app/api/rooms/store.ts app/rules-engine/online-priority-engine.mjs app/page.tsx tests/online-priority-ui-static.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(multiplayer): harden authoritative priority timers"
          git push origin HEAD:fix/cards_mechanics
