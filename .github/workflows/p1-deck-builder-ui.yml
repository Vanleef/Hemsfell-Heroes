name: P1 Persistent Deck Builder

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - scripts/p1-deck-builder-ui.mjs
      - scripts/p1-deck-builder-ui-fix.mjs
      - .github/workflows/p1-deck-builder-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deck-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply persistent deck builder migration
        run: |
          node scripts/p1-deck-builder-ui-fix.mjs
          node scripts/p1-deck-builder-ui.mjs
      - name: Validate deck builder tests
        run: node --test tests/user-deck-model.test.mjs tests/online-user-deck-authority.test.mjs tests/persistent-deck-builder.test.mjs
      - name: Validate online typecheck
        run: npm run typecheck:online
      - name: Validate full rules suite
        run: npm run test:rules
      - name: Validate production build
        run: npm run vercel-build
      - name: Commit validated deck builder
        run: |
          rm -f scripts/p1-deck-builder-ui.mjs scripts/p1-deck-builder-ui-fix.mjs .github/workflows/p1-deck-builder-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add persistent accessible deck builder"
          git push origin HEAD:feat/web-card-game-quality-foundation
