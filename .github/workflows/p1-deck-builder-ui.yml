name: P1 Persistent Deck Builder

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - scripts/p1-deck-builder-ui.mjs
      - scripts/p1-deck-builder-ui-fix.mjs
      - .github/workflows/p1-deck-builder-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deck-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply persistent deck builder migration
        run: |
          node scripts/p1-deck-builder-ui-fix.mjs
          node scripts/p1-deck-builder-ui.mjs
      - name: Validate and capture diagnostics
        run: |
          set +e
          : > /tmp/p1-validation.log
          run_gate() {
            label="$1"
            shift
            echo "===== $label =====" | tee -a /tmp/p1-validation.log
            "$@" 2>&1 | tee -a /tmp/p1-validation.log
            status=${PIPESTATUS[0]}
            echo "===== $label exit=$status =====" | tee -a /tmp/p1-validation.log
            return $status
          }

          failed=0
          run_gate "deck builder tests" node --test tests/user-deck-model.test.mjs tests/online-user-deck-authority.test.mjs tests/persistent-deck-builder.test.mjs || failed=1
          run_gate "online typecheck" npm run typecheck:online || failed=1
          run_gate "full rules suite" npm run test:rules || failed=1
          run_gate "production build" npm run vercel-build || failed=1

          if [ "$failed" -ne 0 ]; then
            cp /tmp/p1-validation.log /tmp/p1-validation-copy.log
            git reset --hard HEAD
            mkdir -p .diagnostics
            python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/p1-validation-copy.log')
          lines = path.read_text(errors='replace').splitlines()
          needles = (
              'not ok', 'AssertionError', 'ERR_ASSERTION', 'ERR_TEST_FAILURE',
              '# fail ', 'exit=1', 'failed:', 'failureType:', 'error:',
              'expected:', 'actual:', 'operator:'
          )
          hits = []
          for index, line in enumerate(lines):
              lowered = line.lower()
              if any(needle.lower() in lowered for needle in needles):
                  hits.append(index)

          selected = set()
          for index in hits:
              selected.update(range(max(0, index - 24), min(len(lines), index + 36)))
          for index, line in enumerate(lines):
              if line.startswith('====='):
                  selected.add(index)

          output = []
          previous = None
          for index in sorted(selected):
              if previous is not None and index > previous + 1:
                  output.append(f'... omitted {index - previous - 1} lines ...')
              output.append(f'{index + 1:05d}: {lines[index]}')
              previous = index
          if not output:
              output = [f'{i + 1:05d}: {line}' for i, line in enumerate(lines[-600:])]
          Path('.diagnostics/p1-deck-builder-validation.txt').write_text('\n'.join(output) + '\n')
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .diagnostics/p1-deck-builder-validation.txt
            git commit -m "chore: capture P1 deck builder validation failure"
            git push origin HEAD:feat/web-card-game-quality-foundation
            exit 1
          fi
      - name: Commit validated deck builder
        run: |
          rm -rf .diagnostics
          rm -f scripts/p1-deck-builder-ui.mjs scripts/p1-deck-builder-ui-fix.mjs .github/workflows/p1-deck-builder-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add persistent accessible deck builder"
          git push origin HEAD:feat/web-card-game-quality-foundation
