name: Apply opponent reveal and UI fixes v2

on:
  push:
    branches: [feat/presentation-system-pr1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch sources
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, old, new, count=1):
              p=Path(path); text=p.read_text();
              if old not in text: raise SystemExit(f'missing anchor in {path}: {old[:100]}')
              text=text.replace(old,new,count); p.write_text(text)

          # Command bar runtime was still overriding CSS with the old inline !important caps.
          p=Path('app/match-ui-runtime.tsx'); t=p.read_text()
          pairs=[
            ('const COMMAND_TITLE_SIZE = "clamp(.62rem,min(.72vw,1.28dvh),.78rem)";','const COMMAND_TITLE_SIZE = "clamp(.62rem,min(.72vw,1.28dvh),.74rem)";'),
            ('const COMMAND_COPY_SIZE = "clamp(.74rem,min(.88vw,1.56dvh),1rem)";','const COMMAND_COPY_SIZE = "clamp(.74rem,min(.88vw,1.56dvh),.92rem)";'),
            ('const COMMAND_COMPACT_COPY_SIZE = "clamp(.7rem,min(.8vw,1.42dvh),.92rem)";','const COMMAND_COMPACT_COPY_SIZE = "clamp(.7rem,min(.8vw,1.42dvh),.86rem)";'),
            ('const COMMAND_DENSE_COPY_SIZE = "clamp(.66rem,min(.74vw,1.32dvh),.86rem)";','const COMMAND_DENSE_COPY_SIZE = "clamp(.66rem,min(.74vw,1.32dvh),.8rem)";'),
          ]
          for old,new in pairs:
              if old not in t: raise SystemExit(f'missing command bar constant: {old}')
              t=t.replace(old,new,1)
          p.write_text(t)

          # Legacy hero-hurt CSS was still scaling the portrait and winning over runtime WAAPI.
          must_replace('app/ui-overrides.css',
            '.screen-game .player-hero.hero-hurt>.hero-power-trigger{animation:heroDamagePulse .62s cubic-bezier(.2,.8,.25,1) both}',
            '.screen-game .player-hero.hero-hurt>.hero-power-trigger{animation:none!important}')
          must_replace('app/ui-overrides.css',
            '@keyframes heroDamagePulse{0%{transform:translateX(0) scale(1)}18%{transform:translateX(-2.5%) scale(1.035)}36%{transform:translateX(2.2%) scale(1.025)}54%{transform:translateX(-1.2%) scale(1.015)}100%{transform:translateX(0) scale(1)}}',
            '@keyframes heroDamagePulse{0%,100%{transform:translateX(0)}20%{transform:translateX(-2.5px)}40%{transform:translateX(2.5px)}62%{transform:translateX(-1.25px)}82%{transform:translateX(1.25px)}}')

          # Hide only the generic VIRADA plate while a turned card is actively presenting an effect/impact.
          must_replace('app/page.tsx',
            '{(unit.exhausted||unit.frozen||unit.stunned||unit.suffocated||unit.immobilized)&&<i className="status">{unit.suffocated?"SUFOCADA":unit.stunned?"ATORDOADA":unit.frozen?"CONGELADA":unit.immobilized?"IMOBILIZADA":"VIRADA"}</i>}',
            '{(((unit.exhausted&&!activeEffect&&!unit.impacting)||unit.frozen||unit.stunned||unit.suffocated||unit.immobilized))&&<i className="status">{unit.suffocated?"SUFOCADA":unit.stunned?"ATORDOADA":unit.frozen?"CONGELADA":unit.immobilized?"IMOBILIZADA":"VIRADA"}</i>}')

          # Export a cached card-page renderer for opponent spell reveal.
          p=Path('app/remote-card-art.tsx'); t=p.read_text()
          if 'export async function renderRemoteCardArtToCanvas' not in t:
              anchor='type RemoteCardArtProps = {'
              helper='''export async function renderRemoteCardArtToCanvas(canvas: HTMLCanvasElement, page: number, cssWidth = 120) {
  const pdfPage = await loadCatalogPage(page);
  const baseViewport = pdfPage.getViewport({ scale: 1 });
  const width = Math.max(cssWidth, canvas.clientWidth, 120);
  const pixelRatio = Math.min(globalThis.devicePixelRatio || 1, 1.5);
  const viewport = pdfPage.getViewport({ scale: (width / baseViewport.width) * pixelRatio });
  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);
  canvas.style.aspectRatio = `${baseViewport.width} / ${baseViewport.height}`;
  const context = canvas.getContext("2d", { alpha: false });
  if (!context) throw new Error("Canvas indisponível");
  const renderTask = pdfPage.render({ canvas, canvasContext: context, viewport });
  await renderTask.promise;
  canvas.dataset.loaded = "true";
}

'''
              if anchor not in t: raise SystemExit('missing remote art anchor')
              t=t.replace(anchor,helper+anchor,1)
              p.write_text(t)

          # Presentation runtime: strip VIRADA from clones and reveal opponent card face at flight start.
          p=Path('app/game-presentation-runtime.tsx'); t=p.read_text()
          imp='import { animateActionCue, captureActionCue, type ActionCue } from "./presentation-action-cues";'
          if 'import { renderRemoteCardArtToCanvas } from "./remote-card-art";' not in t:
              if imp not in t: raise SystemExit('missing presentation import anchor')
              t=t.replace(imp,imp+'\nimport { renderRemoteCardArtToCanvas } from "./remote-card-art";',1)
          anchor='  clone.querySelectorAll<HTMLElement>("[id]").forEach((node) => node.removeAttribute("id"));'
          if 'toUpperCase() === "VIRADA"' not in t:
              if anchor not in t: raise SystemExit('missing clone anchor')
              t=t.replace(anchor,'  clone.querySelectorAll<HTMLElement>(".status").forEach((node) => {\n    if (node.textContent?.trim().toUpperCase() === "VIRADA") node.remove();\n  });\n'+anchor,1)
          played='''function playedCardForDetail(detail: PresentationDetail) {
  const owner: Owner = Number(detail.command?.owner || 0) === 1 ? 1 : 0;
  const id = String(detail.command?.cardId || "");
  return (detail.before?.players?.[owner]?.hand || []).find((card: any) => String(card?.id || card?.uid || "") === id);
}
'''
          if 'async function revealOpponentPlayedCard' not in t:
              helper=played+'''
async function createRevealedOpponentCardFace(card: any, width: number) {
  const face = document.createElement("button");
  face.type = "button";
  face.tabIndex = -1;
  face.className = "original-card hh-opponent-play-reveal";
  face.setAttribute("aria-label", String(card?.name || "Carta jogada pelo oponente"));
  face.dataset.cardPage = String(Number(card?.page || 0));
  face.dataset.cardName = String(card?.name || "Carta jogada pelo oponente");
  const canvas = document.createElement("canvas");
  canvas.className = "remote-card-art";
  canvas.setAttribute("role", "img");
  canvas.setAttribute("aria-label", String(card?.name || "Carta jogada pelo oponente"));
  canvas.dataset.page = String(Number(card?.page || 0));
  face.append(canvas);
  try {
    await renderRemoteCardArtToCanvas(canvas, Number(card?.page || 0), Math.max(120, width));
  } catch {
    face.classList.add("hh-opponent-play-reveal-failed");
  }
  return face;
}

async function revealOpponentPlayedCard(detail: PresentationDetail, flights: Flight[]) {
  const owner: Owner = Number(detail.command?.owner || 0) === 1 ? 1 : 0;
  if (detail.command?.type !== "playCard" || owner !== 1) return;
  const card = playedCardForDetail(detail);
  if (!card) return;
  for (const flight of flights.filter((candidate) => candidate.sourcePlay)) {
    flight.face = flight.destination
      ? cloneRendered(flight.destination)
      : await createRevealedOpponentCardFace(card, flight.from.width);
  }
}
'''
              if played not in t: raise SystemExit('missing playedCardForDetail anchor')
              t=t.replace(played,helper,1)
          old='if (grave) flights.unshift({ kind: "cast", from: playedSource.rect, to: grave.rect, face: playedSource.clone, targets });'
          if old not in t: raise SystemExit('missing cast flight anchor')
          t=t.replace(old,'if (grave) flights.unshift({ kind: "cast", from: playedSource.rect, to: grave.rect, face: playedSource.clone, targets, sourcePlay: true });',1)
          old='    const flights = buildFlights(detail, beforeDom, afterDom);\n    const spellFlight = flights.find((flight) => flight.kind === "cast") || null;'
          if old not in t: raise SystemExit('missing present flight anchor')
          t=t.replace(old,'    const flights = buildFlights(detail, beforeDom, afterDom);\n    await revealOpponentPlayedCard(detail, flights);\n    const spellFlight = flights.find((flight) => flight.kind === "cast") || null;',1)
          p.write_text(t)

          # CSS for standalone revealed opponent card.
          p=Path('app/game-presentation.css'); t=p.read_text()
          if '.hh-opponent-play-reveal {' not in t:
              anchor='.hh-flight-card.is-cast {'
              rule='''.hh-opponent-play-reveal {
  display: block !important;
  width: 100% !important;
  height: 100% !important;
  min-width: 0 !important;
  min-height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  background: transparent !important;
  overflow: hidden !important;
  pointer-events: none !important;
}
.hh-opponent-play-reveal > .remote-card-art {
  display: block !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: contain !important;
}

'''
              if anchor not in t: raise SystemExit('missing presentation css anchor')
              t=t.replace(anchor,rule+anchor,1); p.write_text(t)

          # Infer online remote playCard instead of degrading every opponent revision to onlineSnapshot.
          p=Path('app/presentation-event-bridge.tsx'); t=p.read_text()
          attack='''const attackFromCombat = (combat: any) => combat?.attackerUid ? {
  type: "attack",
  owner: Number(combat.attackerOwner) === 1 ? 1 : 0,
  attackerId: combat.attackerUid,
  ...(combat.targetHero || !combat.defenderUid ? { targetHero: true } : { defenderId: combat.defenderUid }),
} : null;
'''
          if 'const inferOpponentPlayCommand' not in t:
              helper=attack+'''
const stateFieldCards = (player: any) => [
  ...(player?.board || []),
  ...(player?.support || []),
  ...(player?.terrain ? [player.terrain] : []),
];
const identityCounts = (cards: any[] = []) => {
  const counts = new Map<string, number>();
  cards.forEach((card) => counts.set(cardIdentity(card), (counts.get(cardIdentity(card)) || 0) + 1));
  return counts;
};
const inferOpponentPlayCommand = (before: any, after: any) => {
  const beforePlayer = before?.players?.[1], afterPlayer = after?.players?.[1];
  if (!beforePlayer || !afterPlayer) return null;
  const beforeHand = identityCounts(beforePlayer.hand || []), afterHand = identityCounts(afterPlayer.hand || []);
  const removed = (beforePlayer.hand || []).find((card: any) => {
    const id = cardIdentity(card);
    return (afterHand.get(id) || 0) < (beforeHand.get(id) || 0);
  });
  if (!removed) return null;
  const id = cardIdentity(removed);
  const beforeFields = identityCounts(stateFieldCards(beforePlayer)), afterFields = identityCounts(stateFieldCards(afterPlayer));
  const beforeGrave = identityCounts(beforePlayer.grave || []), afterGrave = identityCounts(afterPlayer.grave || []);
  const becameVisible = (afterFields.get(id) || 0) > (beforeFields.get(id) || 0)
    || (afterGrave.get(id) || 0) > (beforeGrave.get(id) || 0);
  return becameVisible ? { type: "playCard", owner: 1, cardId: id } : null;
};
'''
              if attack not in t: raise SystemExit('missing attackFromCombat anchor')
              t=t.replace(attack,helper,1)
          line='      const combatCommand = hasPresentableDelta(previous.game, after) ? attackFromCombat(previous.game?.combatAction) : null;\n'
          if 'const opponentPlayCommand =' not in t:
              if line not in t: raise SystemExit('missing combatCommand line')
              t=t.replace(line,line+'      const opponentPlayCommand = hasPresentableDelta(previous.game, after) ? inferOpponentPlayCommand(previous.game, after) : null;\n',1)
          old='        command: combatCommand || { type: "onlineSnapshot", owner: 1 },'
          if old not in t: raise SystemExit('missing onlineSnapshot command line')
          t=t.replace(old,'        command: combatCommand || opponentPlayCommand || { type: "onlineSnapshot", owner: 1 },',1)
          p.write_text(t)

          # Regression tests.
          p=Path('tests/combat-animation-flow.test.mjs'); t=p.read_text()
          if 'legacy hero-hurt CSS cannot override' not in t:
              t += r'''

test("legacy hero-hurt CSS cannot override the authoritative tiny hero shake", () => {
  const css = read("app/ui-overrides.css");
  assert.match(css, /player-hero\.hero-hurt>\.hero-power-trigger\{animation:none!important\}/);
  const pulse = css.slice(css.indexOf("@keyframes heroDamagePulse"), css.indexOf("@keyframes heroDamageFlash"));
  assert.doesNotMatch(pulse, /scale\(/);
});

test("command bar runtime uses the same compact caps as the stylesheet", () => {
  const runtime = read("app/match-ui-runtime.tsx");
  assert.match(runtime, /COMMAND_TITLE_SIZE = "clamp\(\.62rem,min\(\.72vw,1\.28dvh\),\.74rem\)"/);
  assert.match(runtime, /COMMAND_COPY_SIZE = "clamp\(\.74rem,min\(\.88vw,1\.56dvh\),\.92rem\)"/);
  assert.match(runtime, /COMMAND_COMPACT_COPY_SIZE = "clamp\(\.7rem,min\(\.8vw,1\.42dvh\),\.86rem\)"/);
  assert.match(runtime, /COMMAND_DENSE_COPY_SIZE = "clamp\(\.66rem,min\(\.74vw,1\.32dvh\),\.8rem\)"/);
});

test("turned cards hide the VIRADA plate while presenting effects", () => {
  const page = read("app/page.tsx");
  const runtime = read("app/game-presentation-runtime.tsx");
  assert.match(page, /unit\.exhausted&&!activeEffect&&!unit\.impacting/);
  assert.match(runtime, /toUpperCase\(\) === "VIRADA"/);
});

test("opponent plays reveal the actual card face at flight start", () => {
  const runtime = read("app/game-presentation-runtime.tsx");
  const art = read("app/remote-card-art.tsx");
  const bridge = read("app/presentation-event-bridge.tsx");
  assert.match(art, /export async function renderRemoteCardArtToCanvas/);
  assert.match(runtime, /async function revealOpponentPlayedCard/);
  assert.match(runtime, /owner !== 1/);
  assert.match(runtime, /sourcePlay: true/);
  assert.match(runtime, /await revealOpponentPlayedCard\(detail, flights\)/);
  assert.match(bridge, /const inferOpponentPlayCommand/);
  assert.match(bridge, /combatCommand \|\| opponentPlayCommand \|\|/);
});
'''
              p.write_text(t)
          PY
      - name: Remove temporary workflow before validation
        run: rm .github/workflows/apply-opponent-reveal-ui-fixes-v2.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate canonical project state
        run: npm run prepare:project
      - name: Focused tests
        run: node --test tests/combat-animation-flow.test.mjs tests/presentation-dedupe-regression.test.mjs
      - name: Full rules suite
        run: npm run test:rules
      - name: Production build
        run: npm run vercel-build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/match-ui-runtime.tsx app/ui-overrides.css app/page.tsx app/remote-card-art.tsx app/game-presentation-runtime.tsx app/game-presentation.css app/presentation-event-bridge.tsx tests/combat-animation-flow.test.mjs .github/workflows/apply-opponent-reveal-ui-fixes-v2.yml
          git commit -m "fix: reveal opponent plays and enforce presentation UI guards"
          git push origin HEAD:feat/presentation-system-pr1
