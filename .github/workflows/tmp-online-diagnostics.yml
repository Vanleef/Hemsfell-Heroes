name: Temporary Online diagnostics validation

on:
  pull_request:
    branches:
      - design/online-priority-flow-rework

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/online-priority-flow-rework
          fetch-depth: 0

      - name: Fast-forward to latest feature head
        run: git pull --ff-only origin design/online-priority-flow-rework

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply diagnostics patch
        run: python .github/scripts/tmp-online-diagnostics.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused Online regressions
        run: node --test tests/online-diagnostics.test.mjs tests/online-command-idempotency.test.mjs tests/online-priority-engine.test.mjs tests/online-reconnect-flow.test.mjs tests/limo-tranqueira-regression.test.mjs

      - name: Run rules regression suite
        run: npm run test:rules

      - name: Typecheck Online surfaces
        run: npm run typecheck:online

      - name: Commit canonical changes and remove temporary mutator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/tmp-online-diagnostics.py .github/workflows/tmp-online-diagnostics.yml
          git add app/api/rooms/online-diagnostics.mjs app/api/rooms/machine.ts app/api/rooms/[id]/route.ts docs/online-priority-implementation.md tests/online-diagnostics.test.mjs tests/online-command-idempotency.test.mjs
          git commit -m "fix: make Online retries observable and write-safe"
          git fetch origin design/online-priority-flow-rework
          git rebase origin/design/online-priority-flow-rework
          git push origin HEAD:design/online-priority-flow-rework
