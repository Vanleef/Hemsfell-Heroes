name: One-shot online combat lock fix

on:
  push:
    branches: [fix/cards_mechanics]
    paths: [.github/workflows/one-shot-online-command-retry.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - name: Patch authoritative online combat flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text(encoding='utf-8')

          def replace_once(old,new,label):
              global s
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label} match count={count}')
              s=s.replace(old,new,1)

          old=''' const beginAttack=(owner:0|1,attackerUid:string)=>{if(!game||game.phase!=="combate"||game.active!==owner||combatAction||responseWindow)return;const attacker=game.players[owner].board.find(x=>x.uid===attackerUid),attacksUsed=attacker?.attacksThisTurn??(attacker?.attackedThisTurn?1:0);if(!attacker||attacker.exhausted||attacksUsed>=(attacker.attackLimit||1)||attacker.summoning||attacker.stunned||attacker.immobilized)return;\n  const player=game.players[owner],commander=player.board.find(unit=>unit.slot===2&&!unit.suffocated);\n  if(player.heroId==="tessalia"&&attacker.slot!==2&&!commander){update(g=>log(g,"Tessália precisa de um Comandante no espaço central para atacar com outras criaturas.","danger"));return}\n  if(player.heroId==="tessalia"&&attacker.slot===2)update(g=>{g.players[owner].heroXP++;log(g,"O Comandante de Tessália atacou: progresso de evolução +1.","effect")});\n  setTargeting(null);setSharedCombat({attackerOwner:owner,attackerUid,attackerCard:baseCard(attacker),stage:"declared"})};'''
          new=''' const beginAttack=(owner:0|1,attackerUid:string)=>{const pending=mode==="online"?game?.pendingResponse:responseWindow;if(!game||game.phase!=="combate"||game.active!==owner||combatAction||pending)return;const attacker=game.players[owner].board.find(x=>x.uid===attackerUid),attacksUsed=attacker?.attacksThisTurn??(attacker?.attackedThisTurn?1:0);if(!attacker||attacker.exhausted||attacksUsed>=(attacker.attackLimit||1)||attacker.summoning||attacker.stunned||attacker.immobilized)return;\n  const player=game.players[owner],commander=player.board.find(unit=>unit.slot===2&&!unit.suffocated);\n  if(player.heroId==="tessalia"&&attacker.slot!==2&&!commander){if(mode!=="online")update(g=>log(g,"Tessália precisa de um Comandante no espaço central para atacar com outras criaturas.","danger"));return}\n  setTargeting(null);\n  if(mode==="online"){void runRulesCommand({type:"declareAttack",attackerId:attackerUid},owner);return}\n  if(player.heroId==="tessalia"&&attacker.slot===2)update(g=>{g.players[owner].heroXP++;log(g,"O Comandante de Tessália atacou: progresso de evolução +1.","effect")});\n  setSharedCombat({attackerOwner:owner,attackerUid,attackerCard:baseCard(attacker),stage:"declared"})};'''
          replace_once(old,new,'beginAttack')

          old='''   if(action.stage==="declared"){if(mode==="online"){void runRulesCommand({type:"declareAttack",attackerId:action.attackerUid},action.attackerOwner);return}const priorityAction={...action,stage:"priority" as const};setSharedCombat(priorityAction);setSharedResponse({responder:defenderOwner,actor:action.attackerOwner,action:`declaração de ataque de ${action.attackerCard.name}`},priorityAction);return}'''
          new='''   if(action.stage==="declared"){if(mode==="online")return;const priorityAction={...action,stage:"priority" as const};setSharedCombat(priorityAction);setSharedResponse({responder:defenderOwner,actor:action.attackerOwner,action:`declaração de ataque de ${action.attackerCard.name}`},priorityAction);return}'''
          replace_once(old,new,'declared combat driver')

          old=''' useEffect(()=>{if(!game||responseWindow?.responder!==0||priorityControl!=="assisted")return;if(hasUsablePriorityResponse(game,0))return;const t=setTimeout(()=>{void passPriorityWindow(0,true)},80);return()=>clearTimeout(t)},[game,responseWindow,mode,priorityControl]);'''
          new=''' useEffect(()=>{const pending=game?.pendingResponse;if(!game||pending?.responder!==0||priorityControl!=="assisted")return;if(hasUsablePriorityResponse(game,0))return;const key=`${pending.actor}:${pending.responder}:${pending.passes??0}:${pending.action}:${pending.deadline??0}`;const t=setTimeout(()=>{const current=currentGameRef.current?.pendingResponse;if(!current||current.responder!==0)return;const currentKey=`${current.actor}:${current.responder}:${current.passes??0}:${current.action}:${current.deadline??0}`;if(currentKey===key)void passPriorityWindow(0,true)},80);return()=>clearTimeout(t)},[game?.pendingResponse?.actor,game?.pendingResponse?.responder,game?.pendingResponse?.passes,game?.pendingResponse?.action,game?.pendingResponse?.deadline,priorityControl]);'''
          replace_once(old,new,'assisted priority')

          if 'window.setInterval(fn,600)' in s:
              s=s.replace('window.setInterval(fn,600)','window.setInterval(fn,300)',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate online typecheck
        run: npx tsc -p tsconfig.online.json --noEmit
      - name: Validate combat transport invariants
        shell: bash
        run: |
          grep -q 'if(mode==="online"){void runRulesCommand({type:"declareAttack",attackerId:attackerUid},owner);return}' app/page.tsx
          grep -q 'if(action.stage==="declared"){if(mode==="online")return;' app/page.tsx
          grep -q 'currentGameRef.current?.pendingResponse' app/page.tsx
          grep -q 'window.setInterval(fn,300)' app/page.tsx
      - name: Commit validated fix and remove one-shot helpers
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-online-command-retry.yml
          rm -f .github/workflows/fix-online-combat-lock.yml scripts/fix-online-combat-lock.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make online attack declaration authoritative'
          git push origin HEAD:fix/cards_mechanics
