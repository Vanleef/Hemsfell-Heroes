name: P1 Current Suite Diagnostic

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - scripts/diagnose-p1-tests.mjs
      - .github/workflows/p1-current-suite-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare generated project artifacts
        run: npm run prepare:project
      - name: Run each Node test independently
        run: node scripts/diagnose-p1-tests.mjs || true
      - name: Publish diagnostic report when needed
        run: |
          if grep -q '^ALL TEST FILES PASSED' p1-test-diagnostic.txt; then
            echo 'All individual tests passed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p1-test-diagnostic.txt
          git commit -m "chore: capture P1 failing test diagnostic"
          git push origin HEAD:feat/web-card-game-quality-foundation
          exit 1
