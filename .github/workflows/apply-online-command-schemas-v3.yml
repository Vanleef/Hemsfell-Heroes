name: Apply Online command schemas v3

on:
  push:
    branches: [feat/web-card-game-quality-foundation]
    paths: [.github/workflows/apply-online-command-schemas-v3.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci

      - name: Add explicit Online command schemas
        run: |
          cat > app/api/rooms/online-command-schema.mjs <<'EOF'
          const TYPES = [
            "playCard", "activate", "activateHero", "evolveHero", "maintenanceChoice",
            "declareAttack", "selectDefender", "attack", "advancePhase", "resolveDecision",
            "reposition", "confirmReposition", "passPriority", "surrender",
          ];
          export const ONLINE_COMMAND_TYPES = Object.freeze([...TYPES]);
          const TYPE_SET = new Set(TYPES);

          const INTERNAL_KEYS = new Set(["owner", "instanceId", "hasPriority", "skipPriority", "__priorityPayment", "__lockedCost"]);
          const MAX_ID = 192;
          const MAX_LIST = 16;
          const MAX_MARKER_SELECTIONS = 20;

          const fail = (code, error) => ({ ok: false, code, error });
          const plainRecord = (value) => !!value && typeof value === "object" && !Array.isArray(value) && Object.getPrototypeOf(value) === Object.prototype;
          const text = (value) => typeof value === "string" && value.length > 0 && value.length <= MAX_ID && !/[\u0000-\u001f\u007f]/.test(value);
          const integer = (value, min = 0, max = Number.MAX_SAFE_INTEGER) => Number.isInteger(value) && value >= min && value <= max;
          const bool = (value) => typeof value === "boolean";
          const stringList = (value) => Array.isArray(value) && value.length <= MAX_LIST && value.every(text);
          const optional = (validator) => (value) => value === undefined || validator(value);
          const oneOf = (...values) => (value) => values.includes(value);
          const markerSelections = (value) => Array.isArray(value) && value.length <= MAX_MARKER_SELECTIONS && value.every((item) => plainRecord(item) && text(item.id) && integer(item.amount, 1, 99) && Object.keys(item).every((key) => key === "id" || key === "amount"));
          const moves = (value) => Array.isArray(value) && value.length <= 5 && value.every((item) => plainRecord(item) && text(item.sourceId) && integer(item.slot, 0, 4) && Object.keys(item).every((key) => key === "sourceId" || key === "slot"));

          const decisionFields = {
            choiceIndex: optional((value) => integer(value, 0, 63)),
            selectedCardId: optional(text),
            selectedCardIds: optional(stringList),
            targetIds: optional(stringList),
            sacrificeIds: optional(stringList),
            attackerId: optional(text),
            defenderId: optional(text),
            slot: optional((value) => integer(value, 0, 4)),
            placementZone: optional(oneOf("creature", "support", "terrain")),
            markerAmount: optional((value) => integer(value, 0, 99)),
            markerSelections: optional(markerSelections),
          };

          const schemas = {
            playCard: {
              cardId: optional(text), handIndex: optional((value) => integer(value, 0, 99)),
              slot: optional((value) => integer(value, 0, 4)), placementZone: optional(oneOf("creature", "support", "terrain")),
              attachedTo: optional(text), targetIds: optional(stringList), sacrificeIds: optional(stringList),
              chosenElement: optional(oneOf("Fogo", "Água", "Terra", "Ar")), selectedImageName: optional(text),
              cafeEffect: optional(oneOf("cats", "heal", "draw", "level")), elementalTargetId: optional(text),
            },
            activate: {
              sourceId: text, abilityId: text, markerAmount: optional((value) => integer(value, 0, 99)),
              targetIds: optional(stringList), sacrificeIds: optional(stringList), markerSelections: optional(markerSelections),
            },
            activateHero: { abilityId: text, targetIds: optional(stringList), markerAmount: optional((value) => integer(value, 0, 99)) },
            evolveHero: {},
            maintenanceChoice: { drawTwo: bool },
            declareAttack: { attackerId: text },
            selectDefender: { attackerId: optional(text), defenderId: optional(text), targetHero: optional(bool) },
            attack: { attackerId: text, defenderId: optional(text) },
            advancePhase: {},
            resolveDecision: decisionFields,
            reposition: { moves },
            confirmReposition: {},
            passPriority: { auto: optional(bool) },
            surrender: {},
          };

          function cleanInput(input) {
            const cleaned = {};
            for (const [key, value] of Object.entries(input)) {
              if (INTERNAL_KEYS.has(key) || key.startsWith("__")) continue;
              cleaned[key] = value;
            }
            return cleaned;
          }

          export function parseOnlineCommand(input) {
            if (!plainRecord(input)) return fail("command.invalid_shape", "invalid command");
            const type = input.type;
            if (typeof type !== "string" || !TYPE_SET.has(type)) return fail("command.unsupported", "unsupported command");
            const cleaned = cleanInput(input);
            const schema = schemas[type];
            const allowed = new Set(["type", ...Object.keys(schema)]);
            const unknown = Object.keys(cleaned).find((key) => !allowed.has(key));
            if (unknown) return fail("command.invalid_shape", `invalid command field: ${unknown}`);
            if (type === "playCard" && !text(cleaned.cardId) && !integer(cleaned.handIndex, 0, 99)) return fail("command.invalid_shape", "playCard requires cardId or handIndex");
            if (type === "selectDefender" && cleaned.targetHero !== true && !text(cleaned.defenderId)) return fail("command.invalid_shape", "selectDefender requires defenderId or targetHero");
            for (const [key, validator] of Object.entries(schema)) {
              if (!validator(cleaned[key])) return fail("command.invalid_shape", `invalid command field: ${key}`);
            }
            return { ok: true, command: cleaned };
          }

          export function ruleErrorCode(message) {
            const normalized = String(message || "rejected").trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 80);
            return `rules.${normalized || "rejected"}`;
          }
          EOF

          cat > app/api/rooms/online-command-schema.d.mts <<'EOF'
          export type OnlineCommand = Record<string, unknown> & { type: string };
          export type OnlineCommandParseResult =
            | { ok: true; command: OnlineCommand }
            | { ok: false; code: string; error: string };
          export const ONLINE_COMMAND_TYPES: readonly string[];
          export function parseOnlineCommand(input: unknown): OnlineCommandParseResult;
          export function ruleErrorCode(message: unknown): string;
          EOF

      - name: Integrate schemas with authoritative room machine
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/rooms/machine.ts'); text=p.read_text()
          anchor='import type { UserDeck } from "../../user-deck.mjs";\n'
          if text.count(anchor)!=1: raise SystemExit('machine import anchor changed')
          text=text.replace(anchor,anchor+'import { parseOnlineCommand, ruleErrorCode } from "./online-command-schema.mjs";\n',1)

          marker='export function applyRulesCommand('
          start=text.index(marker)
          head,body=text[:start],text[start:]
          replacements=[
            ('return { ok: false, status: 400, error: "command id required" };','return { ok: false, status: 400, error: "command id required", code: "command.invalid_id" };'),
            ('return { ok: true, status: 200, error: "", duplicate: true };','return { ok: true, status: 200, error: "", code: "command.duplicate", duplicate: true };'),
            ('if (room.status !== "started" || !room.game) return { ok: false, status: 409, error: "room not started" };','if (room.status !== "started" || !room.game) return { ok: false, status: 409, error: "room not started", code: "command.match_not_started" };'),
            ('return { ok: false, status: 409, error: "stale revision" };','return { ok: false, status: 409, error: "stale revision", code: "command.stale_revision" };'),
            ('return { ok: false, status: 409, error: "match paused for reconnect" };','return { ok: false, status: 409, error: "match paused for reconnect", code: "command.reconnecting" };'),
          ]
          for old,new in replacements:
            if body.count(old)!=1: raise SystemExit(f'applyRulesCommand result anchor changed: {old}')
            body=body.replace(old,new,1)

          old='''  if (!AUTHORITATIVE_COMMANDS.has(String(rawCommand.type || ""))) {\n    logOnlineDiagnostic(room, "command-rejected", { role, commandType: String(rawCommand.type || ""), reason: "unsupported command", baseRevision });\n    return { ok: false, status: 400, error: "unsupported command" };\n  }\n  const owner = role === "host" ? 0 : 1;\n  try {\n    /* Never trust an owner sent by the browser. Authentication selects it. */\n    const command: Record<string, any> = { ...rawCommand, owner };\n'''
          new='''  const parsedCommand = parseOnlineCommand(rawCommand);\n  if (!parsedCommand.ok) {\n    logOnlineDiagnostic(room, "command-rejected", { role, commandType: String(rawCommand.type || ""), reason: parsedCommand.code, baseRevision });\n    return { ok: false, status: 400, error: parsedCommand.error, code: parsedCommand.code };\n  }\n  if (!AUTHORITATIVE_COMMANDS.has(parsedCommand.command.type)) {\n    logOnlineDiagnostic(room, "command-rejected", { role, commandType: parsedCommand.command.type, reason: "command.unsupported", baseRevision });\n    return { ok: false, status: 400, error: "unsupported command", code: "command.unsupported" };\n  }\n  const owner = role === "host" ? 0 : 1;\n  try {\n    /* Browser payloads are schema-normalized first. Authentication owns the\n       player index, and permanent instance identity is minted by the server. */\n    const command: Record<string, any> = { ...parsedCommand.command, owner };\n    if (command.type === "playCard") command.instanceId = crypto.randomUUID();\n'''
          if body.count(old)!=1: raise SystemExit('machine command boundary anchor changed')
          body=body.replace(old,new,1)

          for old,new in [
            ('return { ok: false, status: 409, error: "combat state mismatch" };','return { ok: false, status: 409, error: "combat state mismatch", code: "command.combat_state_mismatch" };'),
            ('if (!combat || combat.stage !== "choosing") return { ok: false, status: 409, error: "blocker choice unavailable" };','if (!combat || combat.stage !== "choosing") return { ok: false, status: 409, error: "blocker choice unavailable", code: "command.blocker_unavailable" };'),
            ('if (1 - combat.attackerOwner !== owner) return { ok: false, status: 403, error: "only defender may choose blocker" };','if (1 - combat.attackerOwner !== owner) return { ok: false, status: 403, error: "only defender may choose blocker", code: "command.only_defender_may_block" };'),
          ]:
            if body.count(old)!=1: raise SystemExit(f'combat boundary anchor changed: {old}')
            body=body.replace(old,new,1)

          old='''    return { ok: true, status: 200, error: "", trace, duplicate: false };\n  } catch (error) {\n    const message = error instanceof Error ? error.message : "invalid command";\n    logOnlineDiagnostic(room, "command-rejected", { role, commandType: String(rawCommand.type || ""), reason: message, baseRevision });\n    return { ok: false, status: 400, error: message };\n  }\n}'''
          new='''    return { ok: true, status: 200, error: "", code: "command.accepted", trace, duplicate: false };\n  } catch (error) {\n    const message = error instanceof Error ? error.message : "invalid command";\n    const code = ruleErrorCode(message);\n    logOnlineDiagnostic(room, "command-rejected", { role, commandType: parsedCommand.command.type, reason: code, baseRevision });\n    return { ok: false, status: 400, error: message, code };\n  }\n}'''
          if body.count(old)!=1: raise SystemExit('machine command result anchor changed')
          body=body.replace(old,new,1)
          p.write_text(head+body)

          p=Path('app/api/rooms/[id]/route.ts'); text=p.read_text()
          old='''      const resolution = applyRulesCommand(room, role, body.command, body.baseRevision, body.commandId);\n      if (!resolution.ok) return NextResponse.json({ error: resolution.error, ...roomView(room, true, role) }, { status: resolution.status, ...noStore });\n'''
          new='''      const resolution = applyRulesCommand(room, role, body.command, body.baseRevision, body.commandId);\n      if (!resolution.ok) return NextResponse.json({ error: resolution.error, code: resolution.code, ...roomView(room, true, role) }, { status: resolution.status, ...noStore });\n'''
          if text.count(old)!=1: raise SystemExit('route command response anchor changed')
          p.write_text(text.replace(old,new,1))
          PY

      - name: Add command-boundary regression tests
        run: |
          cat > tests/online-command-schema.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { ONLINE_COMMAND_TYPES, parseOnlineCommand, ruleErrorCode } from '../app/api/rooms/online-command-schema.mjs';

          const valid = [
            { type: 'playCard', cardId: 'p55', instanceId: 'client-owned', owner: 1, hasPriority: true, slot: 2, targetIds: ['enemy-hero'], chosenElement: 'Fogo' },
            { type: 'activate', sourceId: 'u1', abilityId: 'a1', markerAmount: 3 },
            { type: 'activateHero', abilityId: 'saymon-level-1', targetIds: ['enemy-hero'] },
            { type: 'evolveHero' },
            { type: 'maintenanceChoice', drawTwo: true },
            { type: 'declareAttack', attackerId: 'u1' },
            { type: 'selectDefender', attackerId: 'u1', defenderId: 'u2', targetHero: false },
            { type: 'selectDefender', attackerId: 'u1', targetHero: true },
            { type: 'attack', attackerId: 'u1', defenderId: 'u2' },
            { type: 'advancePhase' },
            { type: 'resolveDecision', choiceIndex: 1, targetIds: ['u2'], selectedCardIds: ['p1'], markerSelections: [{ id: 'u3', amount: 2 }] },
            { type: 'reposition', moves: [{ sourceId: 'u1', slot: 4 }] },
            { type: 'confirmReposition' },
            { type: 'passPriority', auto: true },
            { type: 'surrender' },
          ];

          test('every authoritative Online command type has an explicit accepted schema example', () => {
            assert.deepEqual(new Set(valid.map((item) => item.type)), new Set(ONLINE_COMMAND_TYPES));
            for (const command of valid) assert.equal(parseOnlineCommand(command).ok, true, command.type);
          });

          test('browser-owned authority fields are removed before execution', () => {
            const parsed = parseOnlineCommand({ type: 'playCard', cardId: 'p55', instanceId: 'forged', owner: 1, hasPriority: true, skipPriority: true, __priorityPayment: { cost: 0 } });
            assert.equal(parsed.ok, true);
            assert.deepEqual(parsed.command, { type: 'playCard', cardId: 'p55' });
          });

          test('unknown and malformed command fields fail closed with stable codes', () => {
            assert.deepEqual(parseOnlineCommand({ type: 'teleport', sourceId: 'u1' }), { ok: false, code: 'command.unsupported', error: 'unsupported command' });
            assert.equal(parseOnlineCommand({ type: 'declareAttack' }).code, 'command.invalid_shape');
            assert.equal(parseOnlineCommand({ type: 'maintenanceChoice', extraEnergy: true }).code, 'command.invalid_shape');
            assert.equal(parseOnlineCommand({ type: 'playCard', cardId: 'p1', surpriseState: { life: 999 } }).code, 'command.invalid_shape');
            assert.equal(parseOnlineCommand({ type: 'resolveDecision', targetIds: Array.from({ length: 17 }, (_, i) => `u${i}`) }).code, 'command.invalid_shape');
            assert.equal(parseOnlineCommand({ type: 'reposition', moves: [{ sourceId: 'u1', slot: 5 }] }).code, 'command.invalid_shape');
          });

          test('engine errors map to translatable bounded rule codes', () => {
            assert.equal(ruleErrorCode('not-your-priority'), 'rules.not_your_priority');
            assert.match(ruleErrorCode('Target is invalid!'), /^rules\.[a-z0-9_]+$/);
          });

          test('room machine strips client authority and mints playCard identity server-side', async () => {
            const machine = await readFile(new URL('../app/api/rooms/machine.ts', import.meta.url), 'utf8');
            const route = await readFile(new URL('../app/api/rooms/[id]/route.ts', import.meta.url), 'utf8');
            assert.match(machine, /parseOnlineCommand\(rawCommand\)/);
            assert.match(machine, /command\.type === "playCard"\) command\.instanceId = crypto\.randomUUID\(\)/);
            assert.match(machine, /const command: Record<string, any> = \{ \.\.\.parsedCommand\.command, owner \}/);
            assert.match(route, /code: resolution\.code/);
          });
          EOF

      - name: Remove temporary workflows before canonical gates
        run: rm -f .github/workflows/apply-online-command-schemas.yml .github/workflows/apply-online-command-schemas-v2.yml .github/workflows/apply-online-command-schemas-v3.yml

      - name: Focused command-boundary tests
        run: node --test tests/online-command-schema.test.mjs tests/online-authority.test.mjs tests/online-idempotency.test.mjs tests/online-single-combat-flow.test.mjs tests/online-maintenance-choice.test.mjs
      - name: Patch hygiene
        run: git diff --check
      - name: Complete rules suite
        run: npm run test:rules
      - name: AI benchmark
        run: npm run ai:calibrate:benchmark
      - name: Production build
        run: npm run vercel-build

      - name: Commit validated command schemas
        run: |
          git fetch origin feat/web-card-game-quality-foundation
          test "$(git rev-parse origin/feat/web-card-game-quality-foundation)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: validate Online commands at server boundary"
          git push origin HEAD:feat/web-card-game-quality-foundation