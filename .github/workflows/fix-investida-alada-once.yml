name: Fix Investida Alada once

on:
  push:
    branches: [fix/cards_mechanics]
    paths:
      - .github/workflows/fix-investida-alada-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0

      - name: Patch Investida Alada rules and UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'app/rules-engine/card-rules.mjs',
              'p17: [ability("onPlay", [effect("forceAttack", { attacker: { controller: "self", subtype: "Dragão", ready: true }, defender: "anyCreature" })])],',
              'p17: [ability("onPlay", [effect("forceAttack", { attacker: { controller: "self", subtype: "Dragão", ready: true, allowSummoning: true }, defender: "enemyCreature" })], [], { playCondition: { controllerReadySubtype: "Dragão", enemyCreatureInPlay: true } })],'
          )

          replace_once(
              'app/rules-engine/engine-base.mjs',
              '|| attacker.summoning\n            || attacker.stunned',
              '|| (attacker.summoning && !decision.effect.attacker?.allowSummoning)\n            || attacker.stunned'
          )

          # Make play-condition matching understand Investida Alada's requirements.
          p = Path('app/rules-engine/engine-base.mjs')
          text = p.read_text()
          anchor = 'if (condition.anyCreatureInPlay && !state.players.some((candidate) => candidate.board.length > 0)) return false;'
          if anchor not in text:
              raise SystemExit('condition anchor not found')
          insertion = anchor + '\n  if (condition.enemyCreatureInPlay && !(state.players[1 - owner].board || []).length) return false;\n  if (condition.controllerReadySubtype && !(entry.board || []).some((card) => subtype(card, condition.controllerReadySubtype) && !card.exhausted && !card.stunned && !hasKeyword(card, /atordoado/i))) return false;'
          p.write_text(text.replace(anchor, insertion, 1))

          # UI hand requirement: cannot drag/play without both sides of the forced combat.
          replace_once(
              'app/page.tsx',
              'const cardPlayRequirementMet=(c:CardDef,p:Player)=>c.page!==48||p.grave.some(card=>hasFaction(card,"Goblin"));',
              'const cardPlayRequirementMet=(c:CardDef,p:Player)=>c.page===17?!!game&&p.board.some(card=>hasFaction(card,"Dragão")&&!card.exhausted&&!card.stunned)&&game.players[1].board.length>0:c.page!==48||p.grave.some(card=>hasFaction(card,"Goblin"));'
          )

          # Make forced-attack options owner-aware and allow a ready image Dragon even with summoning sickness.
          old = 'const forcedAttackOptions=forcedAttackDecision&&game?(engineDecision.effect.attackerId?(engineTargetSelection.length===0?game.players.flatMap(player=>player.board).filter(card=>card.uid===engineDecision.effect.attackerId):game.players.flatMap(player=>player.board).filter(card=>card.uid===engineDecision.effect.defenderId)):(engineTargetSelection.length===0?game.players[0].board.filter(card=>!card.exhausted&&!card.summoning&&hasFaction(card,"Dragão")):game.players[1].board)):[];'
          new = 'const forcedAttackOwner=forcedAttackDecision?(engineDecision.owner??0):0,forcedAttackOpponent=forcedAttackOwner===0?1:0; const forcedAttackOptions=forcedAttackDecision&&game?(engineDecision.effect.attackerId?(engineTargetSelection.length===0?game.players[forcedAttackOwner].board.filter(card=>card.uid===engineDecision.effect.attackerId):game.players[forcedAttackOpponent].board.filter(card=>card.uid===engineDecision.effect.defenderId)):(engineTargetSelection.length===0?game.players[forcedAttackOwner].board.filter(card=>!card.exhausted&&!card.stunned&&hasFaction(card,"Dragão")):game.players[forcedAttackOpponent].board)):[];'
          replace_once('app/page.tsx', old, new)

          # Forced attack uses board highlights instead of a fake card-list browser.
          old = 'forcedAttackDecision?<div className="visual-card-choice-grid">{forcedAttackOptions.map(card=><div className="visual-card-choice" key={card.uid}><OriginalCard card={card} small inspectable={false} onClick={()=>selectForcedAttack(card.uid)}/><span>{engineTargetSelection.length?"Escolher como defensor":"Escolher para atacar"}</span></div>)}</div>:'
          new = 'forcedAttackDecision?<div className="engine-target-instruction forced-attack-instruction"><b>{engineTargetSelection.length?"Escolha uma criatura inimiga":"Escolha um Dragão desvirado"}</b><em>Escolha diretamente uma das cartas destacadas no campo.</em></div>:'
          replace_once('app/page.tsx', old, new)

          # Route forced-attack targets through the same battlefield highlight/click mechanism used by target decisions.
          replace_once(
              'app/page.tsx',
              'ruleTargetIds={engineTargetIds} onRuleTarget={engineTargetDecision?selectEngineTarget:undefined}',
              'ruleTargetIds={forcedAttackDecision?forcedAttackOptions.map(card=>card.uid):engineTargetIds} onRuleTarget={forcedAttackDecision?selectForcedAttack:engineTargetDecision?selectEngineTarget:undefined}'
          )
          replace_once(
              'app/page.tsx',
              'ruleTargetIds={engineTargetIds} onRuleTarget={engineTargetDecision?selectEngineTarget:undefined}',
              'ruleTargetIds={forcedAttackDecision?forcedAttackOptions.map(card=>card.uid):engineTargetIds} onRuleTarget={forcedAttackDecision?selectForcedAttack:engineTargetDecision?selectEngineTarget:undefined}'
          )

          # Regression: freshly-created image Dragon is a valid attacker for Investida Alada.
          test_path = Path('tests/forced-attack.test.mjs')
          test_text = test_path.read_text()
          if 'Investida Alada allows a ready Image Dragon to attack immediately' not in test_text:
              test_text += '''\n\ntest("Investida Alada allows a ready Image Dragon to attack immediately", () => {\n  const game = state();\n  const imageDragon = unit({ uid: "image-dragon", name: "Dragão Filhote", atk: 2, hp: 1, tags: ["Dragão"] });\n  imageDragon.page = 23;\n  imageDragon.imageCard = true;\n  imageDragon.generatedImage = true;\n  imageDragon.summoning = true;\n  game.players[0].board.push(imageDragon);\n  game.players[1].board.push(unit({ uid: "enemy", name: "Inimigo", atk: 1, hp: 4 }));\n  game.pendingDecision.effect.attacker.allowSummoning = true;\n  game.pendingDecision.effect.defender = "enemyCreature";\n\n  const result = executeCommand(game, { type: "resolveDecision", owner: 0, attackerId: "image-dragon", defenderId: "enemy" }).state;\n  const enemy = result.players[1].board.find((card) => card.uid === "enemy");\n  assert.equal(enemy.damage, 2);\n  assert.equal(result.players[0].board.find((card) => card.uid === "image-dragon").exhausted, true);\n});\n'''
              test_path.write_text(test_text)
          PY

      - name: Verify source invariants
        run: |
          grep -q 'enemyCreatureInPlay: true' app/rules-engine/card-rules.mjs
          grep -q 'allowSummoning: true' app/rules-engine/card-rules.mjs
          grep -q 'forced-attack-instruction' app/page.tsx
          ! grep -q 'forcedAttackDecision?<div className="visual-card-choice-grid"' app/page.tsx

      - name: Run focused regressions
        run: node --test tests/forced-attack.test.mjs

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/rules-engine/card-rules.mjs app/rules-engine/engine-base.mjs tests/forced-attack.test.mjs
          git commit -m 'fix: repair Investida Alada targeting' || exit 0
          git push origin HEAD:fix/cards_mechanics
