name: Fix Dancadon lethal once
on:
  push:
    branches: [fix/cards_mechanics]
    paths: [.github/workflows/fix-dancadon-lethal-once.yml]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
      - name: Patch legacy lethal cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          old='const removeDead=(g:Game,onDeath?:(owner:0|1,card:Unit)=>void,depth=0)=>{g.players.forEach((p,ownerIndex)=>{const owner=ownerIndex as 0|1;p.board.filter(u=>currentHp(u,p)<=0&&hasKeyword(p,u,"Indestrutível")).forEach(u=>{u.damage=Math.max(0,(u.hp||1)+u.bonusHp+supportNumbers(p,u).hp-1);log(g,`${u.name} permaneceu em campo com 1 de vitalidade por ser Indestrutível.`,"effect")});const dead=p.board.filter(u=>currentHp(u,p)<=0);'
          new='const removeDead=(g:Game,onDeath?:(owner:0|1,card:Unit)=>void,depth=0)=>{g.players.forEach((p,ownerIndex)=>{const owner=ownerIndex as 0|1;p.board.filter(u=>currentHp(u,p)<=0&&hasKeyword(p,u,"Indestrutível")).forEach(u=>{u.damage=Math.max(0,(u.hp||1)+u.bonusHp+supportNumbers(p,u).hp-1);log(g,`${u.name} permaneceu em campo com 1 de vitalidade por ser Indestrutível.`,"effect")});p.board.filter(u=>currentHp(u,p)<=0&&hasFaction(u,"Dragão")&&!hasKeyword(p,u,"Indestrutível")).forEach(u=>{const protector=p.board.find(source=>source.page===9&&!source.suffocated&&!p.abilityUses[`dancadon-${source.uid}-${g.round}`]);if(!protector)return;const totalHp=Math.max(1,currentHp(u,p)+Number(u.damage||0));u.damage=Math.max(0,totalHp-1);p.abilityUses[`dancadon-${protector.uid}-${g.round}`]=1;log(g,`Dancadon protegeu ${u.name} do dano letal; ela permaneceu com 1 de vida.`,"effect")});const dead=p.board.filter(u=>currentHp(u,p)<=0);'
          if old not in s:
              raise SystemExit('removeDead anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify patch
        run: |
          grep -F 'dancadon-${source.uid}-${g.round}' app/page.tsx
          grep -F 'Dancadon protegeu' app/page.tsx
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'fix: apply Dancadon lethal protection in local cleanup'
          git push origin fix/cards_mechanics
