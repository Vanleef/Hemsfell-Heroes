name: P1 Deck Drag Finalize

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - scripts/p1-dnd-same-zone-fix.mjs
      - .github/workflows/p1-dnd-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply same-zone drag fix
        run: node scripts/p1-dnd-same-zone-fix.mjs
      - name: Validate focused deck builder contract
        run: node --test tests/persistent-deck-builder.test.mjs tests/user-deck-model.test.mjs tests/online-user-deck-authority.test.mjs
      - name: Validate production pipeline
        run: npm run vercel-build
      - name: Commit validated finalizer
        run: |
          rm -f scripts/p1-dnd-same-zone-fix.mjs .github/workflows/p1-dnd-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalizer changes to commit"
            exit 0
          fi
          git commit -m "fix: make same-zone deck drops idempotent"
          git push origin HEAD:feat/web-card-game-quality-foundation
