name: Field reveal metadata fix

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.title == '[bot] field reveal metadata fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch revealed metadata semantics
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'needle not found in {path}: {old[:220]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('app/page.tsx',
            '{card.revealed&&<span className="revealed-badge" title="Carta revelada: ambos os jogadores podem vê-la" aria-label="Carta revelada">◉</span>}',
            '{!unit&&card.revealed&&<span className="revealed-badge" title="Carta revelada: ambos os jogadores podem vê-la" aria-label="Carta revelada">◉</span>}')

          replace_once('app/rules-engine/engine-base.mjs',
            '          const unit = { ...card, _printedState: card._printedState ? structuredClone(card._printedState) : { name: card.name, type: card.type, cost: card.cost, atk: card.atk, hp: card.hp, text: card.text, tags: structuredClone(card.tags || []), subtypes: structuredClone(card.subtypes || []), abilities: structuredClone(card.abilities || []), page: card.page, id: card.id, image: card.image, hero: card.hero, imageCard: card.imageCard, generatedImage: card.generatedImage }, uid:',
            '          const { revealed: _revealed, revealedTo: _revealedTo, ...fieldCard } = card;\n          const unit = { ...fieldCard, _printedState: card._printedState ? structuredClone(card._printedState) : { name: card.name, type: card.type, cost: card.cost, atk: card.atk, hp: card.hp, text: card.text, tags: structuredClone(card.tags || []), subtypes: structuredClone(card.subtypes || []), abilities: structuredClone(card.abilities || []), page: card.page, id: card.id, image: card.image, hero: card.hero, imageCard: card.imageCard, generatedImage: card.generatedImage }, uid:')

          replace_once('app/rules-engine/engine-base.mjs',
            '            const unit = { ...card, uid: `${card.id}-${state.round}-searched`, enteredRound: state.round, attackedThisTurn: false, damage: 0, exhausted: false, summoning: card.type === "Criatura", modifiers: [], abilities: card.abilities || [] };',
            '            const { revealed: _revealed, revealedTo: _revealedTo, ...fieldCard } = card;\n            const unit = { ...fieldCard, uid: `${card.id}-${state.round}-searched`, enteredRound: state.round, attackedThisTurn: false, damage: 0, exhausted: false, summoning: card.type === "Criatura", modifiers: [], abilities: card.abilities || [] };')

          test=Path('tests/field-reveal-metadata.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport cards from "../app/cards.generated.json" with { type: "json" };\nimport { compileCard } from "../app/rules-engine/compiler.mjs";\nimport { executeCommand } from "../app/rules-engine/engine.mjs";\n\nconst catalog=cards.map(compileCard);\nconst printed=page=>compileCard(cards.find(card=>card.page===page));\nconst player=heroId=>({heroId,level:1,heroXP:0,markers:{},abilityUses:{},life:30,maxLife:30,energy:10,maxEnergy:10,reserve:0,deck:[],extraDeck:[],hand:[],board:[],support:[],terrain:null,grave:[],obscuro:[],turnCardsPlayed:0,turnSpellsPlayed:0});\nconst state=()=>({active:0,phase:"principal",round:3,cardCatalog:catalog,players:[player("rasmus"),player("goblin")],log:[],winner:null,selectedAttackers:[],events:0});\n\ntest("revealed terrain loses hidden-zone reveal metadata when played to field",()=>{\n const game=state();const cafe={...printed(212),revealed:true,revealedTo:[0,1]};game.players[0].hand=[cafe];\n const next=executeCommand(game,{type:"playCard",owner:0,cardId:cafe.id,slot:0}).state;\n assert.ok(next.players[0].terrain);assert.equal(next.players[0].terrain.page,212);\n assert.equal(next.players[0].terrain.revealed,undefined);assert.equal(next.players[0].terrain.revealedTo,undefined);\n});\n\ntest("revealed creature loses hidden-zone reveal metadata when played to field",()=>{\n const game=state();const creature={...printed(214),revealed:true,revealedTo:[0,1]};game.players[0].hand=[creature];\n const next=executeCommand(game,{type:"playCard",owner:0,cardId:creature.id,slot:0}).state;\n assert.ok(next.players[0].board[0]);assert.equal(next.players[0].board[0].revealed,undefined);assert.equal(next.players[0].board[0].revealedTo,undefined);\n});\n''',encoding='utf-8')

      - name: Focused regression
        run: node --test tests/field-reveal-metadata.test.mjs
      - name: Typecheck online
        run: npm run typecheck:online
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/rules-engine/engine-base.mjs tests/field-reveal-metadata.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: clear reveal metadata when cards enter field"
          git push origin HEAD:fix/cards_mechanics
