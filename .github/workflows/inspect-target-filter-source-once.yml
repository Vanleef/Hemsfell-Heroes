name: Inspect target source exclusion once
on:
  push:
    paths:
      - '.github/workflows/inspect-target-filter-source-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
      - name: Print target plumbing
        run: |
          python - <<'PY'
          from pathlib import Path
          needles=['damageAndMarkRepeat','targetStepsForEffects','anyCreature','targetSteps','validTargets','targetCandidates']
          for path in [Path('app/rules-engine/effects.mjs'),Path('app/rules-engine/engine-base.mjs'),Path('app/rules-engine/engine.mjs'),Path('app/page.tsx')]:
            lines=path.read_text(errors='ignore').splitlines()
            print('\n###',path)
            hits=[]
            for i,line in enumerate(lines):
              if any(n in line for n in needles):
                hits.append(i)
            shown=set()
            for i in hits:
              if any(abs(i-j)<8 for j in shown): continue
              shown.add(i)
              print(f'-- around {i+1} --')
              print('\n'.join(f'{j+1}: {lines[j]}' for j in range(max(0,i-5),min(len(lines),i+10))))
          PY