name: P1 User Deck Authority

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - scripts/p1-wire-authoritative-user-decks.mjs
      - .github/workflows/p1-user-deck-authority.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-user-decks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply authoritative deck migration
        run: node scripts/p1-wire-authoritative-user-decks.mjs
      - name: Validate shared model tests
        run: node --test tests/user-deck-model.test.mjs tests/online-user-deck-authority.test.mjs
      - name: Validate online typecheck
        run: npm run typecheck:online
      - name: Validate full rules suite
        run: npm run test:rules
      - name: Commit validated migration
        run: |
          rm -f scripts/p1-wire-authoritative-user-decks.mjs .github/workflows/p1-user-deck-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: make custom deck lists server-authoritative"
          git push origin HEAD:feat/web-card-game-quality-foundation
