name: Fix Tranqueira Trambuco once

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/fix-tranqueira-trambuco-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch authoritative six-card reward
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rules_path = Path('app/rules-engine/card-rules.mjs')
          rules = rules_path.read_text(encoding='utf-8')
          old_reward = 'effect("createImage", { name: "TRAMBUCO DE PIPOCO", destination: "field" })'
          new_reward = 'effect("createImage", { name: "TRAMBUCO DO PIPOCO", destination: "field", autoAttachSubtype: "Goblin", skipIfNoValidPlacement: true })'
          if rules.count(old_reward) != 1:
              raise SystemExit(f'expected one Trambuco reward, found {rules.count(old_reward)}')
          rules_path.write_text(rules.replace(old_reward, new_reward), encoding='utf-8')

          effects_path = Path('app/rules-engine/effects.mjs')
          effects = effects_path.read_text(encoding='utf-8')
          old_artifact = '''      if (base.type === "Artefato" && base.page !== 304) {
        const host = entry.board.find((unit) => unit.uid === context.attachedTo);
        if (!host) throw new RulesViolation("artifact-target-required");
        copy.attachedTo = host.uid; copy.slot = host.slot;
      } else copy.slot = context.slot != null && !entry.support.some((unit) => unit.slot === context.slot) ? context.slot : openSlot;'''
          new_artifact = '''      if (base.type === "Artefato" && base.page !== 304) {
        const requestedHost = entry.board.find((unit) => unit.uid === context.attachedTo);
        const autoHost = effect.autoAttachSubtype ? entry.board.find((unit) => hasSubtype(unit, effect.autoAttachSubtype) && !entry.support.some((support) => support.slot === unit.slot && (support.uid || support.id) !== context.sourceId)) : null;
        const host = requestedHost || autoHost;
        if (!host) { if (effect.skipIfNoValidPlacement) return; throw new RulesViolation("artifact-target-required"); }
        copy.attachedTo = host.uid; copy.slot = host.slot;
      } else copy.slot = context.slot != null && !entry.support.some((unit) => unit.slot === context.slot) ? context.slot : openSlot;'''
          if effects.count(old_artifact) != 1:
              raise SystemExit(f'expected one createImage artifact placement block, found {effects.count(old_artifact)}')
          effects_path.write_text(effects.replace(old_artifact, new_artifact), encoding='utf-8')

          test_path = Path('tests/tranqueira-six-card-reward-regression.test.mjs')
          test_path.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { compileCard } from "../app/rules-engine/compiler.mjs";\nimport { executeCommand } from "../app/rules-engine/engine.mjs";\n\nconst state = () => ({\n  active: 0, phase: "fim", round: 1, cardCatalog: [],\n  players: [0, 1].map(() => ({ life: 30, maxLife: 30, energy: 0, maxEnergy: 10, reserve: 0, deck: [], hand: [], board: [], support: [], terrain: null, grave: [], obscuro: [], extraDeck: [], abilityUses: {}, turnCardsPlayed: 0, turnSpellsPlayed: 0 })),\n});\n\ntest("Tranqueira creates the real Trambuco do Pipoco after exactly six following cards", () => {\n  const game = state();\n  const tranqueira = compileCard({ page: 46, id: "p46", name: "TRANQUEIRA-MÁTICA ELETROSTÁTICA", type: "Feitiço", cost: 1, text: "", tags: [] });\n  const trambuco = compileCard({ page: 38, id: "p38", name: "TRAMBUCO DO PIPOCO", type: "Artefato", cost: 0, text: "", tags: ["Veloz"] });\n  game.players[0].board.push({ uid: "goblin-host", id: "goblin-host", name: "Goblin", type: "Criatura", atk: 1, hp: 3, damage: 0, tags: [], subtypes: ["Goblin"], abilities: [], modifiers: [], slot: 0, exhausted: false, summoning: false, defenseUses: 0 });\n  game.players[0].support.push({ ...tranqueira, uid: "tranqueira", slot: 0, enteredRound: 1, damage: 0, exhausted: false, summoning: false, modifiers: [], cardsPlayedAfterSelf: 6, remainUntilTurnEnd: true });\n  game.players[0].extraDeck.push({ ...trambuco, imageCard: true });\n  game.cardCatalog.push({ ...trambuco, imageCard: true });\n\n  const result = executeCommand(game, { type: "advancePhase", owner: 0 }).state;\n  const generated = result.players[0].support.find((card) => card.page === 38);\n  assert.ok(generated, "the six-card reward must exist in the support zone");\n  assert.equal(generated.name, "TRAMBUCO DO PIPOCO");\n  assert.equal(generated.type, "Artefato");\n  assert.equal(generated.attachedTo, "goblin-host");\n  assert.equal(result.players[0].support.some((card) => card.page === 46), false);\n  assert.ok(result.players[0].grave.some((card) => card.page === 46));\n});\n''', encoding='utf-8')
          PY
      - name: Run Tranqueira regressions
        run: node --test tests/limo-tranqueira-regression.test.mjs tests/tranqueira-local-ui-expiry-regression.test.mjs tests/tranqueira-six-card-reward-regression.test.mjs
      - name: Commit repair to current branch
        shell: bash
        run: |
          rm .github/workflows/fix-tranqueira-trambuco-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rules-engine/card-rules.mjs app/rules-engine/effects.mjs tests/tranqueira-six-card-reward-regression.test.mjs .github/workflows/fix-tranqueira-trambuco-once.yml
          git commit -m "fix: resolve Tranqueira six-card Trambuco reward"
          git push origin HEAD:fix/cards_mechanics
