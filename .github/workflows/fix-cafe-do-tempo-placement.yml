name: Fix Cafe do Tempo placement
on:
  push:
    branches: [fix/cards_mechanics]
    paths: [.github/workflows/fix-cafe-do-tempo-placement.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/fix-cafe-do-tempo-placement.py
      - run: npm ci
      - run: node --test tests/cafe-do-tempo-placement.test.mjs tests/rasmus-authoritative.test.mjs tests/rules-engine.test.mjs
      - run: npm run vercel-build
      - name: Commit repair
        run: |
          rm .github/scripts/fix-cafe-do-tempo-placement.py .github/workflows/fix-cafe-do-tempo-placement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rules-engine/card-rules.mjs app/rules-engine/effects.mjs app/rules-engine/engine-base.mjs app/rules-engine/ai.mjs app/page.tsx tests/cafe-do-tempo-placement.test.mjs .github/scripts/fix-cafe-do-tempo-placement.py .github/workflows/fix-cafe-do-tempo-placement.yml
          git commit -m "fix: make Café do Tempo placement controller-driven"
          git push origin HEAD:fix/cards_mechanics
