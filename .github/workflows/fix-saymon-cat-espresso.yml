name: Fix Saymon cat espresso

on:
  push:
    branches: [fix/cards_mechanics]
    paths:
      - '.github/scripts/fix-saymon-cat-espresso.py'
      - 'tests/saymon-cat-espresso-turn-regression.test.mjs'
      - '.github/workflows/fix-saymon-cat-espresso.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        run: python .github/scripts/fix-saymon-cat-espresso.py
      - name: Install dependencies
        run: npm ci
      - name: Focused regressions
        run: node --test tests/saymon-cat-espresso-turn-regression.test.mjs tests/saymon-authoritative-regressions.test.mjs tests/bot-ai.test.mjs
      - name: Full Vercel build
        run: npm run vercel-build
      - name: Commit repair
        run: |
          if git diff --quiet -- app/page.tsx app/rules-engine/engine-base.mjs app/rules-engine/effects.mjs; then
            echo "No repair diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/rules-engine/engine-base.mjs app/rules-engine/effects.mjs tests/saymon-cat-espresso-turn-regression.test.mjs
          git commit -m "fix: stabilize Saymon cat return and espresso activation"
          git push origin HEAD:fix/cards_mechanics
