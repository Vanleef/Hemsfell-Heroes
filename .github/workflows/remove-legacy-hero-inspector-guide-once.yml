name: Remove legacy hero inspector guide injector

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/remove-legacy-hero-inspector-guide-once.yml

permissions:
  contents: write

jobs:
  remove-legacy-inspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0

      - name: Remove legacy hero inspector injection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/match-ui-guard.tsx')
          text = path.read_text(encoding='utf-8')

          start = text.find('function findHeroInspectorMeta(')
          end = text.find('function enhanceMatchResult()', start)
          if start < 0 or end < 0:
              raise SystemExit('legacy hero inspector block not found')

          text = text[:start] + text[end:]
          text = text.replace('      enhanceHeroInspector();\n', '')
          path.write_text(text, encoding='utf-8')

          if 'hero-inspector-guide' in text:
              raise SystemExit('hero-inspector-guide still exists in match-ui-guard.tsx')
          if 'enhanceHeroInspector' in text:
              raise SystemExit('enhanceHeroInspector still exists in match-ui-guard.tsx')
          PY

      - name: Verify canonical HeroGuide remains
        run: |
          grep -q 'function HeroGuide' app/page.tsx
          grep -q 'hero-evolution-guide' app/page.tsx
          grep -q 'hero-abilities-guide' app/page.tsx
          ! grep -q 'hero-inspector-guide' app/match-ui-guard.tsx

      - name: Remove one-shot workflow
        run: rm .github/workflows/remove-legacy-hero-inspector-guide-once.yml

      - name: Commit source cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/match-ui-guard.tsx .github/workflows/remove-legacy-hero-inspector-guide-once.yml
          git commit -m 'ui: remove legacy hero inspector guide injection'
          git push origin HEAD:fix/cards_mechanics
