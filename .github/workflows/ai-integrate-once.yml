name: Integrate advanced AI once

on:
  push:
    branches: [ai/advanced-opponent-system]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/advanced-opponent-system
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Integrate runtime with page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()

          legacy_import = 'import { aiDifficultyProfile, buildAIActionCandidates, chooseAIDecision, chooseAIHeroAbility, completeAIPlayCommand, orderAIAttackers } from "./rules-engine/ai.mjs";'
          runtime_import = 'import { chooseAdvancedAIAction, chooseAdvancedAIDecision, chooseAdvancedAIBlock, planAdvancedAIAttacks } from "./rules-engine/ai-system/runtime";'
          if runtime_import not in text:
              assert legacy_import in text, 'legacy AI import anchor missing'
              text = text.replace(legacy_import, legacy_import + '\n' + runtime_import, 1)

          old_decision = '''  const timer=window.setTimeout(()=>{const command=chooseAIDecision(game,1,difficulty);if(command)void runRulesCommand(command,1)},260);'''
          new_decision = '''  const decisionKey=`${game.round}:${game.events}:${decision.kind}`;
  const timer=window.setTimeout(()=>{void chooseAdvancedAIDecision(game,1,difficulty).then(command=>{const current=currentGameRef.current,currentDecision=current?.pendingDecision;if(!command||!current||`${current.round}:${current.events}:${currentDecision?.kind||""}`!==decisionKey)return;void runRulesCommand(command,1)})},120);'''
          assert old_decision in text, 'AI decision effect anchor missing'
          text = text.replace(old_decision, new_decision, 1)

          old_main = '''   const player=game.players[1],profile=aiDifficultyProfile(difficulty),candidates=buildAIActionCandidates(game,1,difficulty).filter(command=>player.turnCardsPlayed<profile.cardBudget||command.type!=="playCard");
   const command=candidates.find(candidate=>{try{executeCommand(structuredClone(game),candidate,{priority:true});return true}catch{return false}})??(game.phase!=="principal"?{type:"advancePhase",owner:1}:null);
   if(!command)return;
   if(command.type==="playCard"){const card=player.hand.find(item=>item.id===command.cardId);if(card){const kind:VisualFx["kind"]=card.type==="Criatura"?"summon":card.type==="Feitiço"?"spell":card.type==="Terreno"?"terrain":"artifact";showFx(kind,"AÇÃO DO OPONENTE",card.name,card)}}
   void runRulesCommand(command,1)'''
          new_main = '''   const player=game.players[1],searchKey=`${game.round}:${game.events}:${game.phase}:${player.hand.length}:${player.energy}:${player.reserve}`;
   void chooseAdvancedAIAction(game,1,difficulty).then(command=>{
    const current=currentGameRef.current,currentPlayer=current?.players?.[1],currentKey=current&&currentPlayer?`${current.round}:${current.events}:${current.phase}:${currentPlayer.hand.length}:${currentPlayer.energy}:${currentPlayer.reserve}`:"";
    if(!command||currentKey!==searchKey||current?.winner!=null||current?.pendingDecision||current?.pendingResponse)return;
    try{executeCommand(structuredClone(current),command,{priority:true})}catch{return}
    if(command.type==="playCard"){const card=currentPlayer.hand.find(item=>item.id===command.cardId);if(card){const kind:VisualFx["kind"]=card.type==="Criatura"?"summon":card.type==="Feitiço"?"spell":card.type==="Terreno"?"terrain":"artifact";showFx(kind,"AÇÃO DO OPONENTE",card.name,card)}}
    void runRulesCommand(command,1)
   })'''
          assert old_main in text, 'main-phase AI anchor missing'
          text = text.replace(old_main, new_main, 1)

          old_attack = '''   const legal=orderAIAttackers(game.players[1],difficulty) as Unit[],legalIds=new Set(legal.map(unit=>unit.uid));
   const queued=aiAttackQueue.find(uid=>legalIds.has(uid));
   if(queued){setAiAttackQueue(aiAttackQueue.filter(uid=>uid!==queued));beginAttack(1,queued);return}
   const ready=legal.map(unit=>unit.uid);
   if(ready.length){setAiAttackQueue(ready.slice(1));beginAttack(1,ready[0]);return}'''
          new_attack = '''   const legal=orderAIAttackers(game.players[1],difficulty) as Unit[],legalIds=new Set(legal.map(unit=>unit.uid));
   const planned=planAdvancedAIAttacks(game,1,difficulty).filter(uid=>legalIds.has(uid));
   const queued=aiAttackQueue.find(uid=>legalIds.has(uid)&&planned.includes(uid));
   if(queued){setAiAttackQueue(aiAttackQueue.filter(uid=>uid!==queued));beginAttack(1,queued);return}
   const ready=planned;
   if(ready.length){setAiAttackQueue(ready.slice(1));beginAttack(1,ready[0]);return}'''
          assert old_attack in text, 'combat attack planner anchor missing'
          text = text.replace(old_attack, new_attack, 1)

          old_block = '''    const safest=currentAtk(attacker,attackingPlayer)<defendingPlayer.life-5,direct=difficulty==="Fácil"?Math.random()<.45:safest&&blockers.every(unit=>currentHp(unit,defendingPlayer)<=currentAtk(attacker,attackingPlayer));if(direct){setSharedCombat({...action,targetHero:true,stage:"charging"});return}const defender=[...blockers].sort((a,b)=>currentHp(a,defendingPlayer)-currentHp(b,defendingPlayer))[0];setSharedCombat({...action,targetHero:false,defenderUid:defender.uid,defenderCard:baseCard(defender),stage:"charging"});return'''
          new_block = '''    const blockPlan=chooseAdvancedAIBlock(game,defenderOwner,attacker,difficulty);if(blockPlan.takeDamage||!blockPlan.defenderId){setSharedCombat({...action,targetHero:true,stage:"charging"});return}const defender=blockers.find(unit=>unit.uid===blockPlan.defenderId)||[...blockers].sort((a,b)=>currentHp(a,defendingPlayer)-currentHp(b,defendingPlayer))[0];setSharedCombat({...action,targetHero:false,defenderUid:defender.uid,defenderCard:baseCard(defender),stage:"charging"});return'''
          assert old_block in text, 'combat block planner anchor missing'
          text = text.replace(old_block, new_block, 1)

          old_levels = '''{["Fácil","Normal","Difícil"].map(x=><button key={x} className={difficulty===x?"active":""} onClick={()=>setDifficulty(x)}>{x}</button>)}'''
          new_levels = '''{["Fácil","Normal","Difícil","Expert","Master"].map(x=><button key={x} className={difficulty===x?"active":""} onClick={()=>setDifficulty(x)}>{x}</button>)}'''
          assert old_levels in text, 'difficulty selector anchor missing'
          text = text.replace(old_levels, new_levels, 1)

          path.write_text(text)
          PY
      - name: Run project verification
        run: npm run prepare:project && node --test tests/*.test.mjs && npx tsc --noEmit
      - name: Commit integrated runtime and remove one-shot workflow
        run: |
          rm .github/workflows/ai-integrate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/ai-integrate-once.yml
          git commit -m "feat: drive bot turns with advanced AI controller"
          git push origin HEAD:ai/advanced-opponent-system
