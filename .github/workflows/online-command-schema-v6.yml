name: Finalize online command schemas

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - .github/workflows/online-command-schema-v6.yml

permissions:
  contents: write

jobs:
  apply-validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply command schemas and update authority contract test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runner = Path('.github/workflows/online-command-schema-v4.yml').read_text().splitlines()

          def extract_after(marker):
              start = next(i for i, line in enumerate(runner) if marker in line) + 1
              out = []
              for line in runner[start:]:
                  if line.strip() == 'EOF':
                      break
                  out.append(line[10:] if line.startswith('          ') else line)
              else:
                  raise AssertionError(f'heredoc terminator missing for {marker}')
              return '\n'.join(out) + '\n'

          Path('app/api/rooms/online-command-schema.mjs').write_text(
              extract_after("cat > app/api/rooms/online-command-schema.mjs <<'EOF'")
          )
          Path('app/api/rooms/online-command-schema.d.mts').write_text(
              extract_after("cat > app/api/rooms/online-command-schema.d.mts <<'EOF'")
          )
          Path('tests/online-command-schema.test.mjs').write_text(
              extract_after("cat > tests/online-command-schema.test.mjs <<'EOF'")
          )

          schema_test = Path('tests/online-command-schema.test.mjs')
          schema_test_text = schema_test.read_text()
          authority_anchor = '              __priorityPayment: { cost: 0 },\n'
          assert authority_anchor in schema_test_text
          schema_test_text = schema_test_text.replace(
              authority_anchor,
              authority_anchor + '              __futureAuthority: "blocked",\n',
              1,
          )
          stripped_anchor = '            for (const field of STRIPPED_AUTHORITY_FIELDS) assert.equal(Object.hasOwn(result.command, field), false, field);\n'
          assert stripped_anchor in schema_test_text
          schema_test_text = schema_test_text.replace(
              stripped_anchor,
              stripped_anchor + '            assert.equal(Object.hasOwn(result.command, "__futureAuthority"), false, "arbitrary __ fields are not trusted");\n',
              1,
          )
          schema_test.write_text(schema_test_text)

          machine = Path('app/api/rooms/machine.ts')
          text = machine.read_text()
          import_anchor = 'import { logOnlineDiagnostic } from "./online-diagnostics.mjs";\n'
          if 'online-command-schema.mjs' not in text:
              assert import_anchor in text
              text = text.replace(
                  import_anchor,
                  import_anchor + 'import { parseOnlineCommand } from "./online-command-schema.mjs";\n',
                  1,
              )

          start_marker = '  if (!AUTHORITATIVE_COMMANDS.has(String(rawCommand.type || ""))) {'
          end_marker = '    const command: Record<string, any> = { ...rawCommand, owner };\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''  const parsedCommand = parseOnlineCommand(rawCommand);
          if (!parsedCommand.ok) {
            logOnlineDiagnostic(room, "command-rejected", { role, commandType: String(rawCommand.type || ""), reason: parsedCommand.error, baseRevision });
            return { ok: false, status: 400, error: parsedCommand.error, code: parsedCommand.code };
          }
          if (!AUTHORITATIVE_COMMANDS.has(parsedCommand.command.type)) {
            logOnlineDiagnostic(room, "command-rejected", { role, commandType: parsedCommand.command.type, reason: "unsupported command", baseRevision });
            return { ok: false, status: 400, error: "unsupported command", code: "UNSUPPORTED_RULES_COMMAND" };
          }
          const owner = role === "host" ? 0 : 1;
          try {
            /* Authentication owns the player index. The schema allow-list also
               drops browser attempts to inject priority/payment/internal state. */
            const command: Record<string, any> = { ...parsedCommand.command, owner };
          '''
          text = text[:start] + replacement + text[end:]

          old_catch = '    return { ok: false, status: 400, error: message };\n'
          assert old_catch in text
          text = text.replace(
              old_catch,
              '    return { ok: false, status: 400, error: message, code: "RULES_COMMAND_REJECTED" };\n',
              1,
          )
          machine.write_text(text)

          route = Path('app/api/rooms/[id]/route.ts')
          text = route.read_text()
          old_route = '      if (!resolution.ok) return NextResponse.json({ error: resolution.error, ...roomView(room, true, role) }, { status: resolution.status, ...noStore });\n'
          assert old_route in text
          text = text.replace(
              old_route,
              '      if (!resolution.ok) return NextResponse.json({ error: resolution.error, code: resolution.code ?? (resolution.status === 400 ? "INVALID_RULES_COMMAND" : "RULES_COMMAND_REJECTED"), ...roomView(room, true, role) }, { status: resolution.status, ...noStore });\n',
              1,
          )
          route.write_text(text)

          audit = Path('tests/online-authoritative-audit.test.mjs')
          audit_text = audit.read_text()
          old_audit = r'  assert.match(machine, /const command: Record<string, any> = \{ \.\.\.rawCommand, owner \}/);' + '\n'
          new_audit = (
              r'  assert.match(machine, /const parsedCommand = parseOnlineCommand\(rawCommand\)/);' + '\n'
              + r'  assert.match(machine, /const command: Record<string, any> = \{ \.\.\.parsedCommand\.command, owner \}/);' + '\n'
              + r'  assert.doesNotMatch(machine, /const command: Record<string, any> = \{ \.\.\.rawCommand, owner \}/);' + '\n'
          )
          assert old_audit in audit_text, 'legacy raw-command authority assertion changed'
          audit.write_text(audit_text.replace(old_audit, new_audit, 1))
          PY

      - name: Remove temporary schema workflows and stage only the validated schema diff
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/online-command-schema-v4.yml \
            .github/workflows/online-command-schema-v5.yml \
            .github/workflows/online-command-schema-v6.yml \
            .github/workflows/online-command-schema-diagnostic.yml
          git add -- \
            'app/api/rooms/[id]/route.ts' \
            app/api/rooms/machine.ts \
            app/api/rooms/online-command-schema.mjs \
            app/api/rooms/online-command-schema.d.mts \
            tests/online-command-schema.test.mjs \
            tests/online-authoritative-audit.test.mjs
          expected_files=$(printf '%s\n' \
            '.github/workflows/online-command-schema-diagnostic.yml' \
            '.github/workflows/online-command-schema-v4.yml' \
            '.github/workflows/online-command-schema-v5.yml' \
            '.github/workflows/online-command-schema-v6.yml' \
            'app/api/rooms/[id]/route.ts' \
            'app/api/rooms/machine.ts' \
            'app/api/rooms/online-command-schema.d.mts' \
            'app/api/rooms/online-command-schema.mjs' \
            'tests/online-authoritative-audit.test.mjs' \
            'tests/online-command-schema.test.mjs' | sort)
          actual_files=$(git diff --cached --name-only | sort)
          test "$actual_files" = "$expected_files"
          git diff --cached --check
          git status --short
          git diff --cached --stat

      - name: Focused command schema tests
        run: node --test tests/online-command-schema.test.mjs tests/online-match-runtime.test.mjs tests/online-maintenance-choice.test.mjs

      - name: Online typecheck
        run: npm run typecheck:online

      - name: AI typecheck
        run: npm run typecheck:ai

      - name: Full rules suite
        run: npm run test:rules

      - name: AI strategic benchmark
        run: npm run ai:calibrate:benchmark

      - name: Build Next.js application
        run: npm run vercel-build

      - name: Verify tests left no unstaged product changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --check

      - name: Commit validated schema hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: validate authoritative online commands"
          git push origin HEAD:feat/web-card-game-quality-foundation
