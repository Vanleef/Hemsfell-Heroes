name: Refactor client priority flow

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify requested base has not moved
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only 5cd8a6cd1cccc455031972810e4c71479c1cf06d..HEAD | grep -v '^.github/workflows/client-decomposition-priority.yml$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Apply reviewed client decomposition patch
        shell: bash
        run: |
          set -euo pipefail
          git show ff6d313972b6da13437df9e75ef7125dcff1832a:.github/workflows/client-decomposition-priority.yml > /tmp/original.yml
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/original.yml').read_text().splitlines()
          start=lines.index('      - name: Extract client priority and combat presentation')
          run_index=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')+1
          end=next(i for i in range(run_index,len(lines)) if lines[i].startswith('      - name: Validate focused priority behavior'))
          Path('/tmp/apply.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines[run_index:end])+'\n')
          PY
          bash /tmp/apply.sh
      - name: Validate focused priority behavior
        run: node --test tests/client-priority-control.test.mjs
      - name: Validate full application gates
        run: npm run vercel-build
      - name: Inspect final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git status --short
      - name: Commit validated refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/client-decomposition-priority.yml
          git add -- app/page.tsx app/match/priority-control-policy.mjs app/match/use-priority-control.ts app/match/priority-ui.tsx app/match/combat-animation.tsx tests/client-priority-control.test.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor: isolate client priority flow and mode switching"
          git push origin HEAD:feat/web-card-game-quality-foundation
