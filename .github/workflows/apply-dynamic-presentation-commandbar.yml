name: Apply dynamic presentation and command bar fit

on:
  push:
    branches:
      - feat/presentation-system-pr1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply source patch
        run: python3 scripts/tmp-apply-dynamic-presentation-commandbar.py
      - name: Update lifecycle regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/presentation-dedupe-regression.test.mjs')
          text = path.read_text()
          old = '''  assert.match(runtime, /const completion = Promise\\.all\\(labels\\)/);\n  assert.match(runtime, /if \\(settle\\) await completion/);'''
          new = '''  assert.match(runtime, /await Promise\\.all\\(labels\\.map\\(\\(label\\) => label\\.readable\\)\\)/);\n  assert.match(runtime, /completion: Promise\\.all\\(labels\\.map\\(\\(label\\) => label\\.finished\\)\\)/);\n  assert.match(runtime, /await deltaCompletion/);'''
          if old not in text:
              raise AssertionError('presentation lifecycle assertion anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary tooling
        run: |
          git rm .github/workflows/apply-dynamic-presentation-commandbar.yml
          git rm scripts/tmp-apply-dynamic-presentation-commandbar.py
      - name: Install dependencies
        run: npm ci
      - name: Validate canonical state
        run: npm run prepare:project
      - name: Focused presentation tests
        run: node --test tests/combat-animation-flow.test.mjs tests/presentation-dedupe-regression.test.mjs tests/presentation-final-contract.test.mjs
      - name: Full rules suite
        run: npm run test:rules
      - name: Production build
        run: npm run vercel-build
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: release presentation dynamically and autofit command bar"
          git push origin HEAD:feat/presentation-system-pr1
