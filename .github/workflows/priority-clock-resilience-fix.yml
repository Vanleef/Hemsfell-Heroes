name: Priority clock resilience fix

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.title == '[bot] priority clock resilience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch authoritative server clock and UI gating
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{label}: needle not found in {path}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # machine.ts: one server clock, safe response repair/autopass.
          p=Path('app/api/rooms/machine.ts'); text=p.read_text(encoding='utf-8')
          text=text.replace('import { reconcileOnlineClocks } from "./online-clock.mjs";', 'import { ensureResponseClock, reconcileOnlineClocks } from "./online-clock.mjs";\nimport { serverNowMs } from "./time.mjs";', 1)
          text=text.replace('export function deadline(seconds: number) {\n  return Date.now() + seconds * 1000;\n}', 'export function deadline(seconds: number) {\n  return serverNowMs() + seconds * 1000;\n}', 1)
          text=text.replace('export function reconnectPause(room: Room, now = Date.now())', 'export function reconnectPause(room: Room, now = serverNowMs())', 1)
          text=text.replace('const now = Date.now();', 'const now = serverNowMs();')

          old_seed='''  let seededDeadline = false;\n  if (room.game.pendingResponse && !Number.isFinite(Number(room.game.pendingResponse.deadline))) {\n    room.game.pendingResponse.deadline = now + room.settings.responseSeconds * 1000;\n    if (room.game.priority) room.game.priority.deadline = room.game.pendingResponse.deadline;\n    seededDeadline = true;\n  }'''
          new_seed='''  let seededDeadline = false;\n  let responseClock: ReturnType<typeof ensureResponseClock> | null = null;\n  if (room.game.pendingResponse) {\n    responseClock = ensureResponseClock(room.game, room.settings, now);\n    seededDeadline = !!responseClock.changed;\n    if (responseClock.changed && responseClock.driftLevel !== "ok") {\n      logOnlineDiagnostic(room, "priority-clock-recovered", {\n        role: room.game.pendingResponse.responder === 0 ? "host" : "guest",\n        driftLevel: responseClock.driftLevel,\n        timerMode: responseClock.timerMode,\n      });\n    }\n  }'''
          if old_seed not in text: raise SystemExit('machine pendingResponse seed block not found')
          text=text.replace(old_seed,new_seed,1)
          text=text.replace('if (room.game.combatAction?.stage === "choosing" && !Number.isFinite(Number(room.game.combatAction.deadline))) {', 'if (room.game.combatAction?.stage === "choosing" && (!Number.isFinite(Number(room.game.combatAction.deadline)) || Number(room.game.combatAction.deadline) <= 0)) {',1)
          old_response='''  if (room.game.pendingResponse) {\n    if (room.game.pendingResponse.deadline > now) return seededDeadline;\n    const before = room.game;'''
          new_response='''  if (room.game.pendingResponse) {\n    if (responseClock?.timerMode === "action_only") {\n      if (!responseClock.wallExpired) return seededDeadline;\n      logOnlineDiagnostic(room, "priority_fallback_wall_timeout", {\n        role: room.game.pendingResponse.responder === 0 ? "host" : "guest",\n        commandType: "passPriority",\n        auto: true,\n      });\n    } else if (!responseClock?.expired) return seededDeadline;\n    const before = room.game;'''
          if old_response not in text: raise SystemExit('machine response timeout block not found')
          text=text.replace(old_response,new_response,1)
          # A null/zero turn clock outside an interaction is a legacy/stale clock,
          # not an instruction to display 0:00 forever.
          marker='''  /* Interactive target/effect decisions intentionally pause the action clock.\n     They are never allowed to fall through to a phase timeout underneath the\n     decision that owns input. */\n  if (room.game.pendingDecision || room.game.pendingReposition) return seededDeadline;\n\n'''
          replacement=marker+'''  if (!Number.isFinite(Number(room.game.turnDeadline)) || Number(room.game.turnDeadline) <= 0) {\n    room.game.turnDeadline = deadline(room.settings.turnSeconds);\n    seededDeadline = true;\n  }\n\n'''
          if marker not in text: raise SystemExit('machine decision marker not found')
          text=text.replace(marker,replacement,1)
          p.write_text(text,encoding='utf-8')

          # store.ts: every room snapshot carries a server-time display reference.
          p=Path('app/api/rooms/store.ts'); text=p.read_text(encoding='utf-8')
          if 'import { serverNowMs } from "./time.mjs";' not in text:
              text=text.replace('import { onlineCombatInteractionView } from "../../rules-engine/online-combat.mjs";', 'import { onlineCombatInteractionView } from "../../rules-engine/online-combat.mjs";\nimport { serverNowMs } from "./time.mjs";',1)
          old='createdAt: room.createdAt, revision: room.revision, ...(includeGame ?'
          new='createdAt: room.createdAt, revision: room.revision, serverNowMs: serverNowMs(), ...(includeGame ?'
          if old not in text: raise SystemExit('roomView insertion point not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # page.tsx: display safe clocks, lock in-flight commands, never make a
          # client wall clock authoritative for priority expiration.
          p=Path('app/page.tsx'); text=p.read_text(encoding='utf-8')
          text=text.replace('type PendingResponse={responder:0|1;actor:0|1;action:string;deadline?:number;passes?:number};', 'type PendingResponse={responder:0|1;actor:0|1;action:string;openedAt?:number|null;deadline?:number|null;wallDeadline?:number|null;timerMode?:"normal"|"action_only"|null;driftLevel?:string|null;passes?:number};',1)
          text=text.replace('const syncQueueRef=useRef<Promise<void>>(Promise.resolve());\nconst currentGameRef', 'const syncQueueRef=useRef<Promise<void>>(Promise.resolve());\nconst commandPendingRef=useRef(false);\nconst [onlineCommandPending,setOnlineCommandPending]=useState(false);\nconst serverClockSkewRef=useRef(0);\nconst currentGameRef',1)
          old_apply='const applyRoomSnapshot=(data:any)=>{setRoomInfo(data);roomRevisionRef.current=data.revision??roomRevisionRef.current;if(data.game){'
          new_apply='const applyRoomSnapshot=(data:any)=>{if(Number.isFinite(Number(data?.serverNowMs))&&Number(data.serverNowMs)>0)serverClockSkewRef.current=Number(data.serverNowMs)-Date.now();setRoomInfo(data);roomRevisionRef.current=data.revision??roomRevisionRef.current;if(data.game){'
          if old_apply not in text: raise SystemExit('applyRoomSnapshot not found')
          text=text.replace(old_apply,new_apply,1)

          timeout_effect='useEffect(()=>{if(mode!=="online"||!roomId||!roomToken||!game)return;const deadline=game.pendingResponse?.deadline??game.turnDeadline;if(!deadline||deadline>clockNow)return;const key=`${game.round}-${game.pendingResponse?.action??"turn"}-${deadline}`;if(timeoutSentRef.current===key)return;timeoutSentRef.current=key;roomAction("timeout")},[clockNow,mode,roomId,roomToken,game?.pendingResponse?.deadline,game?.turnDeadline]);\n'
          if timeout_effect in text: text=text.replace(timeout_effect,'',1)
          else: raise SystemExit('client timeout effect not found')

          text=text.replace('const timed=response?{...response,deadline:response.deadline??Date.now()+(roomInfo?.settings?.responseSeconds??30)*1000}:null;', 'const timed=response?{...response,...(mode==="online"?{}:{deadline:response.deadline??Date.now()+(roomInfo?.settings?.responseSeconds??30)*1000})}:null;',1)
          text=text.replace('g.pendingResponse=asResponse?null:{responder:owner===0?1:0,actor:owner,action:c.name,passes:0,deadline:Date.now()+(roomInfo?.settings?.responseSeconds??30)*1000};', 'g.pendingResponse=asResponse?null:{responder:owner===0?1:0,actor:owner,action:c.name,passes:0};',1)

          old_run='const runRulesCommand=async(command:Record<string,unknown>,owner:0|1=0):Promise<boolean>=>{try{if(mode==="online"){const commandId=crypto.randomUUID();const result=await roomAction("command",{command,commandId,baseRevision:roomRevisionRef.current});return !!result}const current=currentGameRef.current;if(!current)return false;const next=executeCommand(current,{...command,owner},{priority:true}).state as Game;syncDynamicFieldCounts(next);currentGameRef.current=next;setGame(next);setResponseWindow(next.pendingResponse??null);return true}catch(error){setRoomError(error instanceof Error?`A regra recusou a ação: ${error.message}`:"A regra recusou a ação.");return false}};'
          new_run='const runRulesCommand=async(command:Record<string,unknown>,owner:0|1=0):Promise<boolean>=>{try{if(mode==="online"){if(commandPendingRef.current)return false;commandPendingRef.current=true;setOnlineCommandPending(true);try{const commandId=crypto.randomUUID();const result=await roomAction("command",{command,commandId,baseRevision:roomRevisionRef.current});return !!result}finally{commandPendingRef.current=false;setOnlineCommandPending(false)}}const current=currentGameRef.current;if(!current)return false;const next=executeCommand(current,{...command,owner},{priority:true}).state as Game;syncDynamicFieldCounts(next);currentGameRef.current=next;setGame(next);setResponseWindow(next.pendingResponse??null);return true}catch(error){setRoomError(error instanceof Error?`A regra recusou a ação: ${error.message}`:"A regra recusou a ação.");return false}};'
          if old_run not in text: raise SystemExit('runRulesCommand not found')
          text=text.replace(old_run,new_run,1)

          old_clocks=''' const priorityLocked=(mode==="online"&&game?.pendingResponse?.actor===0)||opponentReconnecting;\n const responseRemaining=Math.max(0,Math.ceil(((game?.pendingResponse?.deadline??clockNow)-clockNow)/1000));\n const turnRemaining=Math.max(0,Math.ceil(((game?.turnDeadline??clockNow)-clockNow)/1000));\n const formatClock=(seconds:number)=>`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,"0")}`;'''
          new_clocks=''' const serverDisplayNow=clockNow+serverClockSkewRef.current;\n const validDeadline=(value:unknown)=>Number.isFinite(Number(value))&&Number(value)>0;\n const localPriorityOwner=game?.pendingDecision?.owner??game?.pendingResponse?.responder??(game?.combatAction?.stage==="choosing"?(1-game.combatAction.attackerOwner) as 0|1:game?.active);\n const priorityLocked=(mode==="online"&&(localPriorityOwner!==0||onlineCommandPending))||opponentReconnecting;\n const responseTimerMode=game?.pendingResponse?.timerMode??((game as any)?.priority?.timerMode as string|undefined)??"normal";\n const responseRemaining:number|null=validDeadline(game?.pendingResponse?.deadline)?Math.max(0,Math.ceil((Number(game?.pendingResponse?.deadline)-serverDisplayNow)/1000)):null;\n const turnRemaining:number|null=validDeadline(game?.turnDeadline)?Math.max(0,Math.ceil((Number(game?.turnDeadline)-serverDisplayNow)/1000)):null;\n const formatClock=(seconds:number)=>`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,"0")}`;'''
          if old_clocks not in text: raise SystemExit('clock calculation block not found')
          text=text.replace(old_clocks,new_clocks,1)

          old_match='{mode==="online"&&<div className={`match-clock ${turnRemaining<=15?"urgent":""}`}><span>TURNO</span><b>{formatClock(turnRemaining)}</b></div>}'
          new_match='{mode==="online"&&<div className={`match-clock ${((game.pendingResponse?responseRemaining:turnRemaining)??999)>15?"":"urgent"}`}><span>{game.pendingResponse?"RESPOSTA":"TURNO"}</span><b>{game.pendingResponse?(responseTimerMode==="action_only"?"MANUAL":responseRemaining===null?"…":formatClock(responseRemaining)):turnRemaining===null?"…":formatClock(turnRemaining)}</b></div>}'
          if old_match not in text: raise SystemExit('match-clock render not found')
          text=text.replace(old_match,new_match,1)

          start=text.find('function ResponseModal('); end=text.find('\nfunction MulliganModal(',start)
          if start<0 or end<0: raise SystemExit('ResponseModal boundaries not found')
          response_modal='''function ResponseModal({action,available,heroAbilities,budget,offTurn,seconds,timerMode="normal",passes=0,busy=false,onPlay,onHeroAbility,onPass}:{action:string;available:Array<{card:CardDef;index:number;cost:number}>;heroAbilities:Array<{abilityId:string;label:string}>;budget:number;offTurn:boolean;seconds:number|null;timerMode?:string;passes?:number;busy?:boolean;onPlay:(idx:number)=>void;onHeroAbility:(abilityId:string)=>void;onPass:()=>void}){\n const hasResponses=available.length>0||heroAbilities.length>0;\n const clockLabel=timerMode==="action_only"?"⏱ MANUAL":seconds===null?"⏱ SINCRONIZANDO":`⏱ ${seconds}s`;\n return <div className="overlay response-overlay"><section className="response-dialog" role="dialog" aria-modal="true" aria-labelledby="response-title"><header><span>JANELA DE RESPOSTA</span><b className={seconds!==null&&seconds<=5?"urgent":""}>{clockLabel}</b><b>{offTurn?"Reserva":"Energia"} · {budget}</b></header><h2 id="response-title">Sua prioridade</h2><div className="priority-status"><b>{passes===0?"Primeiro passe":"Segundo passe"}</b><span>{passes===0?"A prioridade voltará ao jogador da ação.":"A ação será encerrada após este passe."}</span></div><p>O oponente realizou: <strong>{action}</strong>. Use um Feitiço Acelerado, uma habilidade ativa disponível do seu Herói ou passe.</p>{available.length?<div className="response-cards">{available.map(({card,index,cost})=><div key={`${card.id}-${index}`}><OriginalCard card={card} small inspectable={false} disabled={busy} activeEffect="RESPOSTA ACELERADA" onClick={()=>{if(!busy)onPlay(index)}}/><b>{card.name}</b><small>Responder · custo {cost}</small></div>)}</div>:null}{heroAbilities.length?<div className="response-hero-abilities">{heroAbilities.map(ability=><button key={ability.abilityId} disabled={busy} onClick={()=>{if(!busy)onHeroAbility(ability.abilityId)}}><i>⚡</i><span><b>{ability.label}</b><small>Habilidade ativa do Herói</small></span></button>)}</div>:null}{!hasResponses?<div className="no-response-card"><i>◇</i><b>Nenhuma resposta utilizável</b><span>Não há Feitiço Acelerado nem habilidade ativa de Herói legal neste momento. Passe para devolver a prioridade.</span></div>:null}<footer><button className="pass-response" disabled={busy} onClick={()=>{if(!busy)onPass()}}>{busy?"Enviando…":"Passar prioridade"}</button></footer></section></div>\n}\n'''
          text=text[:start]+response_modal+text[end:]

          old_call='<ResponseModal action={responseWindow.action} available={usableAcceleratedResponses(game,0)} heroAbilities={heroPriorityResponses(game,0)} budget={responseBudget(game,0)} offTurn={game.active!==0} seconds={responseRemaining} passes={responseWindow.passes??0} onPlay={chooseResponse} onHeroAbility={chooseHeroResponse} onPass={declineResponse}/>'
          new_call='<ResponseModal action={responseWindow.action} available={usableAcceleratedResponses(game,0)} heroAbilities={heroPriorityResponses(game,0)} budget={responseBudget(game,0)} offTurn={game.active!==0} seconds={responseRemaining} timerMode={responseTimerMode} passes={responseWindow.passes??0} busy={onlineCommandPending} onPlay={chooseResponse} onHeroAbility={chooseHeroResponse} onPass={declineResponse}/>'
          if old_call not in text: raise SystemExit('ResponseModal caller not found')
          text=text.replace(old_call,new_call,1)
          old_wait='{game.pendingResponse?.responder===1&&<div className="response-waiting"><i></i>{mode==="online"?<>Aguardando resposta do oponente <b>{responseRemaining}s</b></>:"A IA está avaliando a prioridade…"}</div>}'
          new_wait='{game.pendingResponse?.responder===1&&<div className="response-waiting"><i></i>{mode==="online"?<>Aguardando resposta do oponente <b>{responseTimerMode==="action_only"?"manual":responseRemaining===null?"…":`${responseRemaining}s`}</b></>:"A IA está avaliando a prioridade…"}</div>}'
          if old_wait not in text: raise SystemExit('response waiting render not found')
          text=text.replace(old_wait,new_wait,1)
          p.write_text(text,encoding='utf-8')

          # Focused static contract guards: prevent future reintroduction of
          # client timeout authority and 0:00-by-null rendering.
          Path('tests/online-priority-ui-static.test.mjs').write_text(r'''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { readFile } from "node:fs/promises";\n\nconst page=await readFile(new URL("../app/page.tsx",import.meta.url),"utf8");\nconst machine=await readFile(new URL("../app/api/rooms/machine.ts",import.meta.url),"utf8");\nconst store=await readFile(new URL("../app/api/rooms/store.ts",import.meta.url),"utf8");\n\ntest("online UI never turns a missing deadline into a fake zero clock",()=>{\n assert.doesNotMatch(page,/pendingResponse\?\.deadline\?\?clockNow/);\n assert.doesNotMatch(page,/turnDeadline\?\?clockNow/);\n assert.match(page,/responseRemaining:number\|null/);\n assert.match(page,/turnRemaining:number\|null/);\n assert.match(page,/SINCRONIZANDO/);\n});\n\ntest("client wall clock never dispatches authoritative timeout",()=>{\n assert.doesNotMatch(page,/roomAction\(["']timeout["']\)/);\n assert.match(page,/serverClockSkewRef/);\n});\n\ntest("online priority input is owned by responder and command is locked in flight",()=>{\n assert.match(page,/localPriorityOwner/);\n assert.match(page,/commandPendingRef/);\n assert.match(page,/onlineCommandPending/);\n});\n\ntest("room machine owns time and room snapshots expose server time only for display",()=>{\n assert.match(machine,/serverNowMs/);\n assert.match(machine,/ensureResponseClock/);\n assert.match(machine,/priority_fallback_wall_timeout/);\n assert.match(store,/serverNowMs: serverNowMs\(\)/);\n});\n''',encoding='utf-8')
      - name: Focused priority regressions
        run: node --test tests/priority-clock-resilience.test.mjs tests/online-clock.test.mjs tests/online-clock-authority.test.mjs tests/online-priority-flow.test.mjs tests/online-priority-decision-suspension.test.mjs tests/online-two-perspective-flow.test.mjs tests/online-authoritative-audit.test.mjs tests/online-priority-ui-static.test.mjs
      - name: Online typecheck
        run: npm run typecheck:online
      - name: Rules suite
        run: npm run test:rules
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/rooms/machine.ts app/api/rooms/store.ts app/page.tsx tests/online-priority-ui-static.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(multiplayer): harden authoritative priority timers"
          git push origin HEAD:fix/cards_mechanics
