name: Fix Draconic Illusion space guard
on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/fix-draconic-illusion-space.yml
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
      - name: Apply canonical space guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          rules = Path('app/rules-engine/card-rules.mjs')
          s = rules.read_text()
          replacements = {
            '  p12: [ability("onPlay", [effect("createImage", { name: "Dragão Filhote", destination: "field" })])],':
            '  p12: [ability("onPlay", [effect("createImage", { name: "Dragão Filhote", destination: "field" })], [], { playCondition: { controllerCreatureSlotAvailable: true } })],',
            '  p13: [ability("onPlay", [effect("replaceImage", { oldName: "Dragão Filhote", newName: "Dragão Jovem" })])],':
            '  p13: [ability("onPlay", [effect("replaceImage", { oldName: "Dragão Filhote", newName: "Dragão Jovem" })], [], { playCondition: { controllerCreatureSlotAvailable: true } })],',
            '  p14: [ability("onPlay", [effect("replaceImage", { oldName: "Dragão Jovem", newName: "Dragão Ancião" })])],':
            '  p14: [ability("onPlay", [effect("replaceImage", { oldName: "Dragão Jovem", newName: "Dragão Ancião" })], [], { playCondition: { controllerCreatureSlotAvailable: true } })],',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'card rule anchor not found: {old[:30]}')
              s = s.replace(old,new,1)
          rules.write_text(s)

          engine = Path('app/rules-engine/engine-base.mjs')
          s = engine.read_text()
          anchor = '  if (condition.anyCreatureInPlay && !state.players.some((entry) => entry.board.length > 0)) return false;\n'
          addition = '  if (condition.controllerCreatureSlotAvailable && (state.players[owner].board || []).length >= 5) return false;\n'
          if addition not in s:
              if anchor not in s: raise SystemExit('playCondition anchor not found')
              s = s.replace(anchor, anchor + addition, 1)
          engine.write_text(s)

          page = Path('app/page.tsx')
          s = page.read_text()
          old = 'const cardPlayRequirementMet=(c:CardDef,p:Player,g?:Game,owner:0|1=0)=>c.page===17?!!g&&p.board.some(card=>hasFaction(card,"Dragão")&&!card.exhausted&&!card.stunned)&&g.players[1-owner].board.length>0:c.page!==48||p.grave.some(card=>hasFaction(card,"Goblin"));'
          new = 'const cardPlayRequirementMet=(c:CardDef,p:Player,g?:Game,owner:0|1=0)=>[12,13,14].includes(c.page)?p.board.length<5:c.page===17?!!g&&p.board.some(card=>hasFaction(card,"Dragão")&&!card.exhausted&&!card.stunned)&&g.players[1-owner].board.length>0:c.page!==48||p.grave.some(card=>hasFaction(card,"Goblin"));'
          if old not in s: raise SystemExit('cardPlayRequirementMet anchor not found')
          page.write_text(s.replace(old,new,1))

          cards = Path('app/cards.generated.json')
          data = json.loads(cards.read_text())
          changed = False
          for card in data:
              if int(card.get('page',0)) in (12,13,14) and card.get('type') != 'Feitiço':
                  card['type'] = 'Feitiço'
                  changed = True
          if changed:
              cards.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Add regression
        shell: bash
        run: |
          cat > tests/draconic-illusion-space-regression.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import cards from "../app/cards.generated.json" with { type: "json" };
          import { compileCard } from "../app/rules-engine/compiler.mjs";
          import { executeCommand } from "../app/rules-engine/engine.mjs";

          const byPage=(page)=>compileCard(cards.find(card=>Number(card.page)===page));
          const creature=(n)=>({...compileCard({page:800+n,id:`c${n}`,name:`Criatura ${n}`,type:"Criatura",cost:0,atk:1,hp:1,text:"",tags:[],subtypes:[]}),uid:`u${n}`,slot:n,damage:0,exhausted:false,summoning:false,modifiers:[]});
          const state=()=>({active:0,phase:"principal",round:1,players:[0,1].map((_,i)=>({heroId:i?"goblin":"gimble",level:1,life:30,maxLife:30,energy:20,maxEnergy:20,reserve:0,deck:[],extraDeck:[byPage(23),byPage(24),byPage(25)].filter(Boolean),hand:[],board:[],support:[],terrain:null,grave:[],obscuro:[],cardsPlayed:0,turnCardsPlayed:0,turnSpellsPlayed:0,spellsPlayed:0,abilityUses:{}})),rulesEvents:[],pendingDecision:null,pendingResponse:null,combatAction:null});

          for (const page of [12,13,14]) test(`Ilusão Dracônica p${page} não pode ser jogada sem espaço de criatura`,()=>{
            const g=state(); g.players[0].board=[0,1,2,3,4].map(creature); g.players[0].hand=[{...byPage(page),id:`illusion-${page}`}];
            assert.throws(()=>executeCommand(g,{type:"playCard",owner:0,cardId:`illusion-${page}`,skipPriority:true}),/play-condition-not-met/);
          });
          EOF
          node --test tests/draconic-illusion-space-regression.test.mjs
      - name: Verify
        shell: bash
        run: |
          grep -F 'controllerCreatureSlotAvailable: true' app/rules-engine/card-rules.mjs
          grep -F 'controllerCreatureSlotAvailable && (state.players[owner].board || []).length >= 5' app/rules-engine/engine-base.mjs
          grep -F '[12,13,14].includes(c.page)?p.board.length<5' app/page.tsx
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/rules-engine/card-rules.mjs app/rules-engine/engine-base.mjs app/page.tsx app/cards.generated.json tests/draconic-illusion-space-regression.test.mjs
          git commit -m 'fix: block Draconic Illusions when creature field is full'
          git push origin fix/cards_mechanics
