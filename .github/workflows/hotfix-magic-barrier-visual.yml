name: One-shot blue Magic Barrier visual

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/hotfix-magic-barrier-visual.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0

      - name: Add responsive blue shield visual
        shell: python
        run: |
          from pathlib import Path

          globals_path = Path('app/globals.css')
          source = globals_path.read_text(encoding='utf-8')
          anchor = '@import "./ui-overrides.css";\n'
          new_import = '@import "./magic-barrier.css";\n'
          if new_import not in source:
              if source.count(anchor) != 1:
                  raise SystemExit('ui-overrides import anchor not found exactly once')
              source = source.replace(anchor, anchor + new_import, 1)
              globals_path.write_text(source, encoding='utf-8')

          Path('app/magic-barrier.css').write_text(r'''/*
           * Magic Barrier — battlefield protection shell
           * Purely presentational: authoritative targeting rules remain in the engine.
           * The silhouette is intentionally shield-like and blue, while card geometry stays untouched.
           */
          .screen-game .card-frame:has(> .original-card.has-magic-barrier) {
            isolation: isolate;
          }

          .screen-game .card-frame:has(> .original-card.has-magic-barrier)::before {
            content: "";
            position: absolute;
            inset: calc(clamp(.09rem,.18cqw,.17rem) * -1);
            z-index: 7;
            pointer-events: none;
            border: clamp(.075rem,.12cqw,.12rem) solid rgb(100 205 255 / .88);
            border-radius: 18% 18% 29% 29% / 13% 13% 34% 34%;
            background:
              radial-gradient(ellipse at 50% 8%, rgb(210 245 255 / .28), transparent 34%),
              linear-gradient(145deg, rgb(65 170 255 / .16), rgb(20 82 205 / .07) 48%, rgb(95 220 255 / .18));
            box-shadow:
              inset 0 0 clamp(.22rem,.5cqw,.48rem) rgb(150 230 255 / .34),
              0 0 clamp(.2rem,.45cqw,.42rem) rgb(38 157 255 / .72),
              0 0 clamp(.55rem,1.15cqw,1.05rem) rgb(28 105 255 / .42);
            backdrop-filter: saturate(1.12) brightness(1.05);
            animation: hh-magic-barrier-pulse 1.85s ease-in-out infinite;
          }

          .screen-game .card-frame:has(> .original-card.has-magic-barrier)::after {
            content: "◇";
            position: absolute;
            left: 50%;
            top: calc(clamp(.18rem,.36cqw,.34rem) * -1);
            z-index: 8;
            width: clamp(.72rem,1.28cqw,1.12rem);
            aspect-ratio: 1;
            transform: translate(-50%,-45%) rotate(45deg);
            display: grid;
            place-items: center;
            pointer-events: none;
            border: clamp(.055rem,.09cqw,.085rem) solid rgb(176 236 255 / .92);
            border-radius: 28%;
            background: linear-gradient(145deg, rgb(34 142 255 / .96), rgb(22 74 190 / .94));
            color: rgb(225 250 255 / .98);
            font: 900 clamp(.42rem,.72cqw,.65rem)/1 system-ui;
            text-shadow: 0 0 .35em rgb(210 250 255 / .95);
            box-shadow:
              0 0 clamp(.16rem,.32cqw,.3rem) rgb(103 215 255 / .9),
              0 0 clamp(.4rem,.72cqw,.68rem) rgb(38 121 255 / .58);
          }

          .screen-game .original-card.has-magic-barrier {
            outline: clamp(.04rem,.07cqw,.065rem) solid rgb(141 225 255 / .58) !important;
            outline-offset: calc(clamp(.03rem,.06cqw,.055rem) * -1) !important;
            box-shadow:
              inset 0 0 clamp(.25rem,.55cqw,.5rem) rgb(67 173 255 / .18),
              0 0 clamp(.18rem,.42cqw,.38rem) rgb(58 170 255 / .38) !important;
          }

          @keyframes hh-magic-barrier-pulse {
            0%,100% {
              opacity: .78;
              filter: brightness(.96) saturate(1.05);
            }
            50% {
              opacity: 1;
              filter: brightness(1.18) saturate(1.25);
            }
          }

          @media (prefers-reduced-motion: reduce) {
            .screen-game .card-frame:has(> .original-card.has-magic-barrier)::before {
              animation: none;
              opacity: .9;
            }
          }
          ''', encoding='utf-8')

          Path('tests/magic-barrier-visual.test.mjs').write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { readFile } from "node:fs/promises";

          test("Magic Barrier uses a responsive blue battlefield shield shell", async () => {
            const css = await readFile(new URL("../app/magic-barrier.css", import.meta.url), "utf8");
            assert.match(css, /has-magic-barrier/);
            assert.match(css, /card-frame:has/);
            assert.match(css, /rgb\(100 205 255/);
            assert.match(css, /rgb\(34 142 255/);
            assert.match(css, /clamp\(/);
            assert.match(css, /hh-magic-barrier-pulse/);
            assert.doesNotMatch(css, /width:\s*\d+px|height:\s*\d+px/);
          });

          test("Magic Barrier stylesheet loads after canonical UI overrides", async () => {
            const globals = await readFile(new URL("../app/globals.css", import.meta.url), "utf8");
            const overrides = globals.indexOf('@import "./ui-overrides.css";');
            const barrier = globals.indexOf('@import "./magic-barrier.css";');
            assert.ok(overrides >= 0 && barrier > overrides);
          });
          ''', encoding='utf-8')

      - name: Remove one-shot workflow and publish fix
        run: |
          rm .github/workflows/hotfix-magic-barrier-visual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css app/magic-barrier.css tests/magic-barrier-visual.test.mjs .github/workflows/hotfix-magic-barrier-visual.yml
          git commit -m "style: add blue shield visual for Magic Barrier"
          git push origin HEAD:fix/cards_mechanics
