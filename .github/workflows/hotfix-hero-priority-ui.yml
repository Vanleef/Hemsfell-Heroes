name: One-shot hero priority UI fix

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/hotfix-hero-priority-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - run: python .github/scripts/hotfix-hero-priority-ui.py
      - run: |
          rm .github/workflows/hotfix-hero-priority-ui.yml
          rm .github/scripts/hotfix-hero-priority-ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/ui-overrides.css tests/hero-priority-ui.test.mjs .github/workflows/hotfix-hero-priority-ui.yml .github/scripts/hotfix-hero-priority-ui.py
          git commit -m "fix: expose hero abilities in priority UI"
          git push origin HEAD:fix/cards_mechanics
