name: Fix Xarqiroth first act once
on:
  push:
    branches: [fix/cards_mechanics]
    paths: [.github/workflows/fix-xarqiroth-first-act-once.yml]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
      - name: Patch Xarqiroth canonical rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/rules-engine/card-rules.mjs')
          s=p.read_text()
          anchor='  p6: [ability("onEnter", [effect("damage", { amount: 2, target: "anyCreature", selections: 1 })])],\n'
          insert='  p7: [ability("onEnter", [effect("draw", { amount: 2 })], [], { condition: { controllerControlsOtherSubtype: "Dragão" }, triggerMeta: { kind: "conditional-passive", scenario: "Primeiro Ato: se você controlar outro Dragão, compre 2 cartas." } })],\n'
          if '  p7:' not in s:
              if anchor not in s: raise SystemExit('p6 anchor not found')
              s=s.replace(anchor,anchor+insert,1)
          else:
              raise SystemExit('p7 already exists; inspect manually')
          p.write_text(s)
          PY
      - name: Add regression
        run: |
          cat > tests/xarqiroth-first-act-regression.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import cards from "../app/cards.generated.json" with { type: "json" };
          import { compileCard } from "../app/rules-engine/compiler.mjs";
          import { executeCommand } from "../app/rules-engine/engine.mjs";

          const byPage=(page)=>compileCard(cards.find(card=>Number(card.page)===page));
          const filler=(id)=>compileCard({page:900+Number(id.slice(-1)||0),id,name:`Filler ${id}`,type:"Feitiço",cost:0,text:"",tags:[]});
          const base=()=>({active:0,phase:"principal",round:1,players:[0,1].map((_,i)=>({heroId:i?"goblin":"gimble",level:1,life:30,maxLife:30,energy:20,maxEnergy:20,reserve:0,deck:[],extraDeck:[],hand:[],board:[],support:[],terrain:null,grave:[],obscuro:[],cardsPlayed:0,turnCardsPlayed:0,turnSpellsPlayed:0,spellsPlayed:0,abilityUses:{}})),rulesEvents:[],pendingDecision:null,pendingResponse:null,combatAction:null});

          test("Xarqiroth não pede alvo e não compra sem outro Dragão",()=>{
            const g=base(); g.players[0].hand.push({...byPage(7),id:"xarq"}); g.players[0].deck.push(filler("f1"),filler("f2"));
            const r=executeCommand(g,{type:"playCard",owner:0,cardId:"xarq",slot:0,skipPriority:true}).state;
            assert.equal(r.pendingDecision??null,null);
            assert.equal(r.players[0].hand.length,0);
            assert.equal(r.players[0].deck.length,2);
          });

          test("Xarqiroth compra 2 sem pedir alvo quando já existe outro Dragão",()=>{
            const g=base(); const dragon=compileCard({page:998,id:"dragon",name:"Outro Dragão",type:"Criatura",cost:0,atk:1,hp:1,text:"",tags:["Dragão"],subtypes:["Dragão"]});
            g.players[0].board.push({...dragon,uid:"dragon-field",slot:1,damage:0,exhausted:false,summoning:false,modifiers:[]});
            g.players[0].hand.push({...byPage(7),id:"xarq"}); g.players[0].deck.push(filler("f1"),filler("f2"));
            const r=executeCommand(g,{type:"playCard",owner:0,cardId:"xarq",slot:0,skipPriority:true}).state;
            assert.equal(r.pendingDecision??null,null);
            assert.equal(r.players[0].hand.length,2);
            assert.equal(r.players[0].deck.length,0);
          });
          EOF
          node --test tests/xarqiroth-first-act-regression.test.mjs
      - name: Verify source
        run: grep -F 'p7: [ability("onEnter", [effect("draw", { amount: 2 })]' app/rules-engine/card-rules.mjs
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/rules-engine/card-rules.mjs tests/xarqiroth-first-act-regression.test.mjs
          git commit -m 'fix: make Xarqiroth first act targetless'
          git push origin fix/cards_mechanics
