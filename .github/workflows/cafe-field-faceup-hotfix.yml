name: Cafe field face-up hotfix

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.issue.title == '[bot] cafe faceup hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch generated field image semantics
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'needle not found in {path}: {old[:160]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('app/rules-engine/effects.mjs',
            '    const catalog = [...(state.cardCatalog || []), ...(entry.extraDeck || [])];\n    const base = catalog.find((card) => card.name === effect.name) || { id: `image:${effect.name}`, name: effect.name, type: "Criatura", atk: 1, hp: 1, tags: [] };',
            '    const sourceOwner = Number.isInteger(context.decisionOwner) ? context.decisionOwner : Number.isInteger(context.controllerOwner) ? context.controllerOwner : context.owner;\n    const sourceEntry = player(state, sourceOwner);\n    const catalog = [...(state.cardCatalog || []), ...(sourceEntry?.extraDeck || []), ...(entry.extraDeck || [])];\n    const imageName = String(effect.name || effect.imageName || "").trim();\n    const base = catalog.find((card) => normalizedName(card.name) === normalizedName(imageName)) || { id: `image:${imageName}`, name: imageName, type: "Criatura", atk: 1, hp: 1, tags: [] };')

          replace_once('app/rules-engine/effects.mjs',
            '    const copy = { ...structuredClone(base), uid: `${base.id}-image-${state.round}-${state.nextGeneratedId}`, generatedImage: true, imageCard: true, enteredRound: state.round, attackedThisTurn: false, summoning: base.type === "Artefato" || (base.type === "Criatura" && !(base.tags || []).some((tag) => /investida/i.test(String(tag)))), exhausted: false, damage: 0, slot: context.slot ?? 0, abilities: base.abilities || [] };\n    if (effect.destination === "hand") { entry.hand.push({ ...copy, revealed: true, revealedTo: [0, 1] }); return; }',
            '    const { revealed: _revealed, revealedTo: _revealedTo, ...publicBase } = structuredClone(base);\n    const copy = { ...publicBase, uid: `${base.id}-image-${state.round}-${state.nextGeneratedId}`, generatedImage: true, imageCard: true, enteredRound: state.round, attackedThisTurn: false, summoning: base.type === "Artefato" || (base.type === "Criatura" && !(base.tags || []).some((tag) => /investida/i.test(String(tag)))), exhausted: false, damage: 0, slot: context.slot ?? 0, abilities: base.abilities || [] };\n    if (effect.destination === "hand") { entry.hand.push({ ...copy, revealed: true, revealedTo: [0, 1] }); return; }')

          replace_once('app/rules-engine/engine-base.mjs',
            '          state.pendingDecision = null; stack.push(...continuation);\n          stack.push({ kind: "effect", effect: { type: "createImage", name: decision.effect.name, destination: "field" }, context: { ...decision.context, owner: targetOwner, decisionOwner: item.command.owner, slot, placementZone } });',
            '          const sourceOwner = Number.isInteger(decision.context?.owner) ? decision.context.owner : item.command.owner;\n          const source = permanentUnits(state.players[sourceOwner]).find((unit) => (unit.uid || unit.id) === decision.context?.sourceId);\n          const imageName = decision.effect.name || decision.effect.imageName || (Number(source?.page) === 212 ? "Gato Multidimensional" : undefined);\n          if (!imageName) throw new RulesViolation("image-placement-missing-name");\n          state.pendingDecision = null; stack.push(...continuation);\n          stack.push({ kind: "effect", effect: { type: "createImage", name: imageName, destination: "field" }, context: { ...decision.context, owner: targetOwner, decisionOwner: item.command.owner, controllerOwner: sourceOwner, slot, placementZone } });')

          replace_once('app/page.tsx',
            '{card.revealed&&<span className="revealed-badge" title="Carta revelada: ambos os jogadores podem vê-la" aria-label="Carta revelada">◉</span>}',
            '{!unit&&card.revealed&&<span className="revealed-badge" title="Carta revelada: ambos os jogadores podem vê-la" aria-label="Carta revelada">◉</span>}')

          p=Path('tests/cafe-do-tempo-placement.test.mjs'); text=p.read_text(encoding='utf-8')
          text=text.replace('assert.equal(cat.revealed,true,"Gato Multidimensional criado em campo deve ficar com a face pública");\n assert.deepEqual(cat.revealedTo,[0,1],"ambos os jogadores devem enxergar o Gato Multidimensional em campo");','assert.equal(cat.revealed,undefined,"cartas em campo não usam flag de revelação de zona oculta");\n assert.equal(cat.revealedTo,undefined,"cartas em campo não carregam metadata de mão revelada");\n assert.equal(cat.page,213);assert.equal(cat.atk,0);assert.equal(cat.hp,1);')
          text=text.replace('assert.equal(cat.exhausted,false);assert.equal(cat.revealed,true);assert.deepEqual(cat.revealedTo,[0,1]);','assert.equal(cat.exhausted,false);assert.equal(cat.revealed,undefined);assert.equal(cat.revealedTo,undefined);assert.equal(cat.page,213);assert.equal(cat.atk,0);assert.equal(cat.hp,1);')
          text=text.replace('assert.ok(cat);assert.equal(cat.revealed,true);assert.deepEqual(cat.revealedTo,[0,1]);','assert.ok(cat);assert.equal(cat.revealed,undefined);assert.equal(cat.revealedTo,undefined);assert.equal(cat.page,213);')
          marker='test("Café do Tempo resolves canonical Gato when placed on an opponent without that Image in its Deck Extra"'
          if marker not in text:
              text += '''\n\ntest("Café do Tempo resolves canonical Gato when placed on an opponent without that Image in its Deck Extra",()=>{\n const game=state(1);delete game.cardCatalog;installCafe(game,0);\n game.players[1].extraDeck=[];\n const next=executeCommand(game,{type:"advancePhase",owner:1}).state;\n const placed=executeCommand(next,{type:"resolveDecision",owner:0,slot:2,placementZone:"creature"}).state;\n const cat=placed.players[1].board.find(card=>card.name==="Gato Multidimensional");\n assert.ok(cat);assert.equal(cat.page,213);assert.equal(cat.atk,0);assert.equal(cat.hp,1);\n assert.equal(cat.revealed,undefined);assert.equal(cat.revealedTo,undefined);\n});\n'''
          p.write_text(text,encoding='utf-8')

      - name: Focused Café tests
        run: node --test tests/cafe-do-tempo-placement.test.mjs
      - name: Rules regression
        run: npm run test:rules
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rules-engine/effects.mjs app/rules-engine/engine-base.mjs app/page.tsx tests/cafe-do-tempo-placement.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: render generated cats as battlefield cards"
          git push origin HEAD:fix/cards_mechanics
