name: Inspect smoke breath target once
on:
  push:
    paths:
      - '.github/workflows/inspect-smoke-breath-target-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
      - name: Locate Bafo de Fumaca and target filters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import unicodedata
          def norm(s):
              return ''.join(c for c in unicodedata.normalize('NFD', s) if unicodedata.category(c) != 'Mn').lower()
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(x in p.parts for x in ['.git','node_modules','.next']):
                  continue
              if p.suffix not in {'.ts','.tsx','.js','.mjs','.json','.md'}:
                  continue
              try: lines=p.read_text(errors='ignore').splitlines()
              except: continue
              for i,line in enumerate(lines):
                  if 'bafo de fumaca' in norm(line):
                      print(f'FILE {p} LINE {i+1}')
                      print('\n'.join(f'{j+1}: {lines[j]}' for j in range(max(0,i-5),min(len(lines),i+8))))
          print('--- candidate target exclusion syntax ---')
          for token in ['excludeSelf','excludeSource','sourceId','notSelf','otherCreature','anotherCreature']:
              for p in Path('app').rglob('*'):
                  if not p.is_file() or p.suffix not in {'.ts','.tsx','.js','.mjs'}: continue
                  try: text=p.read_text(errors='ignore')
                  except: continue
                  if token in text:
                      print(token, p)
          PY