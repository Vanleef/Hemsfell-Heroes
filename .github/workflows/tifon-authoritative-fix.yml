name: Apply Tifon authoritative fixes
on:
  push:
    branches: [fix/cards_mechanics]
    paths:
      - '.github/tifon_authoritative_patch.py'
      - '.github/tifon_followup.py'
      - '.github/workflows/tifon-authoritative-fix.yml'
permissions:
  contents: write
jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Apply Tifon patch
        run: |
          python .github/tifon_authoritative_patch.py
          python .github/tifon_followup.py
      - name: Restore executable build helpers
        run: find scripts -maxdepth 1 -type f -name '*.sh' -exec chmod +x {} +
      - name: Install dependencies
        run: npm ci
      - name: Validate focused Tifon regressions
        run: node --test tests/tifon-authoritative.test.mjs
      - name: Run rules suite
        run: npm test
      - name: Build Vercel target
        run: npm run vercel-build
      - name: Refresh implementation audit
        run: npm run audit:cards --if-present
      - name: Commit fixes and remove temporary helpers
        shell: bash
        run: |
          rm -f .github/tifon_authoritative_patch.py .github/tifon_followup.py .github/workflows/tifon-authoritative-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make Tifon death mechanics authoritative'
          git push origin HEAD:fix/cards_mechanics
