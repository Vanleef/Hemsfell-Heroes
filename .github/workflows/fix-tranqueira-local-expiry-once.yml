name: Fix Tranqueira local expiry once

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/fix-tranqueira-local-expiry-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch local end-turn compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''if(p.pendingTranqueira){const played=p.turnCardsPlayed;if(played>=7)summonImage(g,owner,"CARCAÇA CHUMBADA DE TANQUE");else if(played===6)summonImage(g,owner,"TRAMBUCO DO PIPOCO");else if(played===5)summonImage(g,owner,"BUCHA DE CANHÃO");else if(played>0){p.life-=played;log(g,`TRANQUEIRA-MÁTICA falhou: ${p.heroId===mine?"você":"a IA"} sofreu ${played} de dano.`,"damage")}p.pendingTranqueira=false}};'''
          new = '''const liveTranqueiras=p.support.filter(x=>x.page===46);if(liveTranqueiras.length){p.support=p.support.filter(x=>x.page!==46);liveTranqueiras.forEach(x=>sendToGrave(g,p,x));liveTranqueiras.forEach(x=>{const played=Math.max(0,Number((x as any).cardsPlayedAfterSelf||0));if(played>=7)summonImage(g,owner,"CARCAÇA CHUMBADA DE TANQUE");else if(played===6)summonImage(g,owner,"TRAMBUCO DO PIPOCO");else if(played===5)summonImage(g,owner,"BUCHA DE CANHÃO");else if(played>0){p.life-=played;log(g,`TRANQUEIRA-MÁTICA falhou: ${p.heroId===mine?"você":"a IA"} sofreu ${played} de dano.`,"damage")}log(g,`${x.name} deixou o campo no fim do turno em que foi usada.`,"effect")});p.pendingTranqueira=false}else if(p.pendingTranqueira){const played=p.turnCardsPlayed;if(played>=7)summonImage(g,owner,"CARCAÇA CHUMBADA DE TANQUE");else if(played===6)summonImage(g,owner,"TRAMBUCO DO PIPOCO");else if(played===5)summonImage(g,owner,"BUCHA DE CANHÃO");else if(played>0){p.life-=played;log(g,`TRANQUEIRA-MÁTICA falhou: ${p.heroId===mine?"você":"a IA"} sofreu ${played} de dano.`,"damage")}p.pendingTranqueira=false}};'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy Tranqueira block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('tests/tranqueira-local-ui-expiry-regression.test.mjs')
          test_path.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\ntest("local end-turn removes every live Tranqueira using its own counter", async () => {\n  const page = await readFile(new URL("../app/page.tsx", import.meta.url), "utf8");\n  assert.match(page, /liveTranqueiras=p\\.support\\.filter\\(x=>x\\.page===46\\)/);\n  assert.match(page, /cardsPlayedAfterSelf/);\n  assert.match(page, /p\\.support=p\\.support\\.filter\\(x=>x\\.page!==46\\)/);\n  assert.match(page, /liveTranqueiras\\.forEach\\(x=>sendToGrave\\(g,p,x\\)\\)/);\n  assert.match(page, /else if\\(p\\.pendingTranqueira\\)/);\n});\n''', encoding='utf-8')
          PY
      - name: Run focused regressions
        run: node --test tests/limo-tranqueira-regression.test.mjs tests/tranqueira-local-ui-expiry-regression.test.mjs
      - name: Commit repair to current branch
        shell: bash
        run: |
          rm .github/workflows/fix-tranqueira-local-expiry-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx tests/tranqueira-local-ui-expiry-regression.test.mjs .github/workflows/fix-tranqueira-local-expiry-once.yml
          git commit -m "fix: expire Tranqueira in local end-turn flow"
          git push origin HEAD:fix/cards_mechanics
