name: Online command schema rules diagnostic

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - .github/workflows/online-command-schema-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the exact v6 schema patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/online-command-schema-v6.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(code, 'online-command-schema-v6-inline.py', 'exec'), {})
          PY

      - name: Reproduce v6 pre-gate cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/online-command-schema-v4.yml .github/workflows/online-command-schema-v5.yml .github/workflows/online-command-schema-v6.yml
          git diff --check

      - name: Full rules suite with captured output
        id: rules
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee test-rules.log

      - name: Upload rules diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-diagnostic
          path: test-rules.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve rules gate result
        if: steps.rules.outcome != 'success'
        run: exit 1
