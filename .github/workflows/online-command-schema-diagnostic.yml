name: Validate final online command schema diff

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - .github/workflows/online-command-schema-diagnostic.yml

permissions:
  contents: read

jobs:
  validate-final-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the exact v6 schema patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/online-command-schema-v6.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(code, 'online-command-schema-v6-inline.py', 'exec'), {})
          PY

      - name: Prepare final cleanup and diff
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/online-command-schema-v4.yml \
            .github/workflows/online-command-schema-v5.yml \
            .github/workflows/online-command-schema-v6.yml \
            .github/workflows/online-command-schema-diagnostic.yml
          git diff --check
          git diff --stat > final-diff-stat.txt
          git diff -- . ':!final-diff-stat.txt' ':!final-diff.patch' > final-diff.patch
          cat final-diff-stat.txt

      - name: Upload proposed final diff
        uses: actions/upload-artifact@v4
        with:
          name: command-schema-final-diff
          path: |
            final-diff-stat.txt
            final-diff.patch
          if-no-files-found: error
          retention-days: 1

      - name: Focused command schema tests
        run: node --test tests/online-command-schema.test.mjs tests/online-match-runtime.test.mjs tests/online-maintenance-choice.test.mjs

      - name: Online typecheck
        run: npm run typecheck:online

      - name: AI typecheck
        run: npm run typecheck:ai

      - name: Full rules suite
        run: npm run test:rules

      - name: AI strategic benchmark
        run: npm run benchmark:ai

      - name: Build Next.js application
        run: npm run vercel-build
