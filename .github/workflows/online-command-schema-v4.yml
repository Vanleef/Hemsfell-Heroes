name: Apply online command schemas v4

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - .github/workflows/online-command-schema-v4.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply explicit command schemas
        shell: bash
        run: |
          set -euo pipefail
          cat > app/api/rooms/online-command-schema.mjs <<'EOF'
          const MAX_COMMAND_KEYS = 24;
          const MAX_ID_LENGTH = 160;
          const MAX_CHOICE_LENGTH = 160;
          const MAX_LIST_ITEMS = 64;
          const MAX_MARKER_SELECTIONS = 32;
          const MAX_REPOSITION_MOVES = 5;

          const isRecord = (value) => !!value && typeof value === "object" && !Array.isArray(value);
          const integerIn = (value, min, max) => Number.isInteger(value) && value >= min && value <= max;
          const boundedString = (value, max = MAX_ID_LENGTH) => typeof value === "string" && value.length > 0 && value.length <= max;
          const id = (value) => boundedString(value);
          const idList = (value) => Array.isArray(value) && value.length <= MAX_LIST_ITEMS && value.every(id);
          const booleanValue = (value) => typeof value === "boolean";
          const slot = (value) => integerIn(value, 0, 4);
          const choiceIndex = (value) => integerIn(value, 0, 128);
          const markerAmount = (value) => integerIn(value, 0, 100);
          const placementZone = (value) => value === "creature" || value === "support";
          const element = (value) => ["Fogo", "Água", "Terra", "Ar"].includes(value);
          const cafeEffect = (value) => ["cats", "heal", "draw", "level"].includes(value);
          const choice = (value) => boundedString(value, MAX_CHOICE_LENGTH);
          const markerSelections = (value) => Array.isArray(value)
            && value.length <= MAX_MARKER_SELECTIONS
            && value.every((entry) => isRecord(entry) && id(entry.id) && integerIn(entry.amount, 1, 100) && Object.keys(entry).every((key) => key === "id" || key === "amount"));
          const moves = (value) => Array.isArray(value)
            && value.length <= MAX_REPOSITION_MOVES
            && value.every((entry) => isRecord(entry) && id(entry.sourceId) && slot(entry.slot) && Object.keys(entry).every((key) => key === "sourceId" || key === "slot"));

          const validators = Object.freeze({
            id,
            idList,
            boolean: booleanValue,
            slot,
            choiceIndex,
            markerAmount,
            placementZone,
            element,
            cafeEffect,
            choice,
            markerSelections,
            moves,
          });

          const COMMAND_SPECS = Object.freeze({
            playCard: {
              required: { cardId: "id" },
              optional: {
                slot: "slot",
                attachedTo: "id",
                targetIds: "idList",
                sacrificeIds: "idList",
                markerAmount: "markerAmount",
                chosenElement: "element",
                selectedImageName: "choice",
                cafeEffect: "cafeEffect",
                elementalTargetId: "id",
                placementZone: "placementZone",
              },
            },
            activate: {
              required: { sourceId: "id", abilityId: "id" },
              optional: { markerAmount: "markerAmount", targetIds: "idList", sacrificeIds: "idList" },
            },
            activateHero: {
              required: { abilityId: "id" },
              optional: { markerAmount: "markerAmount", targetIds: "idList", sacrificeIds: "idList" },
            },
            evolveHero: { required: {}, optional: {} },
            maintenanceChoice: { required: {}, optional: { drawTwo: "boolean" } },
            declareAttack: { required: { attackerId: "id" }, optional: {} },
            selectDefender: {
              required: { attackerId: "id" },
              optional: { defenderId: "id", targetHero: "boolean" },
            },
            attack: { required: { attackerId: "id" }, optional: { defenderId: "id" } },
            advancePhase: { required: {}, optional: {} },
            resolveDecision: {
              required: {},
              optional: {
                choiceIndex: "choiceIndex",
                selectedCardId: "id",
                selectedCardIds: "idList",
                targetIds: "idList",
                attackerId: "id",
                defenderId: "id",
                markerSelections: "markerSelections",
                markerAmount: "markerAmount",
                slot: "slot",
                placementZone: "placementZone",
              },
            },
            reposition: { required: { moves: "moves" }, optional: {} },
            confirmReposition: { required: {}, optional: {} },
            passPriority: { required: {}, optional: {} },
            surrender: { required: {}, optional: {} },
          });

          export const ONLINE_CLIENT_COMMAND_TYPES = Object.freeze(Object.keys(COMMAND_SPECS));
          export const STRIPPED_AUTHORITY_FIELDS = Object.freeze([
            "owner", "side", "by", "instanceId", "hasPriority", "skipPriority", "auto",
            "handLimitSatisfied", "skipMaintenanceChoice", "__lockedCost", "__priorityPayment",
          ]);

          const invalid = () => ({ ok: false, code: "INVALID_RULES_COMMAND", error: "invalid rules command" });

          export function parseOnlineCommand(input) {
            if (!isRecord(input) || Object.keys(input).length > MAX_COMMAND_KEYS || !boundedString(input.type, 64)) return invalid();
            const spec = COMMAND_SPECS[input.type];
            if (!spec) return { ok: false, code: "UNSUPPORTED_RULES_COMMAND", error: "unsupported rules command" };
            const command = { type: input.type };
            for (const [key, validatorName] of Object.entries(spec.required)) {
              const validator = validators[validatorName];
              if (!validator(input[key])) return invalid();
              command[key] = input[key];
            }
            for (const [key, validatorName] of Object.entries(spec.optional)) {
              if (input[key] === undefined) continue;
              const validator = validators[validatorName];
              if (!validator(input[key])) return invalid();
              command[key] = input[key];
            }
            return { ok: true, command };
          }
          EOF

          cat > app/api/rooms/online-command-schema.d.mts <<'EOF'
          export type OnlineClientCommand = { type: string; [key: string]: any };
          export type OnlineCommandParseResult =
            | { ok: true; command: OnlineClientCommand }
            | { ok: false; code: "INVALID_RULES_COMMAND" | "UNSUPPORTED_RULES_COMMAND"; error: string };
          export const ONLINE_CLIENT_COMMAND_TYPES: readonly string[];
          export const STRIPPED_AUTHORITY_FIELDS: readonly string[];
          export function parseOnlineCommand(input: unknown): OnlineCommandParseResult;
          EOF

          python - <<'PY'
          from pathlib import Path

          machine = Path('app/api/rooms/machine.ts')
          text = machine.read_text()
          import_anchor = 'import { logOnlineDiagnostic } from "./online-diagnostics.mjs";\n'
          if 'online-command-schema.mjs' not in text:
              assert import_anchor in text
              text = text.replace(import_anchor, import_anchor + 'import { parseOnlineCommand } from "./online-command-schema.mjs";\n', 1)

          old = '''  if (!AUTHORITATIVE_COMMANDS.has(String(rawCommand.type || ""))) {
            logOnlineDiagnostic(room, "command-rejected", { role, commandType: String(rawCommand.type || ""), reason: "unsupported command", baseRevision });
            return { ok: false, status: 400, error: "unsupported command" };
          }
          const owner = role === "host" ? 0 : 1;
          try {
            /* Never trust an owner sent by the browser. Authentication selects it. */
            const command: Record<string, any> = { ...rawCommand, owner };
          '''
          new = '''  const parsedCommand = parseOnlineCommand(rawCommand);
          if (!parsedCommand.ok) {
            logOnlineDiagnostic(room, "command-rejected", { role, commandType: String(rawCommand.type || ""), reason: parsedCommand.error, baseRevision });
            return { ok: false, status: 400, error: parsedCommand.error, code: parsedCommand.code };
          }
          if (!AUTHORITATIVE_COMMANDS.has(parsedCommand.command.type)) {
            logOnlineDiagnostic(room, "command-rejected", { role, commandType: parsedCommand.command.type, reason: "unsupported command", baseRevision });
            return { ok: false, status: 400, error: "unsupported command", code: "UNSUPPORTED_RULES_COMMAND" };
          }
          const owner = role === "host" ? 0 : 1;
          try {
            /* Authentication owns the player index. The schema allow-list also
               drops browser attempts to inject priority/payment/internal state. */
            const command: Record<string, any> = { ...parsedCommand.command, owner };
          '''
          assert old in text, 'applyRulesCommand boundary anchor changed'
          text = text.replace(old, new, 1)

          old_catch = '    return { ok: false, status: 400, error: message };\n'
          new_catch = '    return { ok: false, status: 400, error: message, code: "RULES_COMMAND_REJECTED" };\n'
          assert old_catch in text, 'command rejection anchor changed'
          text = text.replace(old_catch, new_catch, 1)
          machine.write_text(text)

          route = Path('app/api/rooms/[id]/route.ts')
          text = route.read_text()
          old_route = '      if (!resolution.ok) return NextResponse.json({ error: resolution.error, ...roomView(room, true, role) }, { status: resolution.status, ...noStore });\n'
          new_route = '      if (!resolution.ok) return NextResponse.json({ error: resolution.error, code: resolution.code ?? (resolution.status === 400 ? "INVALID_RULES_COMMAND" : "RULES_COMMAND_REJECTED"), ...roomView(room, true, role) }, { status: resolution.status, ...noStore });\n'
          assert old_route in text, 'command route error anchor changed'
          route.write_text(text.replace(old_route, new_route, 1))
          PY

          cat > tests/online-command-schema.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";
          import { ONLINE_CLIENT_COMMAND_TYPES, STRIPPED_AUTHORITY_FIELDS, parseOnlineCommand } from "../app/api/rooms/online-command-schema.mjs";

          test("online command schema covers the authoritative HTTP command surface", () => {
            assert.deepEqual([...ONLINE_CLIENT_COMMAND_TYPES].sort(), [
              "activate", "activateHero", "advancePhase", "attack", "confirmReposition",
              "declareAttack", "evolveHero", "maintenanceChoice", "passPriority", "playCard",
              "reposition", "resolveDecision", "selectDefender", "surrender",
            ].sort());
          });

          test("playCard keeps legal intent and strips browser authority", () => {
            const result = parseOnlineCommand({
              type: "playCard",
              cardId: "p61-copy-2",
              slot: 3,
              targetIds: ["enemy-hero"],
              sacrificeIds: ["ally-7"],
              chosenElement: "Água",
              selectedImageName: "Clone de Água",
              cafeEffect: "draw",
              elementalTargetId: "unit-8",
              placementZone: "support",
              owner: 1,
              instanceId: "browser-owned-instance",
              hasPriority: true,
              skipPriority: true,
              auto: true,
              __lockedCost: 0,
              __priorityPayment: { cost: 0 },
            });
            assert.equal(result.ok, true);
            assert.deepEqual(result.command, {
              type: "playCard",
              cardId: "p61-copy-2",
              slot: 3,
              targetIds: ["enemy-hero"],
              sacrificeIds: ["ally-7"],
              chosenElement: "Água",
              selectedImageName: "Clone de Água",
              cafeEffect: "draw",
              elementalTargetId: "unit-8",
              placementZone: "support",
            });
            for (const field of STRIPPED_AUTHORITY_FIELDS) assert.equal(Object.hasOwn(result.command, field), false, field);
          });

          test("schemas preserve current maintenance, activation, combat and decision payloads", () => {
            assert.deepEqual(parseOnlineCommand({ type: "maintenanceChoice", drawTwo: true }), { ok: true, command: { type: "maintenanceChoice", drawTwo: true } });
            assert.equal(parseOnlineCommand({ type: "activate", sourceId: "unit-1", abilityId: "ring-use", markerAmount: 4, targetIds: ["enemy-2"], sacrificeIds: [] }).ok, true);
            assert.equal(parseOnlineCommand({ type: "activateHero", abilityId: "saymon-level-1", targetIds: ["enemy-hero"] }).ok, true);
            assert.equal(parseOnlineCommand({ type: "selectDefender", attackerId: "atk-1", defenderId: "def-1", targetHero: false }).ok, true);
            assert.equal(parseOnlineCommand({ type: "attack", attackerId: "atk-1", defenderId: "def-1", skipPriority: true }).ok, true);
            assert.equal(parseOnlineCommand({ type: "reposition", moves: [{ sourceId: "unit-1", slot: 4 }] }).ok, true);
            assert.equal(parseOnlineCommand({ type: "resolveDecision", choiceIndex: 1, selectedCardIds: ["card-1"], targetIds: ["unit-2"], markerSelections: [{ id: "unit-3", amount: 2 }], slot: 1, placementZone: "creature" }).ok, true);
          });

          test("malformed or oversized commands are rejected before the rules engine", () => {
            assert.equal(parseOnlineCommand(null).ok, false);
            assert.equal(parseOnlineCommand({ type: "teleportState", owner: 0 }).code, "UNSUPPORTED_RULES_COMMAND");
            assert.equal(parseOnlineCommand({ type: "playCard" }).ok, false);
            assert.equal(parseOnlineCommand({ type: "maintenanceChoice", drawTwo: "yes" }).ok, false);
            assert.equal(parseOnlineCommand({ type: "reposition", moves: [{ sourceId: "x", slot: 99 }] }).ok, false);
            assert.equal(parseOnlineCommand({ type: "resolveDecision", selectedCardIds: Array.from({ length: 65 }, (_, i) => `c-${i}`) }).ok, false);
            assert.equal(parseOnlineCommand({ type: "resolveDecision", markerSelections: [{ id: "x", amount: 0 }] }).ok, false);
            assert.equal(parseOnlineCommand({ type: "playCard", cardId: "x", ...Object.fromEntries(Array.from({ length: 30 }, (_, i) => [`junk${i}`, i])) }).ok, false);
          });

          test("server boundary uses sanitized commands and never spreads the raw HTTP command into engine input", () => {
            const machine = fs.readFileSync(new URL("../app/api/rooms/machine.ts", import.meta.url), "utf8");
            const route = fs.readFileSync(new URL("../app/api/rooms/[id]/route.ts", import.meta.url), "utf8");
            assert.match(machine, /parseOnlineCommand\(rawCommand\)/);
            assert.match(machine, /\.\.\.parsedCommand\.command, owner/);
            assert.doesNotMatch(machine, /const command[^\n]*\.\.\.rawCommand/);
            assert.match(machine, /command\.skipPriority = true/);
            assert.match(route, /code: resolution\.code/);
          });
          EOF

          # The runner must not become part of the product commit or trip canonical-state checks.
          git rm .github/workflows/online-command-schema-v4.yml
          git diff --check

      - name: Focused command schema tests
        run: node --test tests/online-command-schema.test.mjs tests/online-match-runtime.test.mjs tests/online-maintenance-choice.test.mjs

      - name: Prepare generated card data
        run: npm run prepare:cards

      - name: Online typecheck
        run: npm run typecheck:online

      - name: AI typecheck
        run: npm run typecheck:ai

      - name: Full rules suite
        run: npm run test:rules

      - name: AI strategic benchmark
        run: npm run benchmark:ai

      - name: Build Next.js application
        run: npm run vercel-build

      - name: Commit validated schema hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/rooms/online-command-schema.mjs app/api/rooms/online-command-schema.d.mts app/api/rooms/machine.ts 'app/api/rooms/[id]/route.ts' tests/online-command-schema.test.mjs .github/workflows/online-command-schema-v4.yml
          git diff --cached --check
          git commit -m "feat: validate authoritative online commands"
          git push origin HEAD:feat/web-card-game-quality-foundation
