name: Fix Xarqiroth v2
on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/fix-xarqiroth-v2.yml
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
      - name: Apply rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/rules-engine/card-rules.mjs')
          s = p.read_text()
          if '  p7:' not in s:
              anchor = '  p6: [ability("onEnter", [effect("damage", { amount: 2, target: "anyCreature", selections: 1 })])],\n'
              rule = '  p7: [ability("onEnter", [effect("draw", { amount: 2 })], [], { condition: { controllerControlsOtherSubtype: "Dragão" }, triggerMeta: { kind: "conditional-passive", scenario: "Primeiro Ato: se você controlar outro Dragão, compre 2 cartas." } })],\n'
              if anchor not in s:
                  raise SystemExit('p6 anchor not found')
              s = s.replace(anchor, anchor + rule, 1)
              p.write_text(s)
          PY
      - name: Verify
        shell: bash
        run: grep -F 'controllerControlsOtherSubtype: "Dragão"' app/rules-engine/card-rules.mjs
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/rules-engine/card-rules.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: make Xarqiroth first act targetless'
          git push origin fix/cards_mechanics
