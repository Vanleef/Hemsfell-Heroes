name: Fix direct Hero anchor

on:
  push:
    branches:
      - feat/presentation-system-pr1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Patch Hero presentation anchoring
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise AssertionError(f"missing anchor: {label}")
              return text.replace(old, new, 1)

          runtime_path = Path('app/game-presentation-runtime.tsx')
          runtime = runtime_path.read_text()

          runtime = replace_once(
              runtime,
              'type HeroDom = { element: HTMLElement; rect: RectLike; clone: HTMLElement; life: number };',
              'type HeroDom = { element: HTMLElement; rect: RectLike; clone: HTMLElement; life: number; lifeElement: HTMLElement | null; lifeRect: RectLike | null };',
              'HeroDom life snapshot',
          )

          old_snapshot = '''  document.querySelectorAll<HTMLElement>(".game-stage .player-hero").forEach((hero) => {\n    const owner: Owner = hero.classList.contains("enemy") ? 1 : 0;\n    heroes.set(owner, { element: hero, rect: rectOf(hero), clone: cloneRendered(hero), life: numberText(hero.querySelector<HTMLElement>(".hero-life")?.textContent) });\n  });'''
          new_snapshot = '''  document.querySelectorAll<HTMLElement>(".game-stage .player-hero").forEach((hero) => {\n    const owner: Owner = hero.classList.contains("enemy") ? 1 : 0;\n    const lifeElement = hero.querySelector<HTMLElement>(".hero-life");\n    heroes.set(owner, {\n      element: hero,\n      rect: rectOf(hero),\n      clone: cloneRendered(hero),\n      life: numberText(lifeElement?.textContent),\n      lifeElement,\n      lifeRect: lifeElement ? rectOf(lifeElement) : null,\n    });\n  });'''
          runtime = replace_once(runtime, old_snapshot, new_snapshot, 'Hero snapshot')

          hold_anchor = '''function holdStateVisual(layer: HTMLElement, destination: HTMLElement | null, face: HTMLElement, rect: RectLike, uid?: string, deferredDeath = false, levelUp = false): HeldStateVisual {\n  destination?.classList.add("hh-presentation-hidden");\n  const overlay = document.createElement("div");\n  overlay.className = `hh-flight-card hh-state-hold${deferredDeath ? " is-deferred-death" : ""}${levelUp ? " is-level-up-hold" : ""}`;\n  overlay.style.left = `${rect.left}px`;\n  overlay.style.top = `${rect.top}px`;\n  overlay.style.width = `${Math.max(1, rect.width)}px`;\n  overlay.style.height = `${Math.max(1, rect.height)}px`;\n  overlay.append(createFlightFace(cloneRendered(face)));\n  layer.append(overlay);\n  return { destination, overlay, uid, deferredDeath, levelUp, released: false };\n}\n'''
          life_helper = hold_anchor + '''\nfunction holdHeroLifeVisual(layer: HTMLElement, destination: HTMLElement, life: number, rect: RectLike): HeldStateVisual {\n  // Damage feedback must never replace the Hero portrait with a detached clone.\n  // Only the life badge is held at its exact viewport coordinates until the red\n  // delta becomes readable, leaving the portrait completely stationary.\n  destination.classList.add("hh-presentation-hidden");\n  const overlay = document.createElement("b");\n  overlay.className = "hh-hero-life-hold";\n  overlay.textContent = String(life);\n  overlay.style.left = `${rect.left}px`;\n  overlay.style.top = `${rect.top}px`;\n  overlay.style.width = `${Math.max(1, rect.width)}px`;\n  overlay.style.height = `${Math.max(1, rect.height)}px`;\n  const style = window.getComputedStyle(destination);\n  overlay.style.fontFamily = style.fontFamily;\n  overlay.style.fontSize = style.fontSize;\n  overlay.style.fontWeight = style.fontWeight;\n  overlay.style.lineHeight = style.lineHeight;\n  overlay.style.letterSpacing = style.letterSpacing;\n  overlay.style.color = style.color;\n  overlay.style.background = style.background;\n  overlay.style.border = style.border;\n  overlay.style.borderRadius = style.borderRadius;\n  overlay.style.boxShadow = style.boxShadow;\n  overlay.style.textShadow = style.textShadow;\n  layer.append(overlay);\n  return { destination, overlay, deferredDeath: false, levelUp: false, released: false };\n}\n'''
          runtime = replace_once(runtime, hold_anchor, life_helper, 'Hero life hold helper')

          old_hero_hold = '''  for (const owner of [0, 1] as const) {\n    const old = before.heroes.get(owner), fresh = after.heroes.get(owner);\n    const levelUp = Number(detail.after?.players?.[owner]?.level || 0) > Number(detail.before?.players?.[owner]?.level || 0);\n    if (!old || !fresh || old.life === fresh.life && !levelUp) continue;\n    held.push(holdStateVisual(layer, fresh.element, old.clone, old.rect, undefined, false, levelUp));\n  }'''
          new_hero_hold = '''  for (const owner of [0, 1] as const) {\n    const old = before.heroes.get(owner), fresh = after.heroes.get(owner);\n    const levelUp = Number(detail.after?.players?.[owner]?.level || 0) > Number(detail.before?.players?.[owner]?.level || 0);\n    if (!old || !fresh) continue;\n    if (levelUp) held.push(holdStateVisual(layer, fresh.element, old.clone, old.rect, undefined, false, true));\n    if (old.life !== fresh.life && old.lifeRect && fresh.lifeElement) {\n      held.push(holdHeroLifeVisual(layer, fresh.lifeElement, old.life, old.lifeRect));\n    }\n  }'''
          runtime = replace_once(runtime, old_hero_hold, new_hero_hold, 'life-only Hero hold')
          runtime_path.write_text(runtime)

          presentation_css_path = Path('app/game-presentation.css')
          presentation_css = presentation_css_path.read_text()
          css_anchor = '''.hh-state-hold {\n  filter: none;\n  pointer-events: none;\n}\n'''
          css_extra = css_anchor + '''\n.hh-hero-life-hold {\n  position: absolute;\n  display: grid;\n  place-items: center;\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n  pointer-events: none;\n  z-index: 7;\n  transform: none !important;\n  animation: none !important;\n  transition: none !important;\n  will-change: auto;\n}\n'''
          if '.hh-hero-life-hold {' not in presentation_css:
              presentation_css = replace_once(presentation_css, css_anchor, css_extra, 'Hero life hold CSS')
          presentation_css_path.write_text(presentation_css)

          ui_path = Path('app/ui-overrides.css')
          ui = ui_path.read_text()
          ui = replace_once(
              ui,
              '.screen-game .player-hero.hero-hurt>.hero-power-trigger{animation:heroDamagePulse .18s ease-out both}',
              '.screen-game .player-hero.hero-hurt>.hero-power-trigger{animation:none!important;transform:none!important;transition:none!important}',
              'disable legacy Hero motion',
          )
          pulse = '@keyframes heroDamagePulse{0%,100%{transform:translateX(0)}20%{transform:translateX(-2.5px)}40%{transform:translateX(2.5px)}62%{transform:translateX(-1.25px)}82%{transform:translateX(1.25px)}}\n'
          if pulse in ui:
              ui = ui.replace(pulse, '', 1)
          ui_path.write_text(ui)

          tests_path = Path('tests/combat-animation-flow.test.mjs')
          tests = tests_path.read_text()
          old_test = '''// These guards cover both the regular React board and the transient presentation clones.\ntest("legacy hero-hurt fallback uses only the tiny translate shake", () => {\n  const css = read("app/ui-overrides.css");\n  assert.match(css, /player-hero\\.hero-hurt>\\.hero-power-trigger\\{animation:heroDamagePulse \\.18s ease-out both\\}/);\n  const start = css.indexOf("@keyframes heroDamagePulse");\n  const end = css.indexOf("@keyframes heroDamageFlash", start);\n  const pulse = css.slice(start, end);\n  assert.match(pulse, /translateX\\(-2\\.5px\\)/);\n  assert.match(pulse, /translateX\\(2\\.5px\\)/);\n  assert.doesNotMatch(pulse, /scale\\(/);\n  assert.doesNotMatch(pulse, /translateX\\([^)]*%/);\n});'''
          new_test = '''// Direct damage must never animate or replace the Hero portrait itself.\ntest("legacy hero-hurt fallback cannot move or scale the Hero portrait", () => {\n  const css = read("app/ui-overrides.css");\n  assert.match(css, /player-hero\\.hero-hurt>\\.hero-power-trigger\\{animation:none!important;transform:none!important;transition:none!important\\}/);\n  assert.doesNotMatch(css, /@keyframes heroDamagePulse/);\n});\n\ntest("Hero damage holds only the life badge instead of cloning the Hero portrait", () => {\n  const runtime = read("app/game-presentation-runtime.tsx");\n  const css = read("app/game-presentation.css");\n  assert.match(runtime, /function holdHeroLifeVisual/);\n  assert.match(runtime, /fresh\\.lifeElement, old\\.life, old\\.lifeRect/);\n  assert.match(runtime, /Damage feedback must never replace the Hero portrait/);\n  assert.match(css, /\\.hh-hero-life-hold \\{/);\n  assert.match(css, /transform: none !important/);\n});'''
          tests = replace_once(tests, old_test, new_test, 'Hero motion regression tests')
          tests_path.write_text(tests)
          PY

      - name: Remove temporary workflow before validation
        run: git rm .github/workflows/fix-direct-hero-anchor.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical project state
        run: npm run prepare:project

      - name: Run focused presentation tests
        run: node --test tests/combat-animation-flow.test.mjs tests/presentation-final-contract.test.mjs tests/presentation-dedupe-regression.test.mjs

      - name: Run full rules suite
        run: npm run test:rules

      - name: Build production bundle
        run: npm run vercel-build

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep Hero portrait anchored on direct damage"
          git push origin HEAD:feat/presentation-system-pr1
