name: Fix stale priority tests

on:
  push:
    branches:
      - fix/cards_mechanics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Update stale rules expectations
        run: |
          sed -i 's/priority API exposes only legal accelerated cards and usable activations/priority API exposes accelerated cards but excludes ordinary permanent activations/' tests/rules-engine.test.mjs
          sed -i 's/\["playCard", "activate"\]/["playCard"]/' tests/rules-engine.test.mjs
          sed -i 's/explicitRuleIds.length, 247/explicitRuleIds.length, 248/' tests/rules-engine.test.mjs
      - name: Update stale AI timer regression
        run: |
          node scripts/update-ai-priority-test.mjs
      - name: Validate
        run: |
          npm ci
          npm run prepare:project
          node --test tests/hero-priority-response.test.mjs tests/hero-priority-ui.test.mjs tests/ai-priority-lock.test.mjs tests/rules-engine.test.mjs
          node --test tests/*.test.mjs
          npx next build
      - name: Commit clean result
        run: |
          rm .github/workflows/fix-vercel-stale-priority-test.yml
          rm scripts/update-ai-priority-test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rules-engine.test.mjs tests/ai-priority-lock.test.mjs .github/workflows/fix-vercel-stale-priority-test.yml scripts/update-ai-priority-test.mjs
          git commit -m "test: align priority regressions with authoritative flow"
          git push origin HEAD:fix/cards_mechanics
