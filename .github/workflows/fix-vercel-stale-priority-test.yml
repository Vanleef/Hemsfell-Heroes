name: Fix stale priority test

on:
  push:
    branches:
      - fix/cards_mechanics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Update stale priority regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/rules-engine.test.mjs')
          s = p.read_text()
          old_title = 'test("priority API exposes only legal accelerated cards and usable activations", () => {'
          new_title = 'test("priority API exposes accelerated cards but excludes ordinary permanent activations", () => {'
          old_assert = '  assert.deepEqual(legal.map((command) => command.type), ["playCard", "activate"]);'
          new_assert = '  assert.deepEqual(legal.map((command) => command.type), ["playCard"]);'
          if old_title not in s or old_assert not in s:
              raise SystemExit('Expected stale priority test text was not found')
          s = s.replace(old_title, new_title, 1).replace(old_assert, new_assert, 1)
          p.write_text(s)
          PY
      - name: Validate targeted and full test suite
        run: |
          npm ci
          npm run prepare:project
          node --test tests/hero-priority-response.test.mjs tests/hero-priority-ui.test.mjs tests/ai-priority-lock.test.mjs tests/rules-engine.test.mjs
          node --test tests/*.test.mjs
          npx next build
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/fix-vercel-stale-priority-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rules-engine.test.mjs .github/workflows/fix-vercel-stale-priority-test.yml
          git commit -m "test: align priority regression with hero-only activations"
          git push origin HEAD:fix/cards_mechanics
