name: Fix Rasmus deck image card
on:
  push:
    branches: [fix/cards_mechanics]
    paths: [.github/workflows/fix-rasmus-deck-image-card.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/fix-rasmus-deck-image-card.py
      - run: npm ci
      - run: node --test tests/rasmus-deck-no-images.test.mjs tests/rasmus-authoritative.test.mjs tests/rasmus-coffee-priority-regressions.test.mjs tests/rules-engine.test.mjs
      - run: npm run vercel-build
      - name: Commit repair
        run: |
          rm .github/scripts/fix-rasmus-deck-image-card.py .github/workflows/fix-rasmus-deck-image-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cards.generated.json app/rules-engine/card-rules.mjs app/page.tsx tests/rasmus-authoritative.test.mjs tests/rasmus-coffee-priority-regressions.test.mjs tests/rasmus-deck-no-images.test.mjs tests/rules-engine.test.mjs .github/scripts/fix-rasmus-deck-image-card.py .github/workflows/fix-rasmus-deck-image-card.yml
          git commit -m "fix: keep Rasmus Images out of main deck"
          git push origin HEAD:fix/cards_mechanics
# rerun after catalog-count correction
