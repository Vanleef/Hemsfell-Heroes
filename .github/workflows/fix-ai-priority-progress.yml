name: Fix AI priority progress
on:
  push:
    branches: [fix/cards_mechanics]
    paths: [.github/workflows/fix-ai-priority-progress.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/fix-ai-priority-progress.py
      - run: npm ci
      - run: chmod +x scripts/*.sh
      - run: node --test tests/ai-priority-progress.test.mjs tests/bot-priority-sync.test.mjs tests/gimble-authoritative-hero.test.mjs tests/hero-priority-response.test.mjs tests/hero-priority-ui.test.mjs
      - run: npm run build
      - name: Commit repair
        run: |
          rm .github/scripts/fix-ai-priority-progress.py .github/workflows/fix-ai-priority-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/rules-engine/priority.mjs app/ui-overrides.css tests/ai-priority-progress.test.mjs .github/scripts/fix-ai-priority-progress.py .github/workflows/fix-ai-priority-progress.yml
          git commit -m "fix: guarantee AI priority progress and lower stack badge"
          git push origin HEAD:fix/cards_mechanics
