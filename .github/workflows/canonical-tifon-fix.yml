name: Canonical Tifon Fix

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/canonical-tifon-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - name: Make Tifon canonically Neutral
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'name:"Tifon, a Peste",faction:"Vazio",color:"#353943"'
          new = 'name:"Tifon, a Peste",faction:"Neutro",color:"#777d86"'
          if old not in text:
              raise SystemExit('Canonical Tifon Vazio definition not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit canonical source fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/canonical-tifon-fix.yml
          git add app/page.tsx
          git commit -m "fix: make Tifon canonically neutral"
          git push origin HEAD:fix/cards_mechanics
