name: One-shot authoritative online client cleanup

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/one-shot-remove-legacy-online-sync.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0

      - name: Remove legacy client sync and delayed response reveal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'const RESPONSE_REVEAL_DELAY_MS=2200;\n',
              '',
              'response reveal delay constant',
          )

          replace_once(
              '''const toCanonicalGame=(source:Game)=>isHost?structuredClone(source):mirrorOnlineGame(source);\nconst fromCanonicalGame=(source:Game)=>isHost?structuredClone(source):mirrorOnlineGame(source);\n\nconst syncOnlineGame=(next:Game)=>{\n if(mode!=="online"||!roomId||!roomToken)return;\n const canonical=toCanonicalGame(next);\n syncQueueRef.current=syncQueueRef.current.then(async()=>{const baseRevision=roomRevisionRef.current;const res=await fetch(`/api/rooms/${roomId}`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"sync",token:roomToken,game:canonical,baseRevision})});const data=await res.json();if(res.ok){roomRevisionRef.current=data.revision??roomRevisionRef.current;setRoomInfo(data)}else if(data?.game){const reconciled=fromCanonicalGame(data.game);roomRevisionRef.current=data.revision??roomRevisionRef.current;setRoomInfo(data);currentGameRef.current=reconciled;setGame(reconciled);setResponseWindow(reconciled.pendingResponse??null);setRoomError(data.error==="waiting for opponent response"?"Aguardando a resposta do oponente.":"O estado da sala foi atualizado; sua ação não foi aplicada.")}}).catch(()=>setRoomError("Conexão instável. Tentando sincronizar novamente…"));\n};\n''',
              '''const fromCanonicalGame=(source:Game)=>isHost?structuredClone(source):mirrorOnlineGame(source);\n''',
              'legacy syncOnlineGame block',
          )

          replace_once(
              'g.players.forEach((p,i)=>{if(p.life<=0)g.winner=i===0?1:0});queueMicrotask(()=>syncOnlineGame(g));return g});',
              'g.players.forEach((p,i)=>{if(p.life<=0)g.winner=i===0?1:0});return g});',
              'legacy update transport',
          )

          replace_once(
              ''' const setSharedResponse=(response:PendingResponse|null,sharedAction:CombatAction|null=combatAction)=>{\n  const timed=response?{...response,deadline:response.deadline??Date.now()+(roomInfo?.settings?.responseSeconds??30)*1000}:null;\n  setResponseWindow(timed);\n  if(mode==="online"){update(g=>{g.pendingResponse=timed?{...timed,passes:timed.passes??0}:null;g.combatAction=sharedAction});return}\n''',
              ''' const setSharedResponse=(response:PendingResponse|null,sharedAction:CombatAction|null=combatAction)=>{\n  /* Online response/combat checkpoints come only from authoritative room snapshots.\n     Local callers may animate, but must never manufacture or persist priority state. */\n  if(mode==="online")return;\n  const timed=response?{...response,deadline:response.deadline??Date.now()+(roomInfo?.settings?.responseSeconds??30)*1000}:null;\n  setResponseWindow(timed);\n''',
              'setSharedResponse online mutation',
          )

          replace_once(
              ''' useEffect(()=>{if(mode!=="online"||!game)return;setCombatAction(game.combatAction??null);const pending=game.pendingResponse??null;if(!pending){setResponseWindow(null);return}if(pending.responder!==0){setResponseWindow(pending);return}/* The responder first sees the opponent's serialized card animation. */const timer=window.setTimeout(()=>setResponseWindow(pending),RESPONSE_REVEAL_DELAY_MS);return()=>window.clearTimeout(timer)},[mode,game?.combatAction,game?.pendingResponse?.action,game?.pendingResponse?.deadline,game?.pendingResponse?.responder,game?.pendingResponse?.passes]);''',
              ''' useEffect(()=>{if(mode!=="online"||!game)return;/* Priority is interaction state, not presentation timing: expose the authoritative window immediately so pass/respond controls cannot lag behind server ownership. */setCombatAction(game.combatAction??null);setResponseWindow(game.pendingResponse??null)},[mode,game?.combatAction,game?.pendingResponse?.action,game?.pendingResponse?.deadline,game?.pendingResponse?.responder,game?.pendingResponse?.passes]);''',
              'delayed online response effect',
          )

          replace_once(
              ''' useEffect(()=>{if(!isHost||!roomId||!roomToken||roomInfo?.status!=="mulligan"||roomInfo?.game||!roomInfo?.startingRole||!roomInfo?.host?.heroId||!roomInfo?.guest?.heroId)return;const active:0|1=roomInfo.startingRole==="host"?0:1;const initial=start(roomInfo.host.heroId,roomInfo.guest.heroId,active,roomInfo.settings?.startingLife??30);roomAction("initialize",{game:initial})},[isHost,roomId,roomToken,roomInfo?.status,roomInfo?.startingRole,roomInfo?.game]);\n''',
              '',
              'retired client initialize upload',
          )

          # The online client must fail closed for cards/effects that have not yet
          # been migrated to the authoritative command engine instead of applying a
          # local-only fallback that the server never sees.
          replace_once(
              '''  if(canExecuteCard(snapshot)){const policy=playTargetPolicy(snapshot),allIds=targetUids?.length?targetUids:targetUid?[targetUid]:[],sacrificeIds=allIds.filter((_,index)=>policy.steps?.[index]?.role==="sacrifice"),effectTargetIds=allIds.filter((_,index)=>{const role=policy.steps?.[index]?.role;return role!=="sacrifice"&&role!=="attachment"}),slot=fieldSlot??(snapshot.type==="Criatura"?firstFreeSlot(snapshotPlayer.board):snapshot.type==="Terreno"?0:firstFreeSlot(snapshotPlayer.support));void runRulesCommand({type:"playCard",cardId:snapshot.id,instanceId:uid(),slot,attachedTo:snapshot.type==="Artefato"?targetUid:undefined,targetIds:effectTargetIds,sacrificeIds,hasPriority:asResponse,chosenElement,selectedImageName,cafeEffect,elementalTargetId,placementZone},owner).then(accepted=>{if(accepted)showFx(fxKind,fxLabel,snapshot.name,snapshot)});return}\n  showFx(fxKind,fxLabel,snapshot.name,snapshot);''',
              '''  if(canExecuteCard(snapshot)){const policy=playTargetPolicy(snapshot),allIds=targetUids?.length?targetUids:targetUid?[targetUid]:[],sacrificeIds=allIds.filter((_,index)=>policy.steps?.[index]?.role==="sacrifice"),effectTargetIds=allIds.filter((_,index)=>{const role=policy.steps?.[index]?.role;return role!=="sacrifice"&&role!=="attachment"}),slot=fieldSlot??(snapshot.type==="Criatura"?firstFreeSlot(snapshotPlayer.board):snapshot.type==="Terreno"?0:firstFreeSlot(snapshotPlayer.support));void runRulesCommand({type:"playCard",cardId:snapshot.id,instanceId:uid(),slot,attachedTo:snapshot.type==="Artefato"?targetUid:undefined,targetIds:effectTargetIds,sacrificeIds,hasPriority:asResponse,chosenElement,selectedImageName,cafeEffect,elementalTargetId,placementZone},owner).then(accepted=>{if(accepted)showFx(fxKind,fxLabel,snapshot.name,snapshot)});return}\n  if(mode==="online"){setRoomError(`${snapshot.name} ainda não possui uma execução autoritativa no modo Online.`);return}\n  showFx(fxKind,fxLabel,snapshot.name,snapshot);''',
              'online playCard fail-closed guard',
          )

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/rules-engine.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '''  assert.match(page, /game\\?\\.pendingResponse\\?\\.passes/);\n});'''
          replacement = '''  assert.match(page, /game\\?\\.pendingResponse\\?\\.passes/);\n  assert.doesNotMatch(page, /syncOnlineGame/);\n  assert.doesNotMatch(page, /action:\\"sync\\"/);\n  assert.doesNotMatch(page, /RESPONSE_REVEAL_DELAY_MS/);\n  assert.match(page, /setCombatAction\\(game\\.combatAction\\?\\?null\\);setResponseWindow\\(game\\.pendingResponse\\?\\?null\\)/);\n});'''
          if tests.count(anchor) != 1:
              raise SystemExit(f'regression test anchor: expected exactly one match, found {tests.count(anchor)}')
          test_path.write_text(tests.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Verify cleanup markers
        run: |
          ! grep -q 'syncOnlineGame' app/page.tsx
          ! grep -q 'RESPONSE_REVEAL_DELAY_MS' app/page.tsx
          ! grep -q 'action:"sync"' app/page.tsx
          grep -q 'roomAction("command"' app/page.tsx

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-remove-legacy-online-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx tests/rules-engine.test.mjs .github/workflows/one-shot-remove-legacy-online-sync.yml
          git commit -m "refactor online client to authoritative commands only"
          git push origin HEAD:fix/cards_mechanics
