name: Fix Target Banner Safe Lane Once

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - scripts/patch-target-banner-safe-lane.mjs
      - .github/workflows/fix-target-banner-safe-lane-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - name: Apply target banner safe lane patch
        run: node scripts/patch-target-banner-safe-lane.mjs
      - name: Run focused regression
        run: node --test tests/target-banner-safe-lane-regression.test.mjs
      - name: Commit canonical fix and remove temporary patch files
        run: |
          rm .github/workflows/fix-target-banner-safe-lane-once.yml scripts/patch-target-banner-safe-lane.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/match-ui-guard.tsx app/ui-overrides.css tests/target-banner-safe-lane-regression.test.mjs .github/workflows/fix-target-banner-safe-lane-once.yml scripts/patch-target-banner-safe-lane.mjs
          git commit -m "fix: constrain target popup to board safe lane"
          git push origin HEAD:fix/cards_mechanics
