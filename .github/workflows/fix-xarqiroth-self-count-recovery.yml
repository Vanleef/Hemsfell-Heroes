name: Recover Xarqiroth self count fix
on:
  push:
    paths:
      - '.github/workflows/fix-xarqiroth-self-count-recovery.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
      - name: Apply source exclusion and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/rules-engine/engine-base.mjs')
          s=p.read_text()
          old='const candidates = entry.board.filter((card) => Array.isArray(preEntry) ? preEntry.includes(card.uid || card.id) : (card.uid || card.id) !== (source.uid || source.id));'
          new='const sourceId = source.uid || source.id;\n    const candidates = entry.board.filter((card) => (card.uid || card.id) !== sourceId && (!Array.isArray(preEntry) || preEntry.includes(card.uid || card.id)));'
          if old in s:
            s=s.replace(old,new,1)
          elif new not in s:
            raise SystemExit('target condition not found')
          p.write_text(s)
          PY
          cat > tests/xarqiroth-self-count-regression.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import cards from '../app/cards.generated.json' with { type: 'json' };
          import { compileCard } from '../app/rules-engine/compiler.mjs';
          import { executeCommand } from '../app/rules-engine/engine.mjs';

          const catalog=cards.map(compileCard);
          const byPage=(page)=>compileCard(cards.find(card=>Number(card.page)===page));
          const player=()=>({heroId:'gimble',level:1,heroXP:0,markers:{},levelUpsThisTurn:0,life:30,maxLife:30,energy:10,maxEnergy:10,reserve:0,deck:[],extraDeck:[],hand:[],board:[],support:[],terrain:null,grave:[],obscuro:[],turnCardsPlayed:0,turnSpellsPlayed:0,cardsPlayed:0,spellsPlayed:0,lifeLostThisTurn:0,lifeLossEvents:0,abilityUses:{},turnDeaths:0});
          const state=()=>({active:0,phase:'principal',round:2,events:0,cardCatalog:catalog,players:[player(),player()]});
          const unit=(card,uid,slot=0)=>({...card,uid,slot,enteredRound:1,summoning:false,exhausted:false,attackedThisTurn:false,attacksThisTurn:0,defenseUses:0,damage:0,modifiers:[],grantedKeywords:[],temporaryTags:[],markers:{}});
          const play=(game,card)=>{card.uid=`${card.id}-u`;game.players[0].hand=[card];return executeCommand(game,{type:'playCard',owner:0,instanceId:card.uid,skipPriority:true}).state};

          test('Xarqiroth excludes itself from its Dragon condition',()=>{
            let game=state();
            game.players[0].deck=[byPage(15),byPage(16),byPage(17)];
            game=play(game,byPage(7));
            assert.equal(game.players[0].hand.length,0,'Xarqiroth alone must not draw');

            game=state();
            game.players[0].board.push(unit(byPage(3),'other-dragon',0));
            game.players[0].deck=[byPage(15),byPage(16),byPage(17)];
            game=play(game,byPage(7));
            assert.equal(game.players[0].hand.length,2,'Xarqiroth draws exactly 2 with another allied Dragon already in play');
          });
          EOF
      - name: Run regression
        run: node --test tests/xarqiroth-self-count-regression.test.mjs
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-xarqiroth-self-count-recovery.yml .github/workflows/fix-xarqiroth-self-count-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/rules-engine/engine-base.mjs tests/xarqiroth-self-count-regression.test.mjs .github/workflows/fix-xarqiroth-self-count-recovery.yml .github/workflows/fix-xarqiroth-self-count-once.yml
          git commit -m 'fix: exclude Xarqiroth from its own Dragon check'
          git push origin HEAD:fix/cards_mechanics