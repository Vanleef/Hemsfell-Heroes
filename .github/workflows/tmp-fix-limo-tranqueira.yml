name: Temporary Limo and Tranqueira fix

on:
  push:
    branches:
      - design/online-priority-flow-rework

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/online-priority-flow-rework
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply safe card compatibility fixes
        run: python .github/scripts/tmp-fix-limo-tranqueira.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused regressions
        run: node --test tests/limo-tranqueira-regression.test.mjs tests/online-clock.test.mjs tests/online-reconnect-flow.test.mjs

      - name: Run rules regression suite
        run: npm run test:rules

      - name: Typecheck Online surfaces
        run: npm run typecheck:online

      - name: Commit canonical changes and remove temporary mutator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/tmp-fix-limo-tranqueira.py .github/workflows/tmp-fix-limo-tranqueira.yml
          git add app/page.tsx app/rules-engine/card-rules.mjs app/rules-engine/effects.mjs app/rules-engine/engine-base.mjs docs/online-priority-implementation.md tests/limo-tranqueira-regression.test.mjs
          git commit -m "fix: resolve Limo death burst and Tranqueira expiry" || exit 0
          git push origin HEAD:design/online-priority-flow-rework
