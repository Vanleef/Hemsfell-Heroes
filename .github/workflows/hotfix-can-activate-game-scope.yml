name: One-shot canActivateUnit hotfix

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/hotfix-can-activate-game-scope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0

      - name: Patch invalid module-scope game reference
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/page.tsx")
          source = path.read_text(encoding="utf-8")
          old = 'if(auxiliary&&(unit.exhausted||unit.summoning||unit.enteredRound===game?.round))return false;'
          new = 'if(auxiliary&&(unit.exhausted||unit.summoning))return false;'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one broken activation guard, found {count}")
          path.write_text(source.replace(old, new), encoding="utf-8")

      - name: Remove one-shot workflow and publish fix
        run: |
          rm .github/workflows/hotfix-can-activate-game-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/hotfix-can-activate-game-scope.yml
          git commit -m "fix: remove invalid game reference from activation UI"
          git push origin HEAD:fix/cards_mechanics
