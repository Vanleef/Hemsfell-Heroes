name: Fix Cafe Pingado Accelerated Once

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - scripts/patch-cafe-pingado-accelerated.mjs
      - .github/workflows/fix-cafe-pingado-accelerated-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - name: Apply canonical Cafe Pingado patch
        run: node scripts/patch-cafe-pingado-accelerated.mjs
      - name: Run focused regression
        run: node --test tests/cafe-pingado-priority-regression.test.mjs
      - name: Commit canonical fix and remove temporary patch files
        run: |
          rm .github/workflows/fix-cafe-pingado-accelerated-once.yml scripts/patch-cafe-pingado-accelerated.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cards.generated.json tests/cafe-pingado-priority-regression.test.mjs .github/workflows/fix-cafe-pingado-accelerated-once.yml scripts/patch-cafe-pingado-accelerated.mjs
          git commit -m "fix: make Cafe Pingado accelerated"
          git push origin HEAD:fix/cards_mechanics
