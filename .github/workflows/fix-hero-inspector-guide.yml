name: Fix hero inspector guide
on:
  push:
    branches: [fix/cards_mechanics]
    paths: [.github/workflows/fix-hero-inspector-guide.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/fix-hero-inspector-guide.py
      - run: npm ci
      - run: node --test tests/hero-inspector-guide.test.mjs tests/rules-engine.test.mjs
      - run: npm run vercel-build
      - name: Commit repair
        run: |
          rm .github/scripts/fix-hero-inspector-guide.py .github/workflows/fix-hero-inspector-guide.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx tests/hero-inspector-guide.test.mjs .github/scripts/fix-hero-inspector-guide.py .github/workflows/fix-hero-inspector-guide.yml
          git commit -m "fix: unify in-match hero guides"
          git push origin HEAD:fix/cards_mechanics
