name: Fix Online Combat Lock

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - scripts/fix-online-combat-lock.mjs
      - .github/workflows/fix-online-combat-lock.yml
  pull_request:
    branches:
      - fix/cards_mechanics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-online-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply combat lock fix
        run: node scripts/fix-online-combat-lock.mjs
      - name: Validate online typecheck
        run: npx tsc -p tsconfig.online.json --noEmit
      - name: Validate combat transport invariants
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const source = await readFile('app/page.tsx','utf8');
          const begin = source.slice(source.indexOf(' const beginAttack='), source.indexOf(' const chooseAttacker='));
          assert.match(begin, /if\(mode==="online"\)\{void runRulesCommand\(\{type:"declareAttack",attackerId:attackerUid\},owner\);return\}/);
          assert.ok(begin.indexOf('runRulesCommand({type:"declareAttack"') < begin.indexOf('setSharedCombat({attackerOwner:owner'));
          const combatEffect = source.slice(source.indexOf(' useEffect(()=>{\n  if(!combatAction||!game)return;'), source.indexOf(' useEffect(()=>{\n  const decision=game?.pendingDecision'));
          assert.match(combatEffect, /if\(action\.stage==="declared"\)\{if\(mode==="online"\)return;/);
          assert.equal((combatEffect.match(/type:"declareAttack"/g)||[]).length,0);
          assert.match(source, /window\.setInterval\(fn,300\)/);
          assert.match(source, /data\?\.error==="stale revision"/);
          assert.match(source, /staleRetries<3/);
          const assisted = source.slice(source.indexOf(' useEffect(()=>{const pending=game?.pendingResponse;'), source.indexOf(' const selectedDeck='));
          assert.match(assisted, /currentGameRef\.current\?\.pendingResponse/);
          assert.doesNotMatch(assisted, /responseWindow\?\.responder/);
          console.log('online combat transport invariants OK');
          NODE
      - name: Commit validated fix
        run: |
          rm -f scripts/fix-online-combat-lock.mjs .github/workflows/fix-online-combat-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: make online combat declaration authoritative"
          git push origin HEAD:fix/cards_mechanics
