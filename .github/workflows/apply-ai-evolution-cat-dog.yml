name: Apply AI evolution and Cat Dog patch

on:
  pull_request:
    branches:
      - ai/advanced-opponent-system
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: ai/advanced-opponent-system
          fetch-depth: 0

      - name: Apply canonical source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              p.write_text(text.replace(old,new,1))

          patch('app/rules-engine/engine-base.mjs',
          'import { abilitiesForLevel, getExplicitCardRule } from "./card-rules.mjs";\n',
          'import { abilitiesForLevel, getExplicitCardRule } from "./card-rules.mjs";\nimport { canEvolveHero, evolveHero } from "./hero-evolution.mjs";\n',
          'engine evolution import')

          old='''function baseAttack(state, unit, owner) {
            if (!unit?.suffocated && unit?.dynamicStats?.subtypeCountAcrossFields) return state.players.flatMap(permanentUnits).filter((card) => subtype(card, unit.dynamicStats.subtypeCountAcrossFields)).length;
            if (!unit?.suffocated && unit?.dynamicStats?.attackSubtype) return state.players.flatMap(permanentUnits).filter((card) => subtype(card, unit.dynamicStats.attackSubtype)).length;
            if (!unit?.suffocated && unit?.dynamicStats?.cardsMilledThisTurn) return state.players[owner].cardsMilledThisTurn || 0;
            if (!unit?.suffocated && unit?.dynamicStats?.copyStrongestAlly) { const strongest = strongestAlly(state, unit, owner); return strongest ? baseAttack(state, strongest, owner) : 0; }
            const support = unit?.suffocated ? {attack:0} : adjacentSupportBonus(state, unit, owner), aura = subtypeAuraBonus(state, unit, owner); return Math.max(0, (unit?.atk || 0) + support.attack + aura.attack + (unit?.modifiers || []).filter((value) => modifierApplies(state, owner, value, unit)).reduce((sum, value) => sum + (value.attack || 0), 0));
          }
          function effectiveAttack(state, unit, owner) {
            if (unit?.attackZeroUntilOwnerMaintenance != null || unit?.frozen || hasKeyword(unit, /congelado/i)) return 0;
            if (!unit?.suffocated && unit?.dynamicStats?.bothFromAttack) { const strongest = state.players[owner].board.filter((candidate) => candidate !== unit).reduce((best, candidate) => Math.max(best, baseAttack(state, candidate, owner)), 0); return strongest; }
            return baseAttack(state, unit, owner);
          }
          function effectiveHealth(state, unit, owner) {
            if (!unit?.suffocated && unit?.dynamicStats?.subtypeCountAcrossFields) return Math.max(1, state.players.flatMap(permanentUnits).filter((card) => subtype(card, unit.dynamicStats.subtypeCountAcrossFields)).length);
            if (!unit?.suffocated && unit?.dynamicStats?.healthSubtype) return Math.max(1, state.players.flatMap(permanentUnits).filter((card) => subtype(card, unit.dynamicStats.healthSubtype)).length);
            if (!unit?.suffocated && unit?.dynamicStats?.copyStrongestAlly) { const strongest = strongestAlly(state, unit, owner); return strongest ? effectiveHealth(state, strongest, owner) : 1; }
            if (!unit?.suffocated && unit?.dynamicStats?.bothFromAttack) { const strongest = state.players[owner].board.filter((candidate) => candidate !== unit).reduce((best, candidate) => Math.max(best, baseAttack(state, candidate, owner)), 0); return Math.max(1, strongest); }
            const support = unit?.suffocated ? {health:0} : adjacentSupportBonus(state, unit, owner), aura = subtypeAuraBonus(state, unit, owner);
            return Math.max(0, (unit?.hp || 1) + support.health + aura.health + (unit?.modifiers || []).filter((value) => modifierApplies(state, owner, value, unit)).reduce((sum, value) => sum + (value.health || 0), 0));
          }'''
          new='''function subtypeCountAcrossFields(state, subtypeName) { return state.players.flatMap(permanentUnits).filter((card) => subtype(card, subtypeName)).length; }
          function baseAttack(state, unit, owner) {
            if (!unit?.suffocated && unit?.dynamicStats?.cardsMilledThisTurn) return state.players[owner].cardsMilledThisTurn || 0;
            if (!unit?.suffocated && unit?.dynamicStats?.copyStrongestAlly) { const strongest = strongestAlly(state, unit, owner); return strongest ? baseAttack(state, strongest, owner) : 0; }
            let base = unit?.atk || 0;
            if (!unit?.suffocated && unit?.dynamicStats?.subtypeCountAcrossFields) base = subtypeCountAcrossFields(state, unit.dynamicStats.subtypeCountAcrossFields);
            else if (!unit?.suffocated && unit?.dynamicStats?.attackSubtype) base += subtypeCountAcrossFields(state, unit.dynamicStats.attackSubtype);
            const support = unit?.suffocated ? {attack:0} : adjacentSupportBonus(state, unit, owner), aura = subtypeAuraBonus(state, unit, owner);
            return Math.max(0, base + support.attack + aura.attack + (unit?.modifiers || []).filter((value) => modifierApplies(state, owner, value, unit)).reduce((sum, value) => sum + (value.attack || 0), 0));
          }
          function effectiveAttack(state, unit, owner) {
            if (unit?.attackZeroUntilOwnerMaintenance != null || unit?.frozen || hasKeyword(unit, /congelado/i)) return 0;
            if (!unit?.suffocated && unit?.dynamicStats?.bothFromAttack) { const strongest = state.players[owner].board.filter((candidate) => candidate !== unit).reduce((best, candidate) => Math.max(best, baseAttack(state, candidate, owner)), 0); return strongest; }
            return baseAttack(state, unit, owner);
          }
          function effectiveHealth(state, unit, owner) {
            if (!unit?.suffocated && unit?.dynamicStats?.copyStrongestAlly) { const strongest = strongestAlly(state, unit, owner); return strongest ? effectiveHealth(state, strongest, owner) : 1; }
            if (!unit?.suffocated && unit?.dynamicStats?.bothFromAttack) { const strongest = state.players[owner].board.filter((candidate) => candidate !== unit).reduce((best, candidate) => Math.max(best, baseAttack(state, candidate, owner)), 0); return Math.max(1, strongest); }
            let base = unit?.hp || 1;
            if (!unit?.suffocated && unit?.dynamicStats?.subtypeCountAcrossFields) base = Math.max(1, subtypeCountAcrossFields(state, unit.dynamicStats.subtypeCountAcrossFields));
            else if (!unit?.suffocated && unit?.dynamicStats?.healthSubtype) base += subtypeCountAcrossFields(state, unit.dynamicStats.healthSubtype);
            const support = unit?.suffocated ? {health:0} : adjacentSupportBonus(state, unit, owner), aura = subtypeAuraBonus(state, unit, owner);
            return Math.max(0, base + support.health + aura.health + (unit?.modifiers || []).filter((value) => modifierApplies(state, owner, value, unit)).reduce((sum, value) => sum + (value.health || 0), 0));
          }'''
          patch('app/rules-engine/engine-base.mjs',old,new,'dynamic subtype stats')

          patch('app/rules-engine/engine-base.mjs',
          '''function cleanupLethal(state, stack) {
            state.players.forEach((entry, owner) => {
              for (const unit of [...entry.board]) {
                const modifiers = (unit.modifiers || []).filter((item) => modifierApplies(state, owner, item)).reduce((sum, item) => sum + (item.health || 0), 0);
                const lethal = (unit.damage || 0) >= (unit.hp || 1) + modifiers;''',
          '''function cleanupLethal(state, stack) {
            const boardCountBefore = state.players.reduce((sum, entry) => sum + (entry.board || []).length, 0);
            state.players.forEach((entry, owner) => {
              for (const unit of [...entry.board]) {
                const lethalHealth = effectiveHealth(state, unit, owner);
                const lethal = (unit.damage || 0) >= lethalHealth;''',
          'dynamic lethal health')
          patch('app/rules-engine/engine-base.mjs',
          '      if (protector) { unit.damage = Math.max(0, (unit.hp || 1) + modifiers - 1); claimUsage(state, protector, owner, { id: "dragon-lethal-protection", usageLimit: { count: 1, period: "turn" } }); continue; }',
          '      if (protector) { unit.damage = Math.max(0, lethalHealth - 1); claimUsage(state, protector, owner, { id: "dragon-lethal-protection", usageLimit: { count: 1, period: "turn" } }); continue; }',
          'dynamic lethal dragon protection')
          patch('app/rules-engine/engine-base.mjs',
          '      if (!state.pendingDecision && zayanReplacements.length) { unit.damage = Math.max(0, (unit.hp || 1) + modifiers - 1); state.pendingDecision = { kind: "zayan-destruction-replacement", owner, effect: { type: "zayanDestructionReplacement", originalId: unit.uid || unit.id, lethal: true, choices: zayanReplacements.map((card) => card.uid || card.id) }, context: { owner, decisionOwner: owner, sourceId: unit.lastDamagedBy?.sourceId }, sourceName: "Zayan II" }; continue; }',
          '      if (!state.pendingDecision && zayanReplacements.length) { unit.damage = Math.max(0, lethalHealth - 1); state.pendingDecision = { kind: "zayan-destruction-replacement", owner, effect: { type: "zayanDestructionReplacement", originalId: unit.uid || unit.id, lethal: true, choices: zayanReplacements.map((card) => card.uid || card.id) }, context: { owner, decisionOwner: owner, sourceId: unit.lastDamagedBy?.sourceId }, sourceName: "Zayan II" }; continue; }',
          'dynamic lethal zayan replacement')
          patch('app/rules-engine/engine-base.mjs',
          '''  });
          }

          function resetCardForZone(state, card) {''',
          '''  });
            const boardCountAfter = state.players.reduce((sum, entry) => sum + (entry.board || []).length, 0);
            if (!state.pendingDecision && boardCountAfter < boardCountBefore) cleanupLethal(state, stack);
          }

          function resetCardForZone(state, card) {''',
          'dynamic lethal fixed point')

          patch('app/rules-engine/engine-base.mjs',
          '    if (item.kind === "command") {\n      if (item.command.type === "passPriority") {',
          '    if (item.kind === "command") {\n      if (item.command.type === "evolveHero") {\n        if (state.pendingResponse || state.pendingAction || state.pendingDecision) throw new RulesViolation("hero-evolution-window-busy");\n        if (!canEvolveHero(state, item.command.owner) || !evolveHero(state, item.command.owner)) throw new RulesViolation("hero-evolution-unavailable");\n        const evolved = state.players[item.command.owner];\n        actionLabel = `evolve-${evolved.heroId}-level-${evolved.level}`;\n      } else if (item.command.type === "passPriority") {',
          'engine evolve command')

          patch('app/rules-engine/ai.mjs',
          'import { hasSubtype } from "./subtypes.mjs";\n',
          'import { hasSubtype } from "./subtypes.mjs";\nimport { canEvolveHero } from "./hero-evolution.mjs";\n',
          'AI evolution import')
          patch('app/rules-engine/ai.mjs',
          '  if (state.phase === "principal") {\n    for (const source of permanentUnits(entry)) {',
          '  if (state.phase === "principal") {\n    if (canEvolveHero(state, owner)) candidates.push({ type: "evolveHero", owner });\n    for (const source of permanentUnits(entry)) {',
          'AI evolution candidate')

          patch('app/rules-engine/ai-system/controller.ts',
          'const actionPriority = (action: AIAction) => action.type === "attack" ? 0 : action.type === "activate" || action.type === "activateHero" ? 1 : action.type === "playCard" ? 2 : action.type === "resolveDecision" ? 3 : action.type === "passPriority" ? 4 : 5;',
          'const actionPriority = (action: AIAction) => action.type === "attack" ? 0 : action.type === "activate" || action.type === "activateHero" ? 1 : action.type === "playCard" ? 2 : action.type === "resolveDecision" ? 3 : action.type === "evolveHero" ? 4 : action.type === "passPriority" ? 5 : 6;',
          'advanced AI evolution priority')

          patch('app/rules-engine/ai-system/evaluator.ts',
          '    const synergy = (synergyScore(me) - synergyScore(foe)) * w.synergy;',
          '    const heroLevelValue = (Number(me.level || 1) - Number(foe.level || 1)) * 4.5;\n    const synergy = (synergyScore(me) - synergyScore(foe)) * w.synergy + heroLevelValue;',
          'hero level evaluation')

          patch('app/page.tsx',
          'catsEnteredThisTurn:number;elementChain?:',
          'catsEnteredThisTurn:number;fieldSubtypeCounts?:Record<string,number>;elementChain?:',
          'Player subtype count cache')

          patch('app/page.tsx',
          'const finiteStat=(value:unknown,fallback=0)=>{const number=Number(value);return Number.isFinite(number)?number:fallback};\nconst statModifiers=',
          '''const finiteStat=(value:unknown,fallback=0)=>{const number=Number(value);return Number.isFinite(number)?number:fallback};
          const syncDynamicFieldCounts=(g:Game)=>{const field=g.players.flatMap(player=>[...player.board,...player.support,...(player.terrain?[player.terrain]:[])]),wanted=new Set<string>(["Gato","Cachorro"]);field.forEach(unit=>{const dynamic=(unit as any).dynamicStats;if(dynamic?.subtypeCountAcrossFields)wanted.add(dynamic.subtypeCountAcrossFields);if(dynamic?.attackSubtype)wanted.add(dynamic.attackSubtype);if(dynamic?.healthSubtype)wanted.add(dynamic.healthSubtype)});const counts=Object.fromEntries([...wanted].map(subtype=>[subtype,field.filter(card=>hasSubtype(card,subtype)).length]));g.players.forEach(player=>{player.fieldSubtypeCounts={...counts}})};
          const dynamicAttackBase=(u:Unit,p?:Player)=>{const dynamic=(u as any).dynamicStats;if(!u.suffocated&&dynamic?.subtypeCountAcrossFields)return finiteStat(p?.fieldSubtypeCounts?.[dynamic.subtypeCountAcrossFields],finiteStat(u.atk));if(!u.suffocated&&dynamic?.attackSubtype)return finiteStat(u.atk)+finiteStat(p?.fieldSubtypeCounts?.[dynamic.attackSubtype]);return finiteStat(u.atk)};
          const dynamicHealthBase=(u:Unit,p?:Player)=>{const dynamic=(u as any).dynamicStats;if(!u.suffocated&&dynamic?.subtypeCountAcrossFields)return Math.max(1,finiteStat(p?.fieldSubtypeCounts?.[dynamic.subtypeCountAcrossFields],finiteStat(u.hp,1)));if(!u.suffocated&&dynamic?.healthSubtype)return finiteStat(u.hp,1)+finiteStat(p?.fieldSubtypeCounts?.[dynamic.healthSubtype]);return finiteStat(u.hp,1)};
          const statModifiers=''',
          'client dynamic stat helpers')

          patch('app/page.tsx',
          'const currentHp=(u:Unit,p?:Player)=>{const modifier=statModifiers(p,u);return finiteStat(u.hp,1)+modifier.hp-finiteStat(u.damage)};\nconst currentAtk=(u:Unit,p?:Player)=>{const modifier=statModifiers(p,u);return u.frozen?0:Math.max(0,finiteStat(u.atk)+modifier.atk)};',
          'const currentHp=(u:Unit,p?:Player)=>{const modifier=statModifiers(p,u);return dynamicHealthBase(u,p)+modifier.hp-finiteStat(u.damage)};\nconst currentAtk=(u:Unit,p?:Player)=>{const modifier=statModifiers(p,u);return u.frozen?0:Math.max(0,dynamicAttackBase(u,p)+modifier.atk)};',
          'client dynamic current stats')

          patch('app/page.tsx',
          'fn(g);g.players.forEach(player=>player.board.filter',
          'fn(g);syncDynamicFieldCounts(g);g.players.forEach(player=>player.board.filter',
          'local update dynamic count refresh')
          patch('app/page.tsx',
          'removeDead(g,(owner,card)=>resolveText(g,owner,card));g.players.forEach((p,i)=>',
          'removeDead(g,(owner,card)=>resolveText(g,owner,card));syncDynamicFieldCounts(g);removeDead(g,(owner,card)=>resolveText(g,owner,card));syncDynamicFieldCounts(g);g.players.forEach((p,i)=>',
          'local dynamic lethal refresh')
          patch('app/page.tsx',
          'const next=executeCommand(current,{...command,owner},{priority:true}).state as Game;currentGameRef.current=next;',
          'const next=executeCommand(current,{...command,owner},{priority:true}).state as Game;syncDynamicFieldCounts(next);currentGameRef.current=next;',
          'rules command dynamic count refresh')

          old_level='const levelUp=()=>{if(!game||game.active!==0)return;const p=game.players[0],targets=levelTargets(p),need=targets[p.level-1]??999,cost=p.level===1?2:3,progress=heroEvolutionProgress(p);if(p.level>=3||progress<need||p.energy+p.reserve<cost||p.levelUpsThisTurn>0)return;showFx("ability","ASCENSÃO DO HERÓI",`${deckById(p.heroId).name} alcançou o nível ${p.level+1}`);update(g=>{const current=g.players[0],fromEnergy=Math.min(current.energy,cost),fromReserve=cost-fromEnergy;current.energy-=fromEnergy;current.reserve=Math.max(0,current.reserve-fromReserve);current.level++;current.levelUpsThisTurn++;log(g,`${deckById(current.heroId).name} evoluiu para o nível ${current.level}. O limite de uma evolução neste turno foi usado.`,"effect")});setSharedResponse({responder:1,actor:0,action:"evolução do herói"})};'
          new_level='const levelUp=()=>{if(!game||game.active!==0)return;const p=game.players[0],targets=levelTargets(p),need=targets[p.level-1]??999,cost=p.level===1?2:3,progress=heroEvolutionProgress(p);if(p.level>=3||progress<need||p.energy+p.reserve<cost||p.levelUpsThisTurn>0)return;showFx("ability","ASCENSÃO DO HERÓI",`${deckById(p.heroId).name} alcançou o nível ${p.level+1}`);void runRulesCommand({type:"evolveHero"},0).then(accepted=>{if(accepted)setSharedResponse({responder:1,actor:0,action:"evolução do herói"})})};'
          patch('app/page.tsx',old_level,new_level,'human authoritative evolution')

          old_auto='   const evolutionTargets=levelTargets(game.players[1]),evolutionNeed=evolutionTargets[game.players[1].level-1]??999,evolutionCost=game.players[1].level===1?2:3;\n   if(game.phase==="principal"&&game.players[1].level<3&&game.players[1].levelUpsThisTurn===0&&heroEvolutionProgress(game.players[1])>=evolutionNeed&&game.players[1].energy+game.players[1].reserve>=evolutionCost){update(g=>{const p=g.players[1],fromEnergy=Math.min(p.energy,evolutionCost);p.energy-=fromEnergy;p.reserve-=evolutionCost-fromEnergy;p.level++;p.levelUpsThisTurn++;log(g,`A IA evoluiu ${deckById(p.heroId).name} para o nível ${p.level}.`,"effect")});return}\n'
          patch('app/page.tsx',old_auto,'','remove page-level automatic AI evolution')

          patch('app/page.tsx',
          '    if(command.type==="playCard"){const card=currentPlayer.hand.find(item=>item.id===command.cardId);if(card){const kind:VisualFx["kind"]=card.type==="Criatura"?"summon":card.type==="Feitiço"?"spell":card.type==="Terreno"?"terrain":"artifact";showFx(kind,"AÇÃO DO OPONENTE",card.name,card)}}\n    void runRulesCommand(command,1)',
          '    if(command.type==="playCard"){const card=currentPlayer.hand.find(item=>item.id===command.cardId);if(card){const kind:VisualFx["kind"]=card.type==="Criatura"?"summon":card.type==="Feitiço"?"spell":card.type==="Terreno"?"terrain":"artifact";showFx(kind,"AÇÃO DO OPONENTE",card.name,card)}}\n    if(command.type==="evolveHero")showFx("ability","ASCENSÃO DO OPONENTE",`${deckById(currentPlayer.heroId).name} evolui para o nível ${currentPlayer.level+1}`)\n    void runRulesCommand(command,1)',
          'bot evolution visual')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate advanced AI types
        run: npm run typecheck:ai

      - name: Run node regression suite
        run: npm run test:node

      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-ai-evolution-cat-dog.yml

      - name: Commit canonical integration
        run: |
          git config user.name "Hemsfell CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: make AI evolution strategic and fix Cat Dog stats"
          git push origin HEAD:ai/advanced-opponent-system
