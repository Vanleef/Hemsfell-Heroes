name: Fix Easy Known Sweeper Safety

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - scripts/fix-easy-known-sweeper-overextension.mjs
      - .github/workflows/fix-easy-overextension.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Easy known-sweeper safety fix
        run: node scripts/fix-easy-known-sweeper-overextension.mjs
      - name: Remove temporary migration and diagnostic files
        run: |
          rm -f scripts/fix-easy-known-sweeper-overextension.mjs
          rm -f .github/workflows/fix-easy-overextension.yml
          rm -f .github/workflows/ai-overextension-diagnostic.yml
      - name: Validate AI safety contract
        run: node --test tests/advanced-ai.test.mjs
      - name: Validate strategic benchmark
        run: npm run ai:calibrate:benchmark
      - name: Validate rules suite
        run: npm run test:rules
      - name: Validate production build
        run: npm run vercel-build
      - name: Commit validated fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: avoid Easy overextension into known sweepers"
          git push origin HEAD:feat/web-card-game-quality-foundation
