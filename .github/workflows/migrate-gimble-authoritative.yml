name: One-shot Gimble authoritative migration

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/migrate-gimble-authoritative.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - run: python .github/scripts/migrate-gimble-hero-authoritative.py
      - run: |
          rm .github/workflows/migrate-gimble-authoritative.yml
          rm .github/scripts/migrate-gimble-hero-authoritative.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rules-engine/card-rules.mjs app/rules-engine/engine-base.mjs app/rules-engine/priority.mjs app/page.tsx tests/gimble-authoritative-hero.test.mjs .github/workflows/migrate-gimble-authoritative.yml .github/scripts/migrate-gimble-hero-authoritative.py
          git commit -m "fix: migrate Gimble II to authoritative hero engine"
          git push origin HEAD:fix/cards_mechanics
