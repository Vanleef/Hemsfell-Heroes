name: Validate Gimble authoritative migration

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/validate-gimble-authoritative.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Remove one-shot validator
        run: |
          rm .github/workflows/validate-gimble-authoritative.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-gimble-authoritative.yml
          git commit -m "chore: remove Gimble migration validator"
          git push origin HEAD:fix/cards_mechanics
