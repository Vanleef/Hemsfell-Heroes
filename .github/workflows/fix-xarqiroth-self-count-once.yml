name: Fix Xarqiroth self count once
on:
  push:
    paths:
      - '.github/workflows/fix-xarqiroth-self-count-once.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
      - name: Exclude source from other-subtype condition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/rules-engine/engine-base.mjs')
          s=p.read_text()
          old='const candidates = entry.board.filter((card) => Array.isArray(preEntry) ? preEntry.includes(card.uid || card.id) : (card.uid || card.id) !== (source.uid || source.id));'
          new='const sourceId = source.uid || source.id;\n    const candidates = entry.board.filter((card) => (card.uid || card.id) !== sourceId && (!Array.isArray(preEntry) || preEntry.includes(card.uid || card.id)));'
          if old not in s:
            raise SystemExit('target condition not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Add and run regression
        shell: bash
        run: |
          cat > tests/xarqiroth-self-count-regression.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import cards from '../app/cards.generated.json' with { type: 'json' };
          import { compileCardCatalog, executeCommand } from '../app/rules-engine/engine.mjs';

          const catalog=compileCardCatalog(cards);
          const byPage=(page)=>structuredClone(catalog.find(card=>Number(card.page)===page));
          const player=()=>({life:30,energy:10,maxEnergy:10,reserve:0,hand:[],deck:[],grave:[],board:[],support:[],terrain:null,extraDeck:[],abilityUses:{},level:1,heroXP:0,turnCardsPlayed:0,turnSpellsPlayed:0,turnDeaths:0,lifeLostThisTurn:0,lifeLossEvents:0});
          const state=()=>({players:[player(),player()],active:0,phase:'principal',round:1,events:0,cardCatalog:catalog,stack:[],log:[]});
          const play=(game, card)=>{card.uid=`${card.id}-u`;game.players[0].hand=[card];return executeCommand(game,{type:'playCard',owner:0,instanceId:card.uid,skipPriority:true}).state};

          test('Xarqiroth does not count itself, but counts another allied Dragon',()=>{
            let game=state();
            game.players[0].deck=[byPage(15),byPage(16),byPage(17)];
            const before=game.players[0].hand.length;
            game=play(game,byPage(7));
            assert.equal(game.players[0].hand.length,before,'Xarqiroth alone must not draw');

            game=state();
            const other=byPage(3); other.uid='other-dragon'; other.slot=0; other.summoning=false;
            game.players[0].board=[other];
            game.players[0].deck=[byPage(15),byPage(16),byPage(17)];
            const beforeWithDragon=game.players[0].hand.length;
            game=play(game,byPage(7));
            assert.equal(game.players[0].hand.length,beforeWithDragon+2,'Xarqiroth must draw 2 when another allied Dragon already exists');
          });
          EOF
          node --test tests/xarqiroth-self-count-regression.test.mjs
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/fix-xarqiroth-self-count-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/rules-engine/engine-base.mjs tests/xarqiroth-self-count-regression.test.mjs .github/workflows/fix-xarqiroth-self-count-once.yml
          git commit -m 'fix: exclude Xarqiroth from its own condition'
          git push origin HEAD:fix/cards_mechanics