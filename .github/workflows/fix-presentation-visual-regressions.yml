name: Fix presentation visual regressions

on:
  push:
    branches:
      - feat/presentation-system-pr1

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply visual regression fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          runtime_path = Path("app/game-presentation-runtime.tsx")
          runtime = runtime_path.read_text()

          helper_anchor = "function cloneRendered(element: HTMLElement) {"
          helper = '''function freezePresentationCardMetrics(source: HTMLElement, clone: HTMLElement) {
            const sourceCard = source.matches(".original-card") ? source : source.querySelector<HTMLElement>(".original-card");
            const cloneCard = clone.matches(".original-card") ? clone : clone.querySelector<HTMLElement>(".original-card");
            if (!sourceCard || !cloneCard) return;
            const cardRect = sourceCard.getBoundingClientRect();
            if (cardRect.width <= 0 || cardRect.height <= 0) return;
            for (const selector of [".live-atk", ".live-hp"] as const) {
              const sourceNode = sourceCard.querySelector<HTMLElement>(selector);
              const cloneNode = cloneCard.querySelector<HTMLElement>(selector);
              if (!sourceNode || !cloneNode) continue;
              const rect = sourceNode.getBoundingClientRect();
              if (rect.width <= 0 || rect.height <= 0) continue;
              const style = window.getComputedStyle(sourceNode);
              cloneNode.style.boxSizing = "border-box";
              cloneNode.style.left = `${rect.left - cardRect.left}px`;
              cloneNode.style.top = `${rect.top - cardRect.top}px`;
              cloneNode.style.right = "auto";
              cloneNode.style.bottom = "auto";
              cloneNode.style.width = `${rect.width}px`;
              cloneNode.style.height = `${rect.height}px`;
              cloneNode.style.fontSize = style.fontSize;
              cloneNode.style.lineHeight = style.lineHeight === "normal" ? "1" : style.lineHeight;
              cloneNode.style.transform = "none";
              cloneNode.style.animation = "none";
              cloneNode.style.transition = "none";
            }
          }

          '''
          if "function freezePresentationCardMetrics(" not in runtime:
              assert helper_anchor in runtime
              runtime = runtime.replace(helper_anchor, helper + helper_anchor, 1)

          old_remove = '  clone.classList.remove("hh-presentation-hidden", "damage-hit", "is-selected");'
          new_remove = '''  const transientClasses = ["hh-presentation-hidden", "damage-hit", "is-selected", "is-impacting", "combat-attack-ready", "target-ally", "target-enemy"];
            clone.classList.remove(...transientClasses);
            clone.querySelectorAll<HTMLElement>(".damage-hit,.is-selected,.is-impacting,.combat-attack-ready,.target-ally,.target-enemy").forEach((node) => node.classList.remove(...transientClasses));'''
          if old_remove in runtime:
              runtime = runtime.replace(old_remove, new_remove, 1)
          assert '"is-impacting"' in runtime

          return_anchor = "  return clone;\n}\n\nfunction domCard"
          if "freezePresentationCardMetrics(element, clone);" not in runtime:
              assert return_anchor in runtime
              runtime = runtime.replace(return_anchor, "  freezePresentationCardMetrics(element, clone);\n  return clone;\n}\n\nfunction domCard", 1)

          shake_start = runtime.index("async function animateHeroShake(")
          shake_end = runtime.index("\n\nasync function floatingLabel", shake_start)
          new_shake = '''async function animateHeroShake(held: HeldStateVisual[], before: DomSnapshot, after: DomSnapshot) {
            const jobs: Promise<unknown>[] = [];
            for (const owner of [0, 1] as const) {
              const old = before.heroes.get(owner), fresh = after.heroes.get(owner);
              if (!old || !fresh || fresh.life >= old.life) continue;
              const visual = held.find((candidate) => candidate.destination === fresh.element && !candidate.deferredDeath);
              const node = visual?.overlay.querySelector<HTMLElement>(".hero-power-trigger")
                || fresh.element.querySelector<HTMLElement>(".hero-power-trigger")
                || visual?.overlay
                || fresh.element;
              node.classList.add("hh-hero-impact");
              const animation = node.animate([
                { transform: "translateX(0)" },
                { offset: .2, transform: "translateX(-2.5px)" },
                { offset: .4, transform: "translateX(2.5px)" },
                { offset: .62, transform: "translateX(-1.25px)" },
                { offset: .82, transform: "translateX(1.25px)" },
                { transform: "translateX(0)" },
              ], { duration: prefersReducedMotion() ? 80 : 165, easing: "ease-out" });
              jobs.push(animation.finished.catch(() => undefined).finally(() => node.classList.remove("hh-hero-impact")));
            }
            await Promise.all(jobs);
          }'''
          runtime = runtime[:shake_start] + new_shake + runtime[shake_end:]
          runtime_path.write_text(runtime)

          css_path = Path("app/game-presentation.css")
          css = css_path.read_text()
          badge_rule = '''/* Presentation clones live outside the board container. Freeze the captured
             attack/health badge geometry and never inherit legacy impact pulses. */
          .hh-flight-face :is(.live-atk, .live-hp) {
            max-width: none !important;
            max-height: none !important;
            transform: none !important;
            animation: none !important;
            transition: none !important;
          }

          '''
          if ".hh-flight-face :is(.live-atk, .live-hp)" not in css:
              anchor = ".hh-flight-card.is-cast {"
              assert anchor in css
              css = css.replace(anchor, badge_rule + anchor, 1)
          css_path.write_text(css)

          command_path = Path("app/command-bar-fixes.css")
          command = command_path.read_text()
          replacements = [
            ("font-size:clamp(.74rem,min(.88vw,1.56dvh),1rem)!important;", "font-size:clamp(.74rem,min(.88vw,1.56dvh),.92rem)!important;"),
            ("font-size:clamp(.62rem,min(.72vw,1.28dvh),.78rem)!important;", "font-size:clamp(.62rem,min(.72vw,1.28dvh),.74rem)!important;"),
            ("font-size:clamp(.7rem,min(.8vw,1.42dvh),.92rem)!important;", "font-size:clamp(.7rem,min(.8vw,1.42dvh),.86rem)!important;"),
            ("font-size:clamp(.66rem,min(.74vw,1.32dvh),.86rem)!important;", "font-size:clamp(.66rem,min(.74vw,1.32dvh),.8rem)!important;"),
          ]
          for old, new in replacements:
              if old in command:
                  command = command.replace(old, new, 1)
              assert new in command
          command_path.write_text(command)

          test_path = Path("tests/combat-animation-flow.test.mjs")
          test = test_path.read_text()
          hero_start = test.index('test("direct hero damage only shakes the anchored presentation clone"')
          hero_end = test.index('\n\ntest("spell flights are physically deduplicated', hero_start)
          hero_test = '''test("direct hero damage only shakes the anchored presentation clone", () => {
            const runtime = read("app/game-presentation-runtime.tsx");
            const start = runtime.indexOf("async function animateHeroShake");
            const end = runtime.indexOf("async function floatingLabel", start);
            const shake = runtime.slice(start, end);
            assert.match(shake, /querySelector<HTMLElement>\\(\"\\.hero-power-trigger\"\\)/);
            assert.match(shake, /translateX\\(-2\\.5px\\)/);
            assert.match(shake, /translateX\\(2\\.5px\\)/);
            assert.doesNotMatch(shake, /translate3d\\(/);
            assert.doesNotMatch(shake, /scale\\(/);
            assert.doesNotMatch(shake, /style\\.(left|top)\\s*=/);
            assert.doesNotMatch(shake, /append\\(|remove\\(\\)/);
          });'''
          test = test[:hero_start] + hero_test + test[hero_end:]

          if 'test("presentation clones preserve live stat badge geometry"' not in test:
              test += '''

          test("presentation clones preserve live stat badge geometry", () => {
            const runtime = read("app/game-presentation-runtime.tsx");
            const css = read("app/game-presentation.css");
            assert.match(runtime, /function freezePresentationCardMetrics/);
            assert.match(runtime, /\[\"\\.live-atk\", \"\\.live-hp\"\]/);
            assert.match(runtime, /freezePresentationCardMetrics\\(element, clone\\)/);
            assert.match(runtime, /\"is-impacting\"/);
            assert.match(css, /\\.hh-flight-face :is\\(\\.live-atk, \\.live-hp\\)/);
            assert.match(css, /animation: none !important/);
          });

          test("command bar caps remain compact at large viewport sizes", () => {
            const css = read("app/command-bar-fixes.css");
            assert.match(css, /font-size:clamp\\(\\.74rem,min\\(\\.88vw,1\\.56dvh\\),\\.92rem\\)!important/);
            assert.match(css, /font-size:clamp\\(\\.62rem,min\\(\\.72vw,1\\.28dvh\\),\\.74rem\\)!important/);
            assert.match(css, /font-size:clamp\\(\\.7rem,min\\(\\.8vw,1\\.42dvh\\),\\.86rem\\)!important/);
            assert.match(css, /font-size:clamp\\(\\.66rem,min\\(\\.74vw,1\\.32dvh\\),\\.8rem\\)!important/);
          });'''
          test_path.write_text(test)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Prepare project
        run: npm run prepare:project

      - name: Focused presentation tests
        run: node --test tests/combat-animation-flow.test.mjs tests/presentation-dedupe-regression.test.mjs

      - name: Rules suite
        run: npm run test:rules

      - name: Production build
        run: npm run vercel-build

      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/fix-presentation-visual-regressions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game-presentation-runtime.tsx app/game-presentation.css app/command-bar-fixes.css tests/combat-animation-flow.test.mjs .github/workflows/fix-presentation-visual-regressions.yml
          git commit -m "fix: stabilize combat presentation visuals"
          git push origin HEAD:feat/presentation-system-pr1
