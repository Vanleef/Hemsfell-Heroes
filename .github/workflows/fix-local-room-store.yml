name: Fix local room store

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.title == '[bot] fix local room store'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch durable development room store
        shell: python
        run: |
          from pathlib import Path

          p=Path('app/api/rooms/store.ts')
          text=p.read_text(encoding='utf-8')
          text=text.replace('import { onlineCombatInteractionView } from "../../rules-engine/online-combat.mjs";\n\nconst memoryRooms = new Map<string, Room>();\nconst useMemoryStore = () => process.env.NODE_ENV === "development";', 'import { onlineCombatInteractionView } from "../../rules-engine/online-combat.mjs";\nimport { readDevelopmentRoom, writeDevelopmentRoom } from "./dev-store.mjs";\n\nconst useDevelopmentStore = () => process.env.NODE_ENV === "development";')
          text=text.replace('  if (useMemoryStore()) return cloneMemory(id);', '  if (useDevelopmentStore()) return readDevelopmentRoom(id) as Promise<Room | null>;')
          text=text.replace('  if (useMemoryStore()) {\n    const current = memoryRooms.get(room.id);\n    if (room.revision === 0 ? !!current : !current || Number(current.revision) !== room.revision - 1) throw staleRevision();\n    memoryRooms.set(room.id, structuredClone(room));\n    return;\n  }', '  if (useDevelopmentStore()) {\n    await writeDevelopmentRoom(room);\n    return;\n  }')
          text=text.replace('const cloneMemory = (id: string) => structuredClone(memoryRooms.get(id) ?? null);\n', '')
          if 'memoryRooms' in text or 'useMemoryStore' in text:
              raise SystemExit('legacy in-memory dev store references remain')
          p.write_text(text,encoding='utf-8')

          Path('app/api/rooms/dev-store.mjs').write_text(r'''import { mkdir, readFile, rename, writeFile } from "node:fs/promises";
import { tmpdir } from "node:os";
import { join } from "node:path";

const ROOT = process.env.HEMSFELL_DEV_ROOM_DIR || join(tmpdir(), "hemsfell-heroes-dev-rooms");
const safeId = (id) => {
  const value = String(id || "");
  if (!/^room-[a-z0-9-]+$/i.test(value)) throw new Error("invalid room id");
  return value;
};
const pathFor = (id) => join(ROOT, `${safeId(id)}.json`);
const stale = () => new Error("stale room revision");

export async function readDevelopmentRoom(id) {
  try {
    return JSON.parse(await readFile(pathFor(id), "utf8"));
  } catch (error) {
    if (error?.code === "ENOENT") return null;
    throw error;
  }
}

export async function writeDevelopmentRoom(room) {
  await mkdir(ROOT, { recursive: true });
  const target = pathFor(room.id);
  if (Number(room.revision) === 0) {
    try {
      await writeFile(target, JSON.stringify(room), { encoding: "utf8", flag: "wx" });
      return;
    } catch (error) {
      if (error?.code === "EEXIST") throw stale();
      throw error;
    }
  }
  const current = await readDevelopmentRoom(room.id);
  if (!current || Number(current.revision) !== Number(room.revision) - 1) throw stale();
  const temp = `${target}.${process.pid}.${crypto.randomUUID()}.tmp`;
  await writeFile(temp, JSON.stringify(room), "utf8");
  await rename(temp, target);
}
''',encoding='utf-8')

          Path('tests/local-room-store.test.mjs').write_text(r'''import assert from "node:assert/strict";
import test from "node:test";
import { mkdtemp, rm } from "node:fs/promises";
import { tmpdir } from "node:os";
import { join } from "node:path";

const root = await mkdtemp(join(tmpdir(), "hemsfell-room-test-"));
process.env.HEMSFELL_DEV_ROOM_DIR = root;
const { readDevelopmentRoom, writeDevelopmentRoom } = await import(`../app/api/rooms/dev-store.mjs?test=${Date.now()}`);

test("development room survives independent reads and revisions", async () => {
  const room={id:"room-test-abc123",revision:0,status:"waiting",host:{token:"secret"},guest:null};
  await writeDevelopmentRoom(room);
  assert.deepEqual(await readDevelopmentRoom(room.id), room);
  const next={...room,revision:1,status:"deck-selection"};
  await writeDevelopmentRoom(next);
  assert.deepEqual(await readDevelopmentRoom(room.id), next);
});

test("development room rejects stale and duplicate writes", async () => {
  const room={id:"room-test-def456",revision:0,status:"waiting"};
  await writeDevelopmentRoom(room);
  await assert.rejects(()=>writeDevelopmentRoom(room), /stale room revision/);
  await assert.rejects(()=>writeDevelopmentRoom({...room,revision:2}), /stale room revision/);
});

test.after(async()=>{await rm(root,{recursive:true,force:true});});
''',encoding='utf-8')
      - name: Focused regression
        run: node --test tests/local-room-store.test.mjs tests/multiplayer-store.test.mjs tests/multiplayer-store-fallback.test.mjs
      - name: Online typecheck
        run: npm run typecheck:online
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/rooms/store.ts app/api/rooms/dev-store.mjs tests/local-room-store.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(multiplayer): persist local rooms across route bundles"
          git push origin HEAD:fix/cards_mechanics
