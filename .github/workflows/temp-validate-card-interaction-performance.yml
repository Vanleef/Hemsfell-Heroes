name: Temporary card interaction performance validation

on:
  push:
    branches:
      - fix/card-target-animation-hand-performance-20260904

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Vercel-equivalent build
        id: build
        shell: bash
        run: |
          set +e
          npm run vercel-build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-interaction-build-log
          path: build.log
          if-no-files-found: error
      - name: Propagate build result
        if: always()
        shell: bash
        run: exit "${{ steps.build.outputs.status }}"
