name: Fix card preview regression

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore previews and side-pile inspection
        run: |
          python - <<'PY'
          from pathlib import Path

          layout_path = Path('app/layout.tsx')
          layout = layout_path.read_text()
          import_line = 'import CardPreviewRuntime from "./card-preview-runtime";\n'
          if import_line not in layout:
              anchor = 'import OnlineReconnectRuntime from "./online-reconnect-runtime";\n'
              if anchor not in layout:
                  raise SystemExit('layout import anchor not found')
              layout = layout.replace(anchor, anchor + import_line, 1)
          if '<CardPreviewRuntime />' not in layout:
              anchor = '        <OnlineReconnectRuntime />\n        {children}'
              if anchor not in layout:
                  raise SystemExit('layout render anchor not found')
              layout = layout.replace(anchor, '        <OnlineReconnectRuntime />\n        <CardPreviewRuntime />\n        {children}', 1)
          layout_path.write_text(layout)

          page_path = Path('app/page.tsx')
          page = page_path.read_text()
          old = '<OriginalCard key={`${card.id}-${index}`} card={card} small inspectable={false}/>'
          new = '<OriginalCard key={`${card.id}-${index}`} card={card} small inspectable/>'
          count = page.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one side-pile non-inspectable card, found {count}')
          page_path.write_text(page.replace(old, new, 1))

          preview_test_path = Path('tests/card-preview-collection-quality.test.mjs')
          preview_test = preview_test_path.read_text()
          mount_test = '''\n\ntest("card preview runtime is mounted globally in the root layout", async () => {\n  const layout = await readFile(new URL("../app/layout.tsx", import.meta.url), "utf8");\n  assert.match(layout, /import CardPreviewRuntime from ["']\\.\\/card-preview-runtime["']/);\n  assert.match(layout, /<CardPreviewRuntime\\s*\\/>/);\n});\n'''
          if 'card preview runtime is mounted globally in the root layout' not in preview_test:
              insert_after = '''test("card preview uses Floating UI middleware and a body-level portal", () => {\n  assert.equal(typeof packageJson.dependencies["@floating-ui/react"], "string");\n  assert.match(runtime, /FloatingPortal/);\n  assert.match(runtime, /offset\\(/);\n  assert.match(runtime, /flip\\(/);\n  assert.match(runtime, /shift\\(/);\n  assert.match(runtime, /size\\(/);\n  assert.match(runtime, /whileElementsMounted: autoUpdate/);\n  assert.match(matchCss, /body > \\[data-floating-ui-portal\\]/);\n});\n'''
              if insert_after not in preview_test:
                  raise SystemExit('preview test insertion anchor not found')
              preview_test = preview_test.replace(insert_after, insert_after + mount_test, 1)
          preview_test_path.write_text(preview_test)

          grave_test_path = Path('tests/graveyard-collection-priority-ui.test.mjs')
          grave_test = grave_test_path.read_text()
          inspect_test = '''\n\ntest("graveyard and Extra Deck cards can open detailed inspection", async () => {\n  const page = await readFile(new URL("../app/page.tsx", import.meta.url), "utf8");\n  const modal = page.match(/function CardZoneModal[\\s\\S]*?function SearchDeckModal/)?.[0] ?? "";\n  assert.ok(modal, "expected CardZoneModal source");\n  assert.match(modal, /<OriginalCard[^>]*card=\\{card\\}[^>]*small[^>]*inspectable\\s*\\/>/);\n  assert.doesNotMatch(modal, /inspectable=\\{false\\}/);\n  assert.match(page, /hemsfell:inspect-card/);\n  assert.match(page, /setShowInspector/);\n});\n'''
          if 'graveyard and Extra Deck cards can open detailed inspection' not in grave_test:
              grave_test += inspect_test
          grave_test_path.write_text(grave_test)
          PY

      - name: Run focused preview regressions
        run: node --test tests/card-preview-collection-quality.test.mjs tests/graveyard-collection-priority-ui.test.mjs tests/layout-import-integrity.test.mjs

      - name: Remove temporary workflow before canonical gate
        run: rm .github/workflows/fix-card-preview-regression.yml

      - name: Validate canonical rules suite
        run: npm run test:rules

      - name: Validate AI strategic benchmark
        run: npm run ai:calibrate:benchmark

      - name: Validate production build
        run: npm run vercel-build

      - name: Check patch cleanliness
        run: git diff --check

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.tsx app/page.tsx tests/card-preview-collection-quality.test.mjs tests/graveyard-collection-priority-ui.test.mjs .github/workflows/fix-card-preview-regression.yml
          git commit -m "fix: restore card previews and pile inspection"
          git fetch origin feat/web-card-game-quality-foundation
          git rebase origin/feat/web-card-game-quality-foundation
          git push origin HEAD:feat/web-card-game-quality-foundation
