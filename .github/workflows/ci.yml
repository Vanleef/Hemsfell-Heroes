name: Apply Ngoro maintenance compatibility

on:
  push:
    branches:
      - fix/online-single-attack-combat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compatibility patch
        run: python scripts/fix_ngoro_maintenance_compat.py
      - name: Restore normal CI and remove helper
        run: |
          rm scripts/fix_ngoro_maintenance_compat.py
          git show 9ef10a460558f8c04c8c574dec0d582244d897a0:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rules-engine/engine-base.mjs .github/workflows/ci.yml scripts/fix_ngoro_maintenance_compat.py
          git commit -m "fix: preserve Ngoro maintenance event compatibility"
          git push
