name: Online local two-session E2E

on:
  pull_request:
    branches: [design/online-priority-flow-rework]
    types: [synchronize, reopened, ready_for_review]

concurrency:
  group: online-local-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install app and browser driver
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright-core@1.55.0
          google-chrome --version
      - name: Start Hemsfell server
        run: |
          (npm run dev > /tmp/hemsfell-dev.log 2>&1 &)
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/hemsfell-dev.log; exit 1
      - name: Run two-session Online match
        id: e2e
        shell: bash
        run: |
          set +e
          node --input-type=module <<'NODE' > /tmp/online-local-e2e.log 2>&1
          import { chromium } from 'playwright-core';
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:3000';
          const browser=await chromium.launch({headless:true,channel:'chrome'});
          const contexts=await Promise.all([browser.newContext({viewport:{width:1440,height:1000}}),browser.newContext({viewport:{width:1440,height:1000}})]);
          const host=await contexts[0].newPage(),guest=await contexts[1].newPage();
          const log=console.log;
          const btns=async p=>(await p.locator('button:visible').allTextContents()).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
          async function online(p){await p.goto(base,{waitUntil:'networkidle'});await p.getByRole('button',{name:/Jogar Online/i}).click()}
          async function phase(p,text){const b=p.locator('.phase-orb > button').filter({hasText:text}).first();await b.waitFor({state:'visible',timeout:15000});return b}
          async function priorityClick(p){let last;for(let i=0;i<20;i++){try{const b=p.getByRole('button',{name:'Passar prioridade'}).first();await b.waitFor({state:'visible',timeout:2500});await b.click({timeout:2500});return}catch(e){last=e;await p.waitForTimeout(120)}}throw last}
          async function passPair(a,b){await priorityClick(a);await priorityClick(b)}
          async function maintenance(p){const b=p.getByRole('button',{name:/Expandir energia/i});await b.waitFor({state:'visible',timeout:18000});await b.click();await phase(p,'Combate');assert.match(((await p.locator('.phase-track .active').textContent())||''),/Principal/i)}
          async function full(p){const a=p.getByRole('button',{name:/Resposta: Assistido/i});if(await a.count()&&await a.first().isVisible())await a.first().click();await p.getByRole('button',{name:/Resposta: Full Control/i}).waitFor({state:'visible',timeout:7000})}
          async function resolveCombatChoice(p){await p.waitForTimeout(350);const d=p.locator('.engine-target-decision-backdrop');if(!(await d.isVisible().catch(()=>false)))return;const target=p.locator('.player-field .creature-slot[data-slot="1"] .original-card');await target.waitFor({state:'visible',timeout:10000});await target.click();await d.waitFor({state:'hidden',timeout:15000});log('   Escolha de alvo do início do Combate resolvida.')}
          async function enterCombat(actor,opponent){await (await phase(actor,'Combate')).click();await passPair(opponent,actor);await resolveCombatChoice(actor);await actor.waitForTimeout(350);if(await actor.getByRole('button',{name:'Passar prioridade'}).first().isVisible().catch(()=>false))await passPair(actor,opponent);await phase(actor,'Encerrar combate')}
          async function finishTurn(actor,opponent){await enterCombat(actor,opponent);await (await phase(actor,'Encerrar combate')).click();await passPair(opponent,actor);if(await actor.getByRole('button',{name:'Passar prioridade'}).first().isVisible().catch(()=>false))await passPair(actor,opponent)}
          const vanilla=new Set(['Cidadão de Sel Kanthar','Cidadão Enfurecido','Meretriz','Fazendeiro Irado']);
          async function playableVanilla(p){const cards=p.locator('.player-hand .original-card:not([disabled])');for(let i=0;i<await cards.count();i++){const c=cards.nth(i);if(vanilla.has(await c.getAttribute('aria-label'))&&await c.getAttribute('draggable')==='true')return c}return null}
          async function enemyLife(p){const text=(await p.locator('.hero-power-trigger[data-hero-role="enemy"] .hero-life').textContent())||'';return Number(text.match(/\d+/)?.[0]||NaN)}
          try{
            log('1. Duas sessões independentes.');await Promise.all([online(host),online(guest)]);
            await host.getByRole('button',{name:/Criar sala e gerar convite/i}).click();const link=host.locator('.room-link input');await link.waitFor({state:'visible',timeout:15000});const invite=await link.inputValue();assert.match(invite,/room=/);log('2. Sala criada.');
            await guest.goto(invite,{waitUntil:'networkidle'});await guest.getByRole('button',{name:/Aceitar convite/i}).click();await host.getByText(/2 jogadores conectados/i).waitFor({state:'visible',timeout:15000});log('3. Guest conectado.');
            await host.locator('.room-deck-row select').waitFor({state:'visible',timeout:15000});await guest.locator('.room-deck-row select').waitFor({state:'visible',timeout:15000});await host.locator('.room-deck-row select').selectOption('zayan');await guest.locator('.room-deck-row select').selectOption('zayan');await host.getByRole('button',{name:/Confirmar este deck/i}).click();await guest.getByRole('button',{name:/Confirmar este deck/i}).click();log('4. Decks confirmados.');
            let starter,defender;for(let i=0;i<60;i++){const h=host.getByRole('button',{name:'Eu começo'}),g=guest.getByRole('button',{name:'Eu começo'});if(await h.count()&&await h.isVisible()){starter=host;defender=guest;await h.click();break}if(await g.count()&&await g.isVisible()){starter=guest;defender=host;await g.click();break}await host.waitForTimeout(250)}assert.ok(starter&&defender);log('5. Início escolhido.');
            await starter.getByRole('button',{name:/^Manter \d+/}).waitFor({state:'visible',timeout:15000});await defender.getByRole('button',{name:/^Manter \d+/}).waitFor({state:'visible',timeout:15000});await starter.getByRole('button',{name:/^Manter \d+/}).click();await defender.getByRole('button',{name:/^Manter \d+/}).click();log('6. Mulligan concluído.');
            await maintenance(starter);await full(starter);await full(defender);log('7. Manutenção autoritativa → Principal; Full Control nos dois lados.');
            let card=await playableVanilla(starter);for(let i=0;!card&&i<6;i++){await finishTurn(starter,defender);await maintenance(defender);await finishTurn(defender,starter);await maintenance(starter);card=await playableVanilla(starter)}assert.ok(card,'Nenhuma criatura vanilla jogável.');const name=await card.getAttribute('aria-label'),handBefore=await starter.locator('.player-hand .original-card').count();log(`8. Jogando ${name}.`);await card.dragTo(starter.locator('.player-field .creature-slot[data-slot="1"]'));await passPair(defender,starter);await starter.locator('.player-field .creature-slot[data-slot="1"] .original-card').waitFor({state:'visible',timeout:18000});assert.equal(await starter.locator('.player-hand .original-card').count(),handBefore-1);log('9. playCard resolveu após prioridade bilateral.');
            await starter.waitForTimeout(2600);await finishTurn(starter,defender);await maintenance(defender);await finishTurn(defender,starter);await maintenance(starter);log('10. Troca de turno completa e retorno ao jogador inicial.');
            await enterCombat(starter,defender);const attacker=starter.locator('.player-field .original-card.combat-attack-ready').first();await attacker.waitFor({state:'visible',timeout:12000});const lifeBefore=await enemyLife(starter);assert.ok(Number.isFinite(lifeBefore));await attacker.click();await passPair(defender,starter);const noBlock=defender.getByRole('button',{name:/NÃO BLOQUEAR/i});await noBlock.waitFor({state:'visible',timeout:18000});await noBlock.click();let lifeAfter=lifeBefore;for(let i=0;i<60;i++){await starter.waitForTimeout(250);lifeAfter=await enemyLife(starter);if(lifeAfter<lifeBefore)break}assert.ok(lifeAfter<lifeBefore,`Dano de combate não chegou ao estado autoritativo: ${lifeBefore} -> ${lifeAfter}`);log(`11. Ataque direto resolvido: vida inimiga ${lifeBefore} → ${lifeAfter}.`);
            const errors=[...await starter.locator('.room-error:visible').allTextContents(),...await defender.locator('.room-error:visible').allTextContents()];assert.deepEqual(errors,[]);log('12. LOCAL TWO-SESSION ONLINE E2E PASSOU.');
          }catch(e){console.error('LOCAL E2E FAILED:',e?.stack||e);console.error('HOST BUTTONS:',await btns(host).catch(()=>[]));console.error('GUEST BUTTONS:',await btns(guest).catch(()=>[]));throw e}finally{await browser.close()}
          NODE
          code=$?;echo "code=$code" >> "$GITHUB_OUTPUT";exit 0
      - name: Publish local E2E result to PR 26
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.e2e.outputs.code }}
          GH_REPO: ${{ github.repository }}
        run: |
          status="FAILED"; [ "$EXIT_CODE" = "0" ] && status="PASSED"
          { echo "Local two-session Online E2E: **$status** (exit $EXIT_CODE)"; echo; echo '```text'; tail -n 240 /tmp/online-local-e2e.log; echo '```'; } > /tmp/pr-comment.md
          gh api "repos/$GH_REPO/issues/26/comments" --method POST -F body=@/tmp/pr-comment.md
      - name: Fail when E2E failed
        if: steps.e2e.outputs.code != '0'
        run: exit 1
