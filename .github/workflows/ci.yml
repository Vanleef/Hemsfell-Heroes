name: Diagnose Online maintenance hotfix

on:
  push:
    branches:
      - fix/online-single-attack-combat

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Validate and capture output
        id: validate
        shell: bash
        run: |
          set +e
          npm run vercel-build > /tmp/online-validation.log 2>&1
          code=$?
          tail -n 120 /tmp/online-validation.log > /tmp/online-validation-tail.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish diagnostic to PR 26
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.validate.outputs.code }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          status="FAILED"
          if [ "$EXIT_CODE" = "0" ]; then status="PASSED"; fi
          {
            echo "Online maintenance validation: **$status** (exit $EXIT_CODE)"
            echo
            echo '```text'
            cat /tmp/online-validation-tail.log
            echo '```'
          } > /tmp/pr-comment.md
          gh api "repos/$GH_REPO/issues/26/comments" --method POST -F body=@/tmp/pr-comment.md
      - name: Fail job when validation failed
        if: steps.validate.outputs.code != '0'
        run: exit 1
