name: Diagnose Online maintenance hotfix

on:
  push:
    branches:
      - fix/online-single-attack-combat

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Validate full project
        id: validate
        shell: bash
        run: |
          set +e
          npm run vercel-build > /tmp/online-validation.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish validation result to PR 26
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.validate.outputs.code }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          status="FAILED"
          if [ "$EXIT_CODE" = "0" ]; then status="PASSED"; fi
          {
            echo "Repaired Online maintenance full validation: **$status** (exit $EXIT_CODE)"
            echo
            echo '```text'
            if [ "$EXIT_CODE" = "0" ]; then
              tail -n 80 /tmp/online-validation.log
            else
              grep -n -B 18 -A 40 -E 'not ok|ERR_ASSERTION|AssertionError|Error:|Failed|FAIL' /tmp/online-validation.log | tail -n 180 || tail -n 180 /tmp/online-validation.log
            fi
            echo '```'
          } > /tmp/pr-comment.md
          gh api "repos/$GH_REPO/issues/26/comments" --method POST -F body=@/tmp/pr-comment.md
      - name: Fail job when validation failed
        if: steps.validate.outputs.code != '0'
        run: exit 1
