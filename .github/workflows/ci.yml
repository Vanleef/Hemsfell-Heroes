name: CI

on:
  push:
    branches:
      - main
      - fix/cards_mechanics
      - codex/optimization-cleanup
      - ui/fixed-board-composition
      - refactor/responsive-css-cleanup
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Rules, card audit and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run rules tests
        run: npm run test:rules

      - name: Export full card implementation audit
        run: npm run audit:cards:full

      - name: Build Next.js application
        run: npm run vercel-build
