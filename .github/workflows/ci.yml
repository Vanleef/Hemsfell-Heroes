name: CI

on:
  push:
    branches:
      - main
      - feat/web-card-game-quality-foundation
      - fix/cards_mechanics
      - optimization-cleanup
      - ai/advanced-opponent-system
      - fix/response-uruk-priority-rules
      - refactor/consolidate-scripts
      - refactor/consolidate-css
      - codex/optimization-cleanup
      - ui/fixed-board-composition
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build:
    name: Rules, lint, types, card audit and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Verify requested source commit
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only 5cd8a6cd1cccc455031972810e4c71479c1cf06d..HEAD | grep -Ev '^\.github/workflows/(ci|client-decomposition-priority)\.yml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected concurrent source changes after 5cd8a6cd:"
            echo "$unexpected"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Apply client decomposition and priority-mode fix
        shell: bash
        run: |
          set -euo pipefail
          git show ff6d313972b6da13437df9e75ef7125dcff1832a:.github/workflows/client-decomposition-priority.yml > /tmp/original-client-refactor.yml
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/original-client-refactor.yml').read_text().splitlines()
          start=lines.index('      - name: Extract client priority and combat presentation')
          run_index=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')+1
          end=next(i for i in range(run_index,len(lines)) if lines[i].startswith('      - name: Validate focused priority behavior'))
          Path('/tmp/apply-client-refactor.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines[run_index:end])+'\n')
          PY
          bash /tmp/apply-client-refactor.sh

          python - <<'PY'
          from pathlib import Path
          import subprocess

          page_path=Path('app/page.tsx')
          page=page_path.read_text()
          base=subprocess.check_output(
              ['git','show','5cd8a6cd1cccc455031972810e4c71479c1cf06d:app/page.tsx'],
              text=True,
          )
          preserved_start=base.index('\nfunction VisualEffect(')
          preserved_end=base.index('\nfunction ResponseModal(',preserved_start)
          preserved=base[preserved_start:preserved_end]
          insertion=page.index('\nfunction MulliganModal(')
          assert '\nfunction PlayerHero(' not in page
          page_path.write_text(page[:insertion]+preserved+page[insertion:])

          test_path=Path('tests/responsive-match-ui.test.mjs')
          test=test_path.read_text()
          old='''const [css, page] = await Promise.all([\n  readFile(new URL("../app/match-ui.css", import.meta.url), "utf8"),\n  readFile(new URL("../app/page.tsx", import.meta.url), "utf8"),\n]);\n'''
          new='''const [css, page, priorityUi] = await Promise.all([\n  readFile(new URL("../app/match-ui.css", import.meta.url), "utf8"),\n  readFile(new URL("../app/page.tsx", import.meta.url), "utf8"),\n  readFile(new URL("../app/match/priority-ui.tsx", import.meta.url), "utf8"),\n]);\n'''
          assert old in test
          test=test.replace(old,new,1)
          test=test.replace('''  assert.match(page, /Modo: Assistido/);\n  assert.match(page, /Modo: Manual/);\n  assert.doesNotMatch(page, /Resposta: Full Control/);\n''','''  assert.match(page, /PriorityControlToggle/);\n  assert.match(priorityUi, /Modo: Assistido/);\n  assert.match(priorityUi, /Modo: Manual/);\n  assert.doesNotMatch(page + priorityUi, /Resposta: Full Control/);\n''',1)
          test_path.write_text(test)
          PY

          python - <<'PY'
          from pathlib import Path
          policy=Path('app/match/priority-control-policy.mjs')
          text=policy.read_text()
          old='''export function requestPriorityControlChange({ mode, queuedMode = null, interactionActive }) {\n  const requestedMode = nextPriorityControlMode(queuedMode ?? mode);\n  return interactionActive\n    ? { mode, queuedMode: requestedMode }\n    : { mode: requestedMode, queuedMode: null };\n}\n'''
          new='''export function requestPriorityControlChange({ mode, queuedMode = null, interactionActive }) {\n  const requestedMode = nextPriorityControlMode(queuedMode ?? mode);\n  if (!interactionActive) return { mode: requestedMode, queuedMode: null };\n  return requestedMode === mode\n    ? { mode, queuedMode: null }\n    : { mode, queuedMode: requestedMode };\n}\n'''
          assert old in text
          policy.write_text(text.replace(old,new,1))

          test=Path('tests/client-priority-control.test.mjs')
          test_text=test.read_text()
          anchor='''test("fora de uma interação a troca de modo é imediata", () => {\n  assert.deepEqual(requestPriorityControlChange({ mode: "assisted", queuedMode: null, interactionActive: false }), { mode: "full-control", queuedMode: null });\n});\n'''
          extra='''\ntest("duplo toggle durante a mesma interação cancela a mudança agendada", () => {\n  const once = requestPriorityControlChange({ mode: "assisted", queuedMode: null, interactionActive: true });\n  assert.deepEqual(requestPriorityControlChange({ ...once, interactionActive: true }), { mode: "assisted", queuedMode: null });\n});\n'''
          assert anchor in test_text
          test.write_text(test_text.replace(anchor,anchor+extra,1))
          PY

          cat > app/match/priority-control-policy.d.ts <<'EOF'
          export type PriorityControlMode = "assisted" | "full-control";
          export type PriorityPending = { actor: 0 | 1; responder: 0 | 1; action: string; passes?: number; deadline?: number } | null;
          export function nextPriorityControlMode(mode: PriorityControlMode): PriorityControlMode;
          export function priorityWindowKey(pending: PriorityPending): string | null;
          export function requestPriorityControlChange(input: { mode: PriorityControlMode; queuedMode?: PriorityControlMode | null; interactionActive: boolean }): { mode: PriorityControlMode; queuedMode: PriorityControlMode | null };
          export function flushQueuedPriorityControl(input: { mode: PriorityControlMode; queuedMode?: PriorityControlMode | null; interactionActive: boolean }): { mode: PriorityControlMode; queuedMode: PriorityControlMode | null };
          export function shouldShowPriorityWindow(input: { pending: PriorityPending; owner?: 0 | 1; mode: PriorityControlMode; hasUsableResponse: boolean }): boolean;
          export function shouldAutoPassPriorityWindow(input: { pending: PriorityPending; owner?: 0 | 1; mode: PriorityControlMode; hasUsableResponse: boolean }): boolean;
          EOF

          cat > app/match/combat-animation.tsx <<'EOF'
          "use client";

          import { RemoteCardArt } from "../remote-card-art";

          type CombatStage = "declared" | "priority" | "choosing" | "charging" | "impact" | "resolved";
          type CombatCard = { page: number; name: string };
          type CombatPresentation = {
            attackerOwner: 0 | 1;
            attackerCard: CombatCard;
            defenderCard?: CombatCard;
            targetHero?: boolean;
            stage: CombatStage;
            result?: string;
            destroyed?: string[];
            winnerText?: string;
            attackDamage?: number;
            counterDamage?: number;
          };

          export function CombatAnimation({action,attackerHero,defenderHero}:{action:CombatPresentation;attackerHero:string;defenderHero:string}){
           const title=action.stage==="declared"?"ATAQUE DECLARADO":action.stage==="priority"?"PRIORIDADE DE RESPOSTA":action.stage==="choosing"?"DECISÃO DO DEFENSOR":action.stage==="charging"?"ATAQUE EM CURSO":action.stage==="impact"?"IMPACTO":"COMBATE RESOLVIDO";
           const detail=action.stage==="declared"?`${action.attackerCard.name} declarou um ataque.`:action.stage==="priority"?"Antes da defesa, feitiços Acelerados e efeitos de resposta podem alterar o confronto.":action.stage==="choosing"?"O defensor pode bloquear com uma criatura válida ou receber o dano diretamente no herói.":action.stage==="charging"?`${action.attackerCard.name} avança contra ${action.targetHero?defenderHero:action.defenderCard?.name||"o defensor"}.`:action.stage==="impact"?"Ofensividade, Vitalidade e palavras-chave estão sendo resolvidas.":action.result||"O ataque foi concluído.";
           return <section className={`combat-cinematic owner-${action.attackerOwner} stage-${action.stage}`} aria-live="polite">
            <header><span>{title}</span><b>{action.attackerOwner===0?"SEU ATAQUE":"ATAQUE ADVERSÁRIO"}</b></header>
            <div className="combat-duel">
             <article className={`combatant combat-attacker ${action.destroyed?.includes("attacker")?"combat-destroyed":""}`}><RemoteCardArt page={action.attackerCard.page} name={action.attackerCard.name} priority/>{action.stage==="resolved"&&action.counterDamage!==undefined&&<em className="combat-damage">-{action.counterDamage}</em>}<p><small>{attackerHero}</small><b>{action.attackerCard.name}</b>{action.destroyed?.includes("attacker")&&<strong>AO CEMITÉRIO</strong>}</p></article>
             <div className="combat-track"><i></i><strong>⚔</strong><i></i></div>
             <article className={`combatant combat-defender ${action.destroyed?.includes("defender")?"combat-destroyed":""}`}>{action.defenderCard?<RemoteCardArt page={action.defenderCard.page} name={action.defenderCard.name} priority/>:<span>♛</span>}{action.stage==="resolved"&&action.attackDamage!==undefined&&<em className="combat-damage">-{action.attackDamage}</em>}<p><small>{defenderHero}</small><b>{action.defenderCard?.name||(action.targetHero?"Herói escolhido":"Aguardando escolha")}</b>{action.destroyed?.includes("defender")&&<strong>AO CEMITÉRIO</strong>}</p></article>
            </div>
            <footer>{action.winnerText&&<b>{action.winnerText}</b>}<span>{detail}</span></footer>
           </section>
          }
          EOF

          cat > tests/online-assisted-response-autopass.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";
          import { legalPriorityResponses, shouldAutoPass } from "../app/rules-engine/priority.mjs";
          import { syncPriorityMetadata } from "../app/rules-engine/priority-state.mjs";

          const accelerated = (id, { cost = 0, target = null } = {}) => ({
            id, uid: id, name: id, type: "Feitiço", cost, text: "Acelerado", tags: ["Acelerado"],
            diagnostics: { source: "explicit", unsupported: 0 },
            abilities: [{ id: `${id}-play`, trigger: "onPlay", costs: [], effects: target ? [{ type: "damage", amount: 1, target }] : [{ type: "draw", amount: 1 }] }],
          });
          const player = (hand = [], reserve = 0) => ({ heroId: "gimble", level: 1, life: 30, maxLife: 30, energy: 0, maxEnergy: 3, reserve, hand, deck: [{ id: "draw", type: "Criatura", cost: 0, abilities: [], tags: [], subtypes: [] }], extraDeck: [], grave: [], obscuro: [], board: [], support: [], terrain: null, abilityUses: {}, markers: {}, heroXP: 0 });
          const responseState = (responderHand = [], responderReserve = 0) => syncPriorityMetadata({ active: 0, phase: "principal", round: 3, events: 0, winner: null, players: [player(), player(responderHand, responderReserve)], pendingAction: { type: "playCard", owner: 0, cardId: "root" }, pendingResponse: { responder: 1, actor: 0, action: "root", passes: 0 } });

          test("Assisted auto-passes immediately when responder has no legal action", () => {
            const game = responseState();
            assert.deepEqual(legalPriorityResponses(game, 1), []);
            assert.equal(shouldAutoPass(game, 1, "assisted"), true);
            assert.equal(shouldAutoPass(game, 1, "full-control"), false);
          });
          test("an Acelerado without enough reserve does not hold Assisted priority", () => {
            const game = responseState([accelerated("fast", { cost: 2 })], 1);
            assert.deepEqual(legalPriorityResponses(game, 1), []);
            assert.equal(shouldAutoPass(game, 1, "assisted"), true);
          });
          test("an Acelerado with no valid required target does not hold Assisted priority", () => {
            const game = responseState([accelerated("targeted", { target: "enemyCreature" })], 0);
            assert.deepEqual(legalPriorityResponses(game, 1), []);
            assert.equal(shouldAutoPass(game, 1, "assisted"), true);
          });
          test("a genuinely executable Acelerado keeps the response window open", () => {
            const game = responseState([accelerated("free")], 0);
            assert.ok(legalPriorityResponses(game, 1).some((command) => command.cardId === "free"));
            assert.equal(shouldAutoPass(game, 1, "assisted"), false);
          });
          test("Assisted auto-pass keeps one client recovery path and one authoritative server drain after client extraction", async () => {
            const [runtime, page, machine, hook, policy] = await Promise.all([
              readFile(new URL("../app/online-match-runtime.tsx", import.meta.url), "utf8"),
              readFile(new URL("../app/page.tsx", import.meta.url), "utf8"),
              readFile(new URL("../app/api/rooms/machine.ts", import.meta.url), "utf8"),
              readFile(new URL("../app/match/use-priority-control.ts", import.meta.url), "utf8"),
              readFile(new URL("../app/match/priority-control-policy.mjs", import.meta.url), "utf8"),
            ]);
            assert.match(page, /usePriorityControl/);
            assert.match(page, /onAutoPass:\(\)=>passPriorityWindow\(0,true\)/);
            assert.match(hook, /shouldAutoPassPriorityWindow/);
            assert.match(hook, /priorityWindowKey\(getCurrentPendingRef\.current\(\)\) !== key/);
            assert.match(policy, /mode === PRIORITY_CONTROL_ASSISTED/);
            assert.match(policy, /&& !hasUsableResponse/);
            assert.match(machine, /function drainEmptyAssistedPriority/);
            assert.match(machine, /online-priority:server-assisted-auto-pass/);
            assert.doesNotMatch(runtime, /shouldAutoPass|passPriority|ASSISTED_PASS_DELAY_MS|POLL_MS/);
          });
          EOF

          cat > tests/hero-priority-ui.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { readFile } from "node:fs/promises";

          test("human priority UI exposes hero abilities and assisted mode does not auto-pass them after extraction",async()=>{
           const [page,priorityUi,policy]=await Promise.all([
            readFile(new URL("../app/page.tsx",import.meta.url),"utf8"),
            readFile(new URL("../app/match/priority-ui.tsx",import.meta.url),"utf8"),
            readFile(new URL("../app/match/priority-control-policy.mjs",import.meta.url),"utf8"),
           ]);
           assert.match(page,/heroPriorityResponses/);
           assert.match(page,/hasUsablePriorityResponse/);
           assert.match(page,/onHeroAbility=\{chooseHeroResponse\}/);
           assert.match(priorityUi,/Habilidade ativa do Herói/);
           assert.match(policy,/mode === PRIORITY_CONTROL_ASSISTED/);
           assert.match(policy,/&& !hasUsableResponse/);
           assert.doesNotMatch(page,/priorityControl==="full-control"\|\|hasUsableAcceleratedResponse\(game,0\)/);
          });
          EOF

          python - <<'PY'
          from pathlib import Path
          path=Path('tests/hero-inspector-guide.test.mjs')
          text=path.read_text()
          old="source.indexOf('function CombatAnimation')"
          new="source.indexOf('function MulliganModal')"
          assert old in text
          path.write_text(text.replace(old,new,1))
          PY

      - name: Validate focused priority behavior
        run: node --test tests/client-priority-control.test.mjs tests/online-assisted-response-autopass.test.mjs tests/hero-priority-ui.test.mjs tests/hero-inspector-guide.test.mjs

      - name: Validate canonical project state
        run: npm run prepare:project

      - name: Run rules tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee /tmp/hemsfell-test-rules.log

      - name: Upload rules test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-test-diagnostics
          path: /tmp/hemsfell-test-rules.log
          if-no-files-found: error
          retention-days: 1

      - name: Run AI strategic benchmark
        run: npm run ai:calibrate:benchmark

      - name: Lint advanced AI surfaces
        run: >-
          npx eslint app/rules-engine/ai-system/*.ts scripts/ai-calibration.ts scripts/ai-selfplay.ts tests/advanced-ai.test.mjs
          --rule '@typescript-eslint/no-explicit-any: off'

      - name: Report repository-wide legacy lint debt
        continue-on-error: true
        run: npm run lint

      - name: Report repository-wide legacy type debt
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Export full card implementation audit
        run: npm run audit:cards:full

      - name: Upload card implementation audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: card-implementation-audit
          path: docs/card-implementation-audit.json
          if-no-files-found: error

      - name: Build Next.js application
        run: npm run vercel-build

      - name: Inspect and commit validated client refactor
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git show 5cd8a6cd1cccc455031972810e4c71479c1cf06d:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f .github/workflows/client-decomposition-priority.yml
          git add -- \
            .github/workflows/ci.yml \
            app/page.tsx \
            app/match/priority-control-policy.mjs \
            app/match/priority-control-policy.d.ts \
            app/match/use-priority-control.ts \
            app/match/priority-ui.tsx \
            app/match/combat-animation.tsx \
            tests/client-priority-control.test.mjs \
            tests/online-assisted-response-autopass.test.mjs \
            tests/hero-priority-ui.test.mjs \
            tests/hero-inspector-guide.test.mjs \
            tests/responsive-match-ui.test.mjs
          git diff --cached --check
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: isolate client priority flow and mode switching"
          git push origin HEAD:feat/web-card-game-quality-foundation
