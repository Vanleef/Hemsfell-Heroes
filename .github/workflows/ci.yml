name: Validate Online maintenance hotfix

on:
  push:
    branches:
      - fix/online-single-attack-combat

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full project validation
        run: npm run vercel-build
      - name: Restore normal CI only after success
        env:
          CI_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          Path('.github/workflows/ci.yml').write_bytes(base64.b64decode(os.environ['CI_B64']))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "chore: cleanup Online maintenance validation"
          git push
