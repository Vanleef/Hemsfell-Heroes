name: CI

on:
  push:
    branches:
      - main
      - feat/web-card-game-quality-foundation
      - fix/cards_mechanics
      - optimization-cleanup
      - ai/advanced-opponent-system
      - fix/response-uruk-priority-rules
      - refactor/consolidate-scripts
      - refactor/consolidate-css
      - codex/optimization-cleanup
      - ui/fixed-board-composition
      - fix/mobile-responsive-layout-20260831
      - feat/targeting-hero-ui-20260903
      - refactor/performance-mobile-architecture-20260905
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Rules, lint, types, card audit and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project maintenance contracts
        run: npm run prepare:project

      - name: Typecheck AI surfaces
        run: npm run typecheck:ai

      - name: Typecheck online surfaces
        run: npm run typecheck:online

      - name: Run node rules and regression tests
        run: npm run test:node

      - name: Run AI strategic benchmark
        run: npm run ai:calibrate:benchmark

      - name: Lint advanced AI surfaces
        run: >-
          npx eslint app/rules-engine/ai-system/*.ts scripts/ai-calibration.ts scripts/ai-selfplay.ts tests/advanced-ai.test.mjs
          --rule '@typescript-eslint/no-explicit-any: off'

      - name: Report repository-wide legacy lint debt
        continue-on-error: true
        run: npm run lint

      - name: Report repository-wide legacy type debt
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Export full card implementation audit
        run: npm run audit:cards:full

      - name: Upload card implementation audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: card-implementation-audit
          path: docs/card-implementation-audit.json
          if-no-files-found: error

      - name: Generate static card art
        run: npm run cards:art:generate

      - name: Build Next.js application
        run: npm run build:next

  discover-node-regression-groups:
    if: github.ref == 'refs/heads/refactor/performance-mobile-architecture-20260905'
    name: Discover node regression groups
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build diagnostic matrix
        id: matrix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('tests').filter((name) => name.endsWith('.test.mjs')).sort();
          const groupSize = 6;
          const include = [];
          for (let index = 0; index < files.length; index += groupSize) {
            const group = files.slice(index, index + groupSize);
            include.push({
              label: group.map((name) => name.replace(/\.test\.mjs$/, '')).join(' + '),
              files: group.map((name) => `tests/${name}`).join(' '),
            });
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          NODE

  node-regression-groups:
    if: github.ref == 'refs/heads/refactor/performance-mobile-architecture-20260905'
    needs: discover-node-regression-groups
    name: Node ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-node-regression-groups.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression group
        shell: bash
        run: node --test --test-skip-pattern="^game client routes migrated cards through the command engine$" ${{ matrix.files }}
