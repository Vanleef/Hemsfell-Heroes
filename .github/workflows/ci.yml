name: CI

on:
  push:
    branches:
      - main
      - fix/cards_mechanics
      - codex/optimization-cleanup
      - ui/fixed-board-composition
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build:
    name: Rules, card audit and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply conditional Draconic Image migration once
        if: github.event_name == 'push' && github.ref == 'refs/heads/ui/fixed-board-composition'
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'requiredName: effect.oldName' app/rules-engine/effects.mjs; then
            echo 'Conditional Image migration already applied.'
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-conditional-illusion-fix.mjs')
          text = path.read_text()
          text = text.replace('`Substituir ${effect.oldName}`', r'\`Substituir \${effect.oldName}\`')
          text = text.replace('`Escolha uma Imagem de ${effect.oldName} que você controla.`', r'\`Escolha uma Imagem de \${effect.oldName}\` que você controla.')
          path.write_text(text)
          PY

          node scripts/apply-conditional-illusion-fix.mjs
          npm run audit:cards:full

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/rules-engine/effects.mjs app/page.tsx app/layout.tsx package.json scripts/export-card-implementation-audit.mjs tests/rules-engine.test.mjs tests/illusion-rules.test.mjs docs/card-implementation-audit.md docs/card-implementation-audit.json
          git commit -m 'fix(rules): make draconic illusion target conditional'
          git push origin HEAD:ui/fixed-board-composition

      - name: Run rules tests
        run: npm run test:rules

      - name: Export full card implementation audit
        run: npm run audit:cards:full

      - name: Upload card implementation audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: card-implementation-audit
          path: docs/card-implementation-audit.json
          if-no-files-found: error

      - name: Build Next.js application
        run: npm run vercel-build
