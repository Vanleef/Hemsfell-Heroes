name: Apply online maintenance hotfix

on:
  push:
    branches:
      - fix/online-single-attack-combat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply maintenance command repair
        run: python scripts/apply_online_maintenance_hotfix.py
      - name: Remove patch helper
        run: rm scripts/apply_online_maintenance_hotfix.py
      - name: Commit functional hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/rules-engine/engine-base.mjs app/api/rooms/machine.ts tests/online-maintenance-choice.test.mjs .github/workflows/ci.yml scripts/apply_online_maintenance_hotfix.py
          git commit -m "fix: restore authoritative Online maintenance"
          git push
