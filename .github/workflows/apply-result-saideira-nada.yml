name: Apply result Saideira Nada fixes

on:
  push:
    branches:
      - ai/advanced-opponent-system
    paths:
      - '.github/result-saideira-nada-run.txt'
  pull_request:
    branches:
      - ai/advanced-opponent-system
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: ai/advanced-opponent-system
          fetch-depth: 0
      - name: Apply canonical source changes
        run: python .github/scripts/apply-result-saideira-nada.py
      - name: Install dependencies
        run: npm ci
      - name: Validate AI types
        run: npm run typecheck:ai
      - name: Run regression suite
        run: npm run test:node
      - name: Commit canonical integration
        run: |
          rm -f .github/result-saideira-nada-run.txt
          rm -f .github/scripts/apply-result-saideira-nada.py
          rm -f .github/workflows/apply-result-saideira-nada.yml
          git config user.name "Hemsfell CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize match result and Quarion replay effects"
          git push origin HEAD:ai/advanced-opponent-system
