name: Finalize P1 Deck Builder

on:
  push:
    branches:
      - feat/web-card-game-quality-foundation
    paths:
      - scripts/finalize-p1-builder.mjs
      - .github/workflows/finalize-p1-builder.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-card-game-quality-foundation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update stale interaction contract
        run: node scripts/finalize-p1-builder.mjs
      - name: Validate persistent deck builder
        run: node --test tests/user-deck-model.test.mjs tests/online-user-deck-authority.test.mjs tests/persistent-deck-builder.test.mjs
      - name: Remove one-off validation artifacts before canonical gate
        run: |
          rm -f scripts/finalize-p1-builder.mjs
          rm -f scripts/diagnose-p1-tests.mjs
          rm -f p1-test-diagnostic.txt
          rm -f .github/workflows/p1-current-suite-diagnostic.yml
          rm -f .github/workflows/finalize-p1-builder.yml
      - name: Validate complete rules suite
        run: npm run test:rules
      - name: Validate AI strategic benchmark
        run: npm run ai:calibrate:benchmark
      - name: Validate production build
        run: npm run vercel-build
      - name: Commit validated P1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: finalize persistent authoritative deck builder"
          git push origin HEAD:feat/web-card-game-quality-foundation
