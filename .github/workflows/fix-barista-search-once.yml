name: Fix Barista Search Once
on:
  push:
    branches: [fix/cards_mechanics]
    paths:
      - scripts/patch-barista-search-ui.mjs
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
      - name: Apply Barista search UI patch
        run: node scripts/patch-barista-search-ui.mjs
      - name: Run focused regression
        run: node --test tests/barista-search-regression.test.mjs
      - name: Commit canonical fix and remove temporary patch files
        run: |
          rm scripts/patch-barista-search-ui.mjs .github/workflows/fix-barista-search-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx tests/barista-search-regression.test.mjs scripts/patch-barista-search-ui.mjs .github/workflows/fix-barista-search-once.yml
          git diff --cached --quiet || git commit -m "fix: make Barista Cat search confirm valid Coffee"
          git push origin HEAD:fix/cards_mechanics
