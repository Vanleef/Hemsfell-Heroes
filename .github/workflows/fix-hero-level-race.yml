name: Fix hero level race
on:
  push:
    branches: [fix/cards_mechanics]
    paths: [.github/workflows/fix-hero-level-race.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/fix-hero-level-race.py
      - run: npm ci
      - run: chmod +x scripts/*.sh
      - run: node --test tests/hero-level-race.test.mjs tests/hero-priority-response.test.mjs tests/bot-priority-sync.test.mjs
      - run: npm run build
      - name: Commit repair
        run: |
          rm .github/scripts/fix-hero-level-race.py .github/workflows/fix-hero-level-race.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/ui-overrides.css tests/hero-level-race.test.mjs .github/scripts/fix-hero-level-race.py .github/workflows/fix-hero-level-race.yml
          git commit -m "fix: preserve hero evolution and compact command text"
          git push origin HEAD:fix/cards_mechanics
# rerun after correcting Ngoro regression assertion
