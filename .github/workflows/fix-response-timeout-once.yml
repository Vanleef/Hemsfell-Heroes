name: Fix Response Timeout Once

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - .github/workflows/fix-response-timeout-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - name: Apply patch
        run: node scripts/patch-response-timeout.mjs
      - name: Run focused regression
        run: node --test tests/cafe-pingado-priority-regression.test.mjs
      - name: Commit repair and remove temporary patch files
        run: |
          rm .github/workflows/fix-response-timeout-once.yml scripts/patch-response-timeout.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/match-ui-guard.tsx tests/cafe-pingado-priority-regression.test.mjs .github/workflows/fix-response-timeout-once.yml scripts/patch-response-timeout.mjs
          git commit -m "fix: auto-pass expired response windows"
          git push origin HEAD:fix/cards_mechanics
