name: Temporary Online Risk Hardening

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - scripts/online-risk-hardening.mjs
      - .github/workflows/online-risk-hardening.yml
  pull_request:
    branches:
      - fix/cards_mechanics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-online:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Normalize temporary runner
        run: |
          python - <<'PY'
          path = "scripts/online-risk-hardening.mjs"
          lines = open(path, encoding="utf-8").readlines()
          idx = next(i for i, line in enumerate(lines) if "route stale catch present" in line)
          start = idx
          while start >= 0 and "source = requireReplace(" not in lines[start]:
              start -= 1
          end = idx
          while end < len(lines) and lines[end].strip() != ");":
              end += 1
          if start < 0 or end >= len(lines):
              raise SystemExit("could not normalize runner")
          del lines[start:end + 1]
          open(path, "w", encoding="utf-8").writelines(lines)
          PY
      - name: Apply online hardening patches
        run: node scripts/online-risk-hardening.mjs
      - name: Run focused online regressions
        run: node --test tests/online-authoritative-audit.test.mjs tests/online-clock-authority.test.mjs tests/online-risk-hardening.test.mjs
      - name: Run rules suite
        run: npm run test:rules
      - name: Typecheck online surfaces
        run: npx tsc -p tsconfig.online.json --noEmit
      - name: Remove temporary runner
        run: rm -f scripts/online-risk-hardening.mjs .github/workflows/online-risk-hardening.yml
      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: close remaining online authority risks"
          git push origin HEAD:fix/cards_mechanics
