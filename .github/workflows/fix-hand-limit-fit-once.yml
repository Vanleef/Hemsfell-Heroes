name: Fix Hand Limit Fit Once

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - scripts/patch-hand-limit-fit.mjs
      - .github/workflows/fix-hand-limit-fit-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards_mechanics
          fetch-depth: 0
      - name: Apply adaptive hand limit layout patch
        run: node scripts/patch-hand-limit-fit.mjs
      - name: Run focused regression
        run: node --test tests/hand-limit-layout-regression.test.mjs
      - name: Commit canonical fix and remove temporary patch files
        run: |
          rm .github/workflows/fix-hand-limit-fit-once.yml scripts/patch-hand-limit-fit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/match-ui-guard.tsx app/ui-overrides.css tests/hand-limit-layout-regression.test.mjs .github/workflows/fix-hand-limit-fit-once.yml scripts/patch-hand-limit-fit.mjs
          git commit -m "fix: fit hand limit choices between copy and confirm"
          git push origin HEAD:fix/cards_mechanics
