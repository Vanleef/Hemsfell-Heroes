name: Apply support and turn counter fix

on:
  push:
    branches:
      - fix/cards_mechanics
    paths:
      - scripts/apply-support-turn-counter-fix.mjs
      - package.json
      - .github/workflows/apply-support-turn-counter-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply canonical rules migration
        run: npm run rules:migrate
      - name: Verify rules suite
        run: node --test tests/*.test.mjs
      - name: Persist generated rule changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add app/rules-engine/compiler.mjs app/rules-engine/engine.mjs app/rules-engine/effects.mjs app/rules-engine/card-rules.mjs
          if git diff --cached --quiet; then
            echo 'Rule files already canonical.'
            exit 0
          fi
          git commit -m 'fix(rules): enforce support adjacency and canonical card counters'
          git push origin HEAD:fix/cards_mechanics
