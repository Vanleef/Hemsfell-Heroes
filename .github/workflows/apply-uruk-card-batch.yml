name: Apply Uruk card mechanics batch

on:
  push:
    branches: ["fix/response-uruk-priority-rules"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/response-uruk-priority-rules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch canonical rules and UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"patch point not found: {label}")
              return text.replace(old, new, 1)

          # ---- card rules: make the affected Uruk cards data-driven ----
          path = "app/rules-engine/card-rules.mjs"
          s = read(path)
          marker = '  p57: [ability("onPlay", [effect("reduceEnemyAttackUntilControllerMaintenance", { amount: 2 }), effect("grantNextElementEffect", { element: "Fogo", keyword: "Sufocado", duration: "untilNextTurn" })])],'
          insert = '''  p55: [ability("onPlay", [effect("damage", { amount: 1, target: "anyCreature", selections: 1 })], [], { playCondition: { anyCreatureInPlay: true } })],
  p56: [ability("onPlay", [effect("damage", { amount: 1, target: "anyCreature", selections: 2, minimumSelections: 1 }), effect("grantNextElementEffect", { element: "Fogo", keyword: "Sufocado", duration: "untilNextTurn" })], [], { playCondition: { anyCreatureInPlay: true } })],
  p60: [ability("activated", [effect("gainEnergy", { amount: 3, destination: "reserve" }), effect("destroy", { target: "self" })], [{ type: "tap", amount: 1 }], { uiActivation: true, availability: { reserveBelow: 3 } })],
''' + marker
          s = once(s, marker, insert, "insert p55 p56 p60")
          s = once(s,
            '  p64: [ability("onPlay", [effect("damageByAdjacentCount", { target: "anyCreature", selections: 1, baseAmount: 1, perAdjacent: 1 }), effect("grantNextElementEffect", { element: "Água", keyword: "Congelado", duration: "untilNextTurn" })])],',
            '  p64: [ability("onPlay", [effect("damageByAdjacentCount", { target: "anyCreature", selections: 1, baseAmount: 1, perAdjacent: 1 }), effect("grantNextElementEffect", { element: "Água", keyword: "Congelado", duration: "untilNextTurn" })])],\n  p65: [ability("onPlay", [effect("returnToHandAndTaxNextCreature", { target: "anyCreature", selections: 1, amount: 1 }), effect("grantNextElementEffect", { element: "Água", keyword: "Congelado", duration: "untilNextTurn" })])],',
            "insert p65")
          s = once(s,
            '  p71: [ability("onSpellCast", [effect("gainEnergy", { amount: 1, destination: "reserve" })], [], { condition: { firstEachTurn: true, spellElement: "Ar" } })],\n  p72: [ability("onSpellCast", [effect("heal", { amount: 3, target: "controllerHero" })], [], { condition: { firstEachTurn: true, spellElement: "Água" } })],',
            '  p71: [ability("onSpellCast", [effect("gainEnergy", { amount: 1, destination: "reserve" })], [], { condition: { firstEachTurn: true, spellElement: "Ar", controllerReserveBelow: 3 } })],\n  p72: [ability("onSpellCast", [effect("heal", { amount: 3, target: "controllerHero" })], [], { condition: { firstEachTurn: true, spellElement: "Água" } })],',
            "mastery air water")
          s = once(s,
            '  p62: [ability("onPlay", [effect("grantCharacterDamageShield", { target: "anyCharacter", selections: 1, uses: 1, duration: "turn" }), effect("grantNextElementEffect", { element: "Ar", keyword: "Atordoado", duration: "untilNextTurn" })])],',
            '  p62: [ability("onPlay", [effect("grantHeroDamageShield", { uses: 1, duration: "turn" }), effect("grantNextElementEffect", { element: "Ar", keyword: "Atordoado", duration: "untilNextTurn" })])],',
            "bubble shield")
          s = once(s,
            '  p70: [ability("onPlay", [effect("moveSelf", { destination: "grave" }), effect("controllerChoice", { choices: [[effect("createUniqueImage", { name: "Maestria Elemental: Piromancia" })], [effect("createUniqueImage", { name: "Maestria Elemental: Hidromancia" })], [effect("createUniqueImage", { name: "Maestria Elemental: Geomancia" })], [effect("createUniqueImage", { name: "Maestria Elemental: Aeromancia" })]] })])],\n  p73: [ability("onSpellCast", [effect("geomancyChoice", { amount: 3, minimum: 1 })], [], { condition: { firstEachTurn: true, spellElement: "Terra" } })],\n  p77:',
            '  p70: [ability("onPlay", [effect("moveSelf", { destination: "grave" }), effect("createSelectedUniqueImage", { names: ["Maestria Elemental: Piromancia", "Maestria Elemental: Hidromancia", "Maestria Elemental: Geomancia", "Maestria Elemental: Aeromancia"] })])],\n  p73: [ability("onSpellCast", [effect("geomancyChoice", { amount: 3, minimum: 1, optional: true })], [], { condition: { firstEachTurn: true, spellElement: "Terra", anyCreatureInPlay: true } })],\n  p74: [ability("onSpellCast", [effect("markPyromancySpell", { additionalDamage: 2, trample: true })], [], { condition: { firstEachTurn: true, spellElement: "Fogo" } })],\n  p76: [ability("static", [effect("keyword", { keyword: "Defensor 2" })]), ability("onEnter", [effect("keyword", { target: "self", keyword: "Robusto" })], [], { condition: { controllerSpellsCastThisTurnAtLeast: 1 } })],\n  p78: [ability("onSpellCast", [effect("modifyStats", { target: "self", attack: 1, health: 0, duration: "permanent" })])],\n  p77:',
            "mastery choice geomancy pyro golem archmage")
          write(path, s)

          # ---- targeting: optional 1..2 distinct targets ----
          path = "app/rules-engine/targeting.mjs"
          s = read(path)
          s = once(s,
            '    return Array.from({ length: Number(effect.selections) || 1 }, () => ({\n      scope,\n      role: "effect",\n      requireExhausted: !!effect.requireExhausted,\n      requiredSubtype: effect.requiredSubtype,\n      requiresDamagedOwnerThisTurn: effect.type === "destroyIfDamagedControllerThisTurn" || !!effect.requiresDamagedOwnerThisTurn,\n    }));',
            '    const count = Number(effect.selections) || 1;\n    const minimum = effect.minimumSelections == null ? count : Math.max(0, Number(effect.minimumSelections));\n    return Array.from({ length: count }, (_, index) => ({\n      scope,\n      role: "effect",\n      optional: index >= minimum,\n      requireExhausted: !!effect.requireExhausted,\n      requiredSubtype: effect.requiredSubtype,\n      requiresDamagedOwnerThisTurn: effect.type === "destroyIfDamagedControllerThisTurn" || !!effect.requiresDamagedOwnerThisTurn,\n    }));',
            "optional target steps")
          s = once(s,
            '    selections: steps.length,\n    sacrifice: sacrificeSteps.length > 0,',
            '    selections: steps.length,\n    minimumSelections: steps.filter((step) => !step.optional).length,\n    sacrifice: sacrificeSteps.length > 0,',
            "policy minimum selections")
          write(path, s)

          # ---- card activation: availability and creature non-tap activations ----
          path = "app/card-activation.mjs"
          s = read(path)
          s = once(s,
            '  if (ability.availability?.topGraveHasTrigger) { const top = context.topGrave; if (!top || top.type !== "Criatura" || !compileCard(top).abilities.some((candidate) => candidate.trigger === ability.availability.topGraveHasTrigger)) return false; }\n  return ability.costs.every((cost) => {',
            '  if (ability.availability?.topGraveHasTrigger) { const top = context.topGrave; if (!top || top.type !== "Criatura" || !compileCard(top).abilities.some((candidate) => candidate.trigger === ability.availability.topGraveHasTrigger)) return false; }\n  if (ability.availability?.reserveBelow != null && (context.reserve ?? 0) >= ability.availability.reserveBelow) return false;\n  if (card.type !== "Criatura" && card.exhausted) return false;\n  return ability.costs.every((cost) => {',
            "activation availability")
          write(path, s)

          # ---- effects ----
          path = "app/rules-engine/effects.mjs"
          s = read(path)
          old = '''  damage(state, effect, context) {
    const ids = selectedIds(context); if (!ids.length) throw new RulesViolation("target-required");
    for (const targetId of ids) { const owner = heroOwner(context, targetId);
      if (owner != null) { const amount = Math.max(0, effect.amount ?? 0); player(state, owner).life -= amount; queueEvent(state, { type: "onPlayerDamaged", owner, sourceOwner: context.owner, sourceId: context.sourceId, source: context.effectSource, amount }); if (amount > 0) queueEvent(state, { type: "onAttachedCreatureDamage", owner: context.owner, sourceId: context.sourceId, source: context.effectSource, targetIds: [targetId], amount }); continue; }
      const target = findUnit(state, targetId); if (!target) throw new RulesViolation("target-required");'''
          new = '''  damage(state, effect, context) {
    const ids = selectedIds(context); if (!ids.length) throw new RulesViolation("target-required");
    const empowerment = player(state, context.owner).spellEmpowerments?.[context.sourceId];
    const rawAmount = Math.max(0, (effect.amount ?? 0) + (empowerment?.additionalDamage || 0));
    for (const targetId of ids) { const owner = heroOwner(context, targetId);
      if (owner != null) { const entry = player(state, owner); const shield = (entry.damageShields || []).find((item) => item.uses > 0); let amount = rawAmount; if (shield) { shield.uses--; entry.damageShields = entry.damageShields.filter((item) => item.uses > 0); amount = 0; } entry.life -= amount; queueEvent(state, { type: "onPlayerDamaged", owner, sourceOwner: context.owner, sourceId: context.sourceId, source: context.effectSource, amount }); if (amount > 0) queueEvent(state, { type: "onAttachedCreatureDamage", owner: context.owner, sourceId: context.sourceId, source: context.effectSource, targetIds: [targetId], amount }); continue; }
      const target = findUnit(state, targetId); if (!target) throw new RulesViolation("target-required");
      const targetOwner = state.players.findIndex((entry) => (entry.board || []).includes(target));
      const healthBefore = (target.hp || 1) + (target.modifiers || []).reduce((sum, item) => sum + (item.health || 0), 0) - (target.damage || 0);'''
          s = once(s, old, new, "damage empowerment and hero shield")
          s = once(s,
            '      let dealt = Math.max(0, (effect.amount ?? 0) - (hasKeyword(target, /robusto/i) ? 1 : 0) - shieldReduction);',
            '      let dealt = Math.max(0, rawAmount - (hasKeyword(target, /robusto/i) ? 1 : 0) - shieldReduction);',
            "damage raw amount")
          s = once(s,
            '      target.damage = (target.damage || 0) + dealt;',
            '      target.damage = (target.damage || 0) + dealt;\n      if (empowerment?.trample && targetOwner >= 0 && dealt > Math.max(0, healthBefore)) player(state, targetOwner).life -= dealt - Math.max(0, healthBefore);',
            "spell trample")
          anchor = '  grantCharacterDamageShield(state, effect, context) { const id = context.targetIds?.[0], owner = heroOwner(context, id); if (owner != null) { const entry = player(state, owner); entry.damageShields ||= []; entry.damageShields.push({ uses: effect.uses || 1, sourceId: context.sourceId, expires: effect.duration }); } else defaultEffectHandlers.grantDamageShield(state, effect, context); },'
          extra = anchor + '''
  grantHeroDamageShield(state, effect, context) { const entry = player(state, context.owner); entry.damageShields ||= []; entry.damageShields.push({ uses: effect.uses || 1, sourceId: context.sourceId, expires: effect.duration || "turn" }); },
  returnToHandAndTaxNextCreature(state, effect, context) { const id = context.targetIds?.[0], target = findUnit(state, id); if (!target) throw new RulesViolation("target-required"); const targetOwner = state.players.findIndex((entry) => (entry.board || []).includes(target)); defaultEffectHandlers.returnToHand(state, { type: "returnToHand" }, context); if (targetOwner >= 0 && targetOwner !== context.owner) { const entry = player(state, targetOwner); entry.pendingCreatureTax = (entry.pendingCreatureTax || 0) + (effect.amount || 1); } },
  createSelectedUniqueImage(state, effect, context) { const name = context.selectedImageName; if (!name || !(effect.names || []).includes(name)) throw new RulesViolation("card-choice-required"); if (allUnits(state).some((card) => normalizedName(card.name) === normalizedName(name))) throw new RulesViolation("unique-image-already-present"); defaultEffectHandlers.createImage(state, { type: "createImage", name, destination: "field" }, context); },
  markPyromancySpell(state, effect, context) { const cardId = context.event?.cardId || context.event?.card?.id; if (!cardId) return; const entry = player(state, context.owner); entry.spellEmpowerments ||= {}; entry.spellEmpowerments[cardId] = { additionalDamage: effect.additionalDamage || 0, trample: !!effect.trample, round: state.round }; },'''
          s = once(s, anchor, extra, "new elemental handlers")
          s = once(s,
            '  geomancyChoice(state, effect, context) { queueDecision(state, { ...effect, choices: [[{ type: "reduceStatFloor", stat: "attack", amount: effect.amount, minimum: effect.minimum }], [{ type: "reduceStatFloor", stat: "health", amount: effect.amount, minimum: effect.minimum }]] }, context, "choice-target"); },',
            '  geomancyChoice(state, effect, context) { if (!state.players.some((entry) => (entry.board || []).length)) return; queueDecision(state, { ...effect, choices: [[{ type: "reduceStatFloor", stat: "attack", amount: effect.amount, minimum: effect.minimum }], [{ type: "reduceStatFloor", stat: "health", amount: effect.amount, minimum: effect.minimum }], []], optional: true }, context, "choice-target"); },',
            "optional geomancy")
          write(path, s)

          # ---- authoritative engine ----
          path = "app/rules-engine/engine-base.mjs"
          s = read(path)
          s = once(s,
            'function usageKey(source, ability) { return `${source.uid || source.id}:${ability.id}`; }\nfunction isOncePerTurnAbility(ability) { return ability?.trigger === "activated" || !!ability?.usageLimit || !!ability?.condition?.firstEachTurn; }\nfunction usageAvailable(state, source, owner, ability) { if (!isOncePerTurnAbility(ability)) return true; return !(state.players[owner].abilityUses || {})[usageKey(source, ability)]; }\nfunction claimUsage(state, source, owner, ability) { if (!isOncePerTurnAbility(ability)) return; state.players[owner].abilityUses ||= {}; state.players[owner].abilityUses[usageKey(source, ability)] = (state.players[owner].abilityUses[usageKey(source, ability)] || 0) + 1; }',
            'function usageKey(state, source, ability) { const suffix = ability?.condition?.firstEachTurn ? `:round-${state.round}` : ""; return `${source.uid || source.id}:${ability.id}${suffix}`; }\nfunction isOncePerTurnAbility(ability) { return ability?.trigger === "activated" || !!ability?.usageLimit || !!ability?.condition?.firstEachTurn; }\nfunction usageAvailable(state, source, owner, ability) { if (!isOncePerTurnAbility(ability)) return true; return !(state.players[owner].abilityUses || {})[usageKey(state, source, ability)]; }\nfunction claimUsage(state, source, owner, ability) { if (!isOncePerTurnAbility(ability)) return; state.players[owner].abilityUses ||= {}; const key = usageKey(state, source, ability); state.players[owner].abilityUses[key] = (state.players[owner].abilityUses[key] || 0) + 1; }',
            "round-scoped first each turn")
          s = once(s,
            '  if (condition.spellElement && !(event.card?.tags || eventCard?.tags || []).includes(condition.spellElement)) return false;',
            '  if (condition.spellElement && String(event.chosenElement || "").toLowerCase() !== String(condition.spellElement).toLowerCase() && !(event.card?.tags || eventCard?.tags || []).some((tag) => String(tag).toLowerCase() === String(condition.spellElement).toLowerCase()) && !new RegExp(`Elemento\\\\s*:\\\\s*${condition.spellElement}`, "i").test(event.card?.text || eventCard?.text || "")) return false;\n  if (condition.controllerReserveBelow != null && (state.players[owner].reserve || 0) >= condition.controllerReserveBelow) return false;\n  if (condition.anyCreatureInPlay && !state.players.some((entry) => (entry.board || []).length)) return false;\n  if (condition.controllerSpellsCastThisTurnAtLeast != null && (state.players[owner].turnSpellsPlayed || 0) < condition.controllerSpellsCastThisTurnAtLeast) return false;',
            "element and mastery conditions")
          s = once(s,
            'function playConditionMatches(state, owner, condition) {\n  if (!condition) return true;',
            'function playConditionMatches(state, owner, condition) {\n  if (!condition) return true;\n  if (condition.anyCreatureInPlay && !state.players.some((entry) => (entry.board || []).length)) return false;',
            "play condition creature")
          s = once(s,
            '  if (availability.controllerHasFaction && !permanentUnits(state.players[owner]).some((card) => (card.tags || []).some((tag) => String(tag).toLowerCase() === String(availability.controllerHasFaction).toLowerCase()))) return false;\n  return true;',
            '  if (availability.controllerHasFaction && !permanentUnits(state.players[owner]).some((card) => (card.tags || []).some((tag) => String(tag).toLowerCase() === String(availability.controllerHasFaction).toLowerCase()))) return false;\n  if (availability.reserveBelow != null && (state.players[owner].reserve || 0) >= availability.reserveBelow) return false;\n  return true;',
            "engine activation reserve")
          s = once(s,
            'function validateTargets(state, owner, abilities, command, source) {\n  const targetIds = command.targetIds || []; const steps = abilities.flatMap(abilityTargetSteps); if (steps.length !== targetIds.length) { if (steps.length || targetIds.length) throw new RulesViolation("invalid-target-count"); return; }\n  steps.forEach((step, index) => {',
            'function validateTargets(state, owner, abilities, command, source) {\n  const targetIds = command.targetIds || []; const steps = abilities.flatMap(abilityTargetSteps); const minimum = steps.filter((step) => !step.optional).length; if (targetIds.length < minimum || targetIds.length > steps.length) { if (steps.length || targetIds.length) throw new RulesViolation("invalid-target-count"); return; }\n  if (new Set(targetIds).size !== targetIds.length) throw new RulesViolation("duplicate-target");\n  steps.slice(0, targetIds.length).forEach((step, index) => {',
            "optional target validation")
          s = once(s,
            '    return Array.from({ length: effect.selections || 1 }, () => ({ scope, role: "effect", requireExhausted: !!effect.requireExhausted, requiredSubtype: effect.requiredSubtype, requiredName: effect.requiredName, imageOnly: !!effect.imageOnly, maxCost: effect.maxCost, requiresDamagedOwnerThisTurn: effect.type === "destroyIfDamagedControllerThisTurn" || !!effect.requiresDamagedOwnerThisTurn }));',
            '    const count = effect.selections || 1, minimum = effect.minimumSelections == null ? count : Math.max(0, Number(effect.minimumSelections)); return Array.from({ length: count }, (_, index) => ({ scope, role: "effect", optional: index >= minimum, requireExhausted: !!effect.requireExhausted, requiredSubtype: effect.requiredSubtype, requiredName: effect.requiredName, imageOnly: !!effect.imageOnly, maxCost: effect.maxCost, requiresDamagedOwnerThisTurn: effect.type === "destroyIfDamagedControllerThisTurn" || !!effect.requiresDamagedOwnerThisTurn }));',
            "engine optional steps")
          # Accelerated pages in both preflight and execution.
          s = s.replace('const accelerated = card.type === "Feitiço" && ((card.tags || []).some((tag) => /acelerado/i.test(tag)) || /^\\s*acelerado\\b/i.test(card.text || ""));', 'const accelerated = card.type === "Feitiço" && ([57,61,62,63,64,65].includes(Number(card.page)) || (card.tags || []).some((tag) => /acelerado/i.test(tag)) || /^\\s*acelerado\\b/i.test(card.text || ""));')
          # Creature tax in both cost calculations.
          s = s.replace('+ intrinsicCost(state, entry, card) + targetSurcharge', '+ intrinsicCost(state, entry, card) + (card.type === "Criatura" ? (entry.creatureCostTax || 0) : 0) + targetSurcharge')
          # Once a creature is successfully played, the accumulated tax is consumed.
          s = once(s,
            '        if (queuedDiscount) entry.nextCardDiscounts = (entry.nextCardDiscounts || []).filter((rule) => rule !== queuedDiscount); entry.hand.splice(cardIndex, 1);',
            '        if (queuedDiscount) entry.nextCardDiscounts = (entry.nextCardDiscounts || []).filter((rule) => rule !== queuedDiscount); if (card.type === "Criatura") entry.creatureCostTax = 0; entry.hand.splice(cardIndex, 1);',
            "consume creature tax")
          # Spell event carries chosen element.
          s = once(s,
            'if (spell) stack.push({ kind: "event", event: { type: "onSpellCast", owner: item.command.owner, cardId: card.id, card } });',
            'if (spell) stack.push({ kind: "event", event: { type: "onSpellCast", owner: item.command.owner, cardId: card.id, card, chosenElement: item.command.chosenElement } });',
            "chosen element event")
          # Non-creature activated auxiliaries turn even when the printed ability has no explicit tap cost.
          old = 'validateTargets(state, item.command.owner, [ability], item.command, source); validateCosts(state, ability, item.command); payCosts(state, ability, item.command); claimUsage(state, source, item.command.owner, ability);'
          new = 'validateTargets(state, item.command.owner, [ability], item.command, source); if (source.type !== "Criatura" && source.exhausted) throw new RulesViolation("ability-not-available"); validateCosts(state, ability, item.command); payCosts(state, ability, item.command); if (source.type !== "Criatura" && !(ability.costs || []).some((cost) => cost.type === "tap")) source.exhausted = true; claimUsage(state, source, item.command.owner, ability);'
          s = once(s, old, new, "auxiliary activations turn")
          # Hand-limit decision resolver.
          decision_anchor = '        if (decision.kind === "sacrifice-and-fill") {'
          hand_limit = '''        if (decision.kind === "hand-limit-discard") {
          const entry = state.players[item.command.owner], ids = [...new Set(item.command.selectedCardIds || [])], required = Math.max(0, entry.hand.length - 9);
          if (ids.length !== required || ids.some((id) => !entry.hand.some((card) => card.id === id || card.uid === id))) throw new RulesViolation("invalid-hand-limit-selection");
          for (const id of ids) { const index = entry.hand.findIndex((card) => card.id === id || card.uid === id); const card = entry.hand.splice(index, 1)[0]; if (card) entry.grave.push(card); }
          state.pendingDecision = null; stack.push(...continuation); continue;
        }
''' + decision_anchor
          s = once(s, decision_anchor, hand_limit, "hand limit decision resolver")
          # Optional Geomancy skip.
          s = once(s,
            '        if (decision.kind === "choice-target") {\n          if ((item.command.targetIds || []).length !== 1 || !findPermanentById(state, item.command.targetIds[0])) throw new RulesViolation("invalid-target");\n        }',
            '        if (decision.kind === "choice-target") {\n          const chosen = decision.effect.choices?.[item.command.choiceIndex];\n          if (decision.effect.optional && Array.isArray(chosen) && chosen.length === 0 && !(item.command.targetIds || []).length) { state.pendingDecision = null; stack.push(...continuation); continue; }\n          if ((item.command.targetIds || []).length !== 1 || !findPermanentById(state, item.command.targetIds[0])) throw new RulesViolation("invalid-target");\n        }',
            "geomancy decline")
          # Turn transition: activate Nuvem taxes, expire attack override, clear hero shields/empowerments.
          s = once(s,
            'const entry = state.players[state.active]; entry.abilityUses = {}; entry.subtypesEnteredThisTurn = {}; entry.turnCardsPlayed = 0; entry.turnSpellsPlayed = 0;',
            'const entry = state.players[state.active]; entry.abilityUses = {}; entry.subtypesEnteredThisTurn = {}; entry.turnCardsPlayed = 0; entry.turnSpellsPlayed = 0; entry.creatureCostTax = (entry.creatureCostTax || 0) + (entry.pendingCreatureTax || 0); entry.pendingCreatureTax = 0; state.players.forEach((candidate) => { candidate.damageShields = (candidate.damageShields || []).filter((shield) => shield.expires !== "turn" && shield.duration !== "turn"); candidate.spellEmpowerments = {}; for (const zone of ["hand","board","support"]) for (const card of candidate[zone] || []) if (card.attackOverrideUntilMaintenanceOwner === state.active) delete card.attackOverrideUntilMaintenanceOwner; });',
            "turn cleanup and taxes")
          # Hand limit is enforced on entering Finalization, before the player can end the turn.
          s = once(s,
            'if (state.phase === "fim") { stack.push({ kind: "event", event: { type: "onTurnEnd", owner: state.active } });',
            'if (state.phase === "fim") { const hand = state.players[state.active].hand || []; if (hand.length > 9 && !state.pendingDecision) state.pendingDecision = { kind: "hand-limit-discard", owner: state.active, effect: { amount: hand.length - 9 }, context: { owner: state.active }, sourceName: "Limite de mão" }; stack.push({ kind: "event", event: { type: "onTurnEnd", owner: state.active } });',
            "hand limit queue")
          write(path, s)

          # ---- engine wrapper: accelerated pages + elemental enhancements ----
          path = "app/rules-engine/engine.mjs"
          s = read(path)
          s = once(s,
            'const accelerated = (card) => (card?.tags || []).some((tag) => /acelerado/i.test(String(tag))) || /\\bacelerado\\b/i.test(String(card?.text || ""));',
            'const accelerated = (card) => [57,61,62,63,64,65].includes(Number(card?.page)) || (card?.tags || []).some((tag) => /acelerado/i.test(String(tag))) || /\\bacelerado\\b/i.test(String(card?.text || ""));',
            "wrapper accelerated pages")
          old = '''  if (!consumed.length) return;
  const selected = (command.targetIds || []).map((id) => unitById(after, id)).filter(Boolean);
  const targets = selected.length ? selected : (after.players[1 - command.owner].board || []);
